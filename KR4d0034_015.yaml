body:
  text: 太原郡太君王氏墓志太子少傅贈太子太􅍖忠憲韓公繼室夫人王氏太尉文正公旦之長女也初文正公在重位夫人長矣久擇壻不偶日有盛族扳求而文正公輒却之時忠憲公初第上謁文正公一見遂有意以夫人歸焉族間譁然以謂韓氏世不甚顯大而上有親老且嚴又前夫人蒲氏有子當教訓撫育於人情間實難以夫人少為族人所寵愛願於大家著姓為相宜文正公曰以吾女性孝而淑賢必能盡力於夫族且其節行易以顯亦足見吾家之法度焉族盛者驕惰恣放多以後事相誇逐是不喜吾女之所向此非渠輩所曉知也遂以夫人歸韓氏果能上承尊嫜奉忠憲公恂恂然舉動無一不中容禮者撫蒲之生若已所出文正公每見必謂之曰爾遂能履踐吾言出家人子所見使吾無所恨也忠憲為殿中丞封太原縣君及出守洋川留夫人寓外舍經時未嘗及闑外惟文正公召然後見歲時族人出嬉夫人亦獨留不往時諸子皆幼夫人課以詩書日使誦習文正薨召入中闈賜冠服名通宮籍以時獻見夫人以謂因緣遺恩又非從夫之寵每稱疾不行忠憲守青州急詔還臺署中夜有聲若盜將發户者左右駭甚請呼邏卒入以視夫人曰乃公不家而夜呼卒非便設有盜寧以畏死卒不可呼也性本間約所衣不過綈紵經歲未嘗有所更製晚節尤以清淡自樂日誦浮屠氏書其治家不尚嚴厲而事皆密有條記忠憲教諸子甚嚴夫人內以慈愛撫之間又勗以義理之説嘗曰乃父方正有法則為世所知汝曹若不效之外人將以為類我是彰我不德也其善訓如此忠憲為御史知雜時卒於京師享年四十四天聖五年六月二十日也景祐郊祀追封太原郡太君初夫人之喪藁葬於國門之南佛廟後十七年忠憲薨諸孤遂舉夫人之櫬合祔於許之長社縣某村之原以慶曆四年十一月五日之吉也所生男子七人曰綜太常博士集賢校大理評事曰緬太常寺太祝四登進士科皆有文聞於時京師士人論世子姓之盛者以韓氏為稱首非惟忠憲之訓肅嚴是亦夫人􅍖育善誘之所致女六人長適端眀殿學士兼翰林院侍讀學士給事中李淑次早卒次適大理評事蘇舜賔次適太常寺太祝王整二幼未嫁孫男十四人孫女十二人曽孫女一人某之皇妣為夫人之妹故能詳夫人之行焉今又為諸孤所託俾刻石納於壙中不敢誣飾為之銘云大理評事杜君墓志杜君叔溫終於慶曆辛已四月九日葬於慶曆甲申九月二日許州陽翟縣麥秀原即其地君始生十餘歲能通誦五經稍長學文精筆翰效杜子美作詩其徑峭嚴密指事泛情時時敻至絶處常恐以詩見名於世不肯數為使之有年而不息可勝言邪性灑然峻拔少所與合然外甚謙煦喜評論終日亹亹不倦在平陽幕郡將有率意放於治者君必以辨之雖老黠宿吏皆竦視莫敢移其説天章吳安道祕閣石曼卿皆當世偉人奉詔籍民兵於兩河獨延君計事君為條其未便安者二公歎息稱道之奄忽之前數月慨然棄官歸膝下嗚呼其知命歟享年二十有五官至大理評事簽署建雄軍節度判官事諱詵今樞密使吏部侍郎京兆公之長子娶崔氏一子曰振祕書省校書郎豫以叔溫親而又以文義相周旋辛已春豫病甚叔溫來升牀執豫手語言而去豫時為病所毒不甚辨尚意已必死不復見叔溫才三四日豫稍間而聞叔溫逝矣不覺震起一慟豫病復作今豫乃獨存而復恙每一念之令人悲酸况又見吾叔溫大葬且復志其平生可勝悲哉奉禮郎杜君妻清河張氏墓文婦氏張靜而溫承勗子文節孫十八齡婦杜欣睦族人孝所尊才三終長安後四載封秀原號慶曆直甲申秋季初實令辰地陽翟此寧魂淑而夭孰可論乳女一今始言石鑱文志沈魂兩浙路轉運使司封郎中王公墓表公諱雍字子肅世為魏人自烈祖祐􅍓職中某始有第京師太尉文正魏國公遭時奮庸相章聖皇帝著在國史復此不書公即文正公之長子幼而惇懿不妄言矣以文正公任為祕書省校書郎久之改大理評事時年已三十餘未始從政蓋文正公以清愼訓諸子而公亦恬於進取也文正公薨恩授光祿寺丞服除特授大理寺丞俄又遷太子中允同判太府寺故無同皆異恩也乾興中榮國夫人憂終喪入對賜五品服勾當馬步軍專勾司嘗以疾聞兩宮命中貴人勞問將太醫以診視之改殿中丞通判鄭州代還召升陛占對甚久上嘉歎之擢為郡牧判官纍更主客金部司勳員外充開封府界提點踰年上計賜金紫判鹽鐵案寶元初升祠部郎中京西轉運使丁母永康郡太君張氏喪既闋再領鹽鐵又判理欠憑由司慶曆三年出為淮南轉運按察使賜對便坐上美公效官􅍖家之才翌日特遷度支郎中詔留不行尋判户部句院眀年又遷司封又眀年春充兩浙轉運按察使是歲秋七月甲子考終於錢塘之官舍春秋五十八九月其子奉喪還都十月甲子葬於開封縣大邊村之先塋公生平仕宦所為必罄風力未嘗有一毫過差每改秩必抗章辭避若不勝任眀道中府界提點時歲旱蟲孽近甸艱食中出縑帛五十萬科賣民間取資以市粟公曰歲凶當發而斂民將不堪建議封帛中帑易緡錢坐倉以糴衆以為便眀年隕雹殺桑縷蠶弗孳公又上白用所封之縑以充常賦俾民納鏹以代焉許西之頓固歲誅旁民出薪木五萬餘以繕斗門公命伐官堤之樹以足用民是以休又時有餘稅不能輸者吏甚急之公請對具述京師天下根本當休養豐息之今不蠲貸是趣其流亡也上悉從之郡吏有捕蝗而暍音謁死者公為出賻給其家屬提薦才吏未嘗言按人當世號為長者其任計省也以都下府藏主吏歲輒一易往往匿其簿領用賂更他局新至者視物之浩繁弗能究知因循積十數任敗沒欺攘不可勝紀公奏擇他官按籍以察其交承以故物之耗登吏之姦廉盡可眀不復如故時迄今以為通制又天下嘗輸之貨郡吏部至京府有司必巧訾以動之至有蕩産伏辟而不能償之者公建言使定其窳濫逋欠之當理者令三司本判官覆察面辨之遂絶其弊民有貸息錢户已絶而籍不除有司閲籍責恩不巳及久年之逋皆錮其子孫什􅍖數百輩寒窶愁痛願以死償而未得公條陳其狀乞一切縱去朝廷從之公之區理事物窮姦恤隱如是者甚衆不可具道豫自幼出入公之家接侍公之起居迄於今踰三十年其久且詳可知矣竊觀其舉動飲食皆有常度不妄評論莫見好惡終日髙拱危坐冠服端整雖對近習未嘗有驕惰之色人或以事撓之終不愠見間或語言皆郁然有條以愼靖仁厚為之主作事有本末不尚銛鋭久而必立自文正公薨後數年文靖公入政府內外姻族之盛冠於當時公慤守家政以清約先已不為浮侈隳其世法嗚呼其有常德之君子者歟國朝丞子稍有立雖無他才朝廷必擢之美官若公者績效著白而雅意沖退復不喜緣家世親戚以取恩澤故門闋計府沒於郎署士大夫為之歎息焉公二弟沖任太子贊善大夫而卒宇量閎厚偉人也素見任刑部郎中知汝州剛峭善議論才敏過人臨事敢決無所屈豫謂資賦雖殊各得文正公之一體而公淵然澄泊議者為多二夫人皆先公沒前李氏大理卿湘之女後呂氏即文靖許國公之女也始封東平縣君許公薨進封安康郡君二子恰大理丞整太常寺太祝皆向學聞道久未可涯一女適殿中丞通判鄭州呂希傑公視豫為姊子公之亡豫適在江外二弟以豫知公之行驛求豫文表於墓故為直述以見世焉大理評事程君墓志銘有以純孝篤行著於吳里中者聞程君焉親疾齋戒蔬食以禱後因而不茹葷二十餘年幼喜酒病酲而母戒之自是終身不復飲既老得風痺之疾藥劑以有酒薦通行其力者家人白之君歎曰吾雖晚耄敢忘親言乎嗚呼食飲人欲之大君能因親之絶可謂純孝也歟里有駱生嘗以二寶帶密寄於君駱之死君即歸之其子不敢取又願分一以為遺公曰欺死受貨非吾所能為也族人離其資産君悉不受惟受諸女之孤鞠養之長歸士人吳人好鮮食君獨戒殺又樂賑人急難不間疏密凡鄉閭冠昏喪祭之法多取中焉君必隨其豐約而條處其事窶者或為資給之每觀書史必擇仁厚之言書於門牆以誦服焉卒之日鄉老皆為之泣下斯可謂之篤行也已君諱某字某於慶曆七年月日終于家夀六十八曽祖某仕錢氏為營田使祖某徙籍於蘇父某皆髙遁不仕夫人劉氏淵靜有法則奉承尊嫜接姻舊莊順之色夙夜不絶於顔內族人稱美之君之懿行聞於人夫人有助焉耳慶曆四年郊祀推恩以君為大理評事夫人為彭城縣君用子封也夫人享年六十有五先於君百日而終三子長某次某次師孟太常博士知南康軍才敏有聞所歷著治狀一女嫁桐廬令樂某孫男女十七人以眀年某月某日將合葬於蘇之某鄉太常君與豫同年登科授狀丏文以識其窆銘曰士大夫可罔以名鄉人不可欺以行誠久乃著宜昌其盛不在厥躬豈不有命夀弗天閼嗣則淑令族尊理榮乃終有慶刻文於窆從世所證廣陵郡太君墓志銘慶曆六年秋七月刑部郎中知制誥趙公概之夀母終於蘇之官舍踰月取塗於佛廟卜於眀年某月某日之吉護神輿還南都祔先侍郎之墓公疏其族氏見屬為文識諸壙云夫人姓髙氏世居青州之益都祖輦後唐為王府記室以詩名於時父某少喜孫吳兵法事楊光逺為帳下吏陰知光逺有異志遂逸去後光逺以逆誅乃間居不復出仕宦東人髙之生二子及夫人每歎曰此女若為男子吾門户復何憂邪夫人幼敏悟聞人誦詩書一過耳盡記不忘性淡泊不衣組繡不喜茹葷初侍郎通判密州夫人歸焉典訓闈中事皆有條緒始封千乘縣君侍郎先娶張氏有男女六人夫人煦育教誘過於已之所出生四子長曰眀允博學有器識季即公也餘皆先夫人而亡侍郎既沒家資盡窶夫人每聞諸子之賔至必解衣為貰酒脯使延之從容以講習道義故七子皆舉進士有聞於時公最幼自初能言夫人日自課以書使調四聲作詩賦十七歲舉進士既孤二十四年公登甲科後三年為著作郎直集賢院以恩封渤海縣太君又十年公知制誥拜章乞以一官及封爵食邑換夫人以郡封詔從爵邑之請自是遂為著例進封廣陵郡時年八十一眀年召中外親族當為昏姻者為處理辦給之又謂公曰爾當于近郡市居第以安族人及夏寢疾涉冬稍間因思食筍且曰可求補外南方地濕筍得早出也十二月公即屢削章詔守吳郡二月侍夫人東下夏以霖晦卑濕感疾甚篤一日指旁室曰此可作孝堂弔者至爾哭于某處居喪之禮當然也後數日食飲如平時忽曰今日中元吾其逝矣俄即瞑目嗚呼夫人有子如是婦節母道為時所師非以文而不朽也銘曰少愛于家擇賢以歸賔祭潔恭壼儀輝輝寡居教子卒觀雄飛睦族周乏楮無兼衣先識逺鑒審如神蓍疾雖沈綿不考筮醫緒言泠泠事物盡宜琢文陰壤庶永後希哀穆先生文并序嗚呼穆伯長以眀道元年夏客死于淮北道中友人蘇叔才子美作詩悼之遣人馳弔之痛夫道不光豫又次其一二行以鑑于世為文哀之先生字伯長名修幼嗜書不事章句必求道之本原皆記士徒無意處孰評論之性剛峭喜于背俗不肯下與庸人小合願交者多固拒之議事堅眀上下合古皆可録然好詆卿弼斥言時病謹細後生畏聞之又獨為古文其語深峭宏大羞為禮部格詩賦咸平中舉進士得出身調泰州司理參軍牧守稱其才二郡者惡之又嘗以言忤二郡者守病告二郡私黠吏使誣告先生賂具獄聚左證後召先生使衆參考之由是貶池州中道竄詣闕下叩登聞鼓稱冤會二郡者死復受譴于朝後纍恩得為蔡州參軍先生自廢來讀書益勤為文章益根柢于道然恥以文章有位以故困甚張文節守亳亳之士豪者作佛廟文節使以騎召先生作記記成竟不竄士名士以白金五斤遺之曰枉先生之文願以此為夀又使周旋者曰士所以遺者乞載名于石圖不朽耳既而亟召士讓之投金庭下遂俶裝去郡士謝之終不受常語人曰寧區區糊口為旅人終不為匪人辱吾文也天聖末丞相有欲置為學官者恥詣謁之竟不得常客京師南河邸中往往醉暮歸逖地如不省持者邸人猶聞其誦吟喟歎聲因隙窺之則張燈危坐苦臏執卷亦出曙用是貸其資母喪徒跣自負櫬成葬日誦孝經喪記未嘗觀佛書飯浮屠氏也識者憐哀之或厚遺則必為盜取去不然且病或妻子卒後得柳子厚文刻之值售者甚少踰年積得百緡一子輒死將還淮西道遇病氣結塞胸中不下遂卒嘻吁天之厭文久矣先生竟以黜廢窮苦終其身顧其道宜不容于今世然由賦數踦隻常罹兵賊惡少輩所辱困其節行至死不變有孤懦且幼遺文散墜不收伯長之道竟巳矣乎初先生死梁堅自解以書走上黨遺豫欲訪其文俾豫集序之去年赴京師􅍓問人終不復得一篇惟有任中正尚書家廟碑靜勝亭記徐生墓志蔡州塔記皆平昔所為又不足成卷今舅氏守蔡近以書使存其家且求其所著文字未至間作文哀之道不勝于命命不會于時吁嗟先生竟胡為祭舅氏文維年月日甥蘇某謹以清酌庶羞之奠致祭于大舅按察郎中之靈某放廢於朝旅泊胥臺殊鄉寡知動成嫌猜始未踰月舅以漕來連牽巨艘斾旌徘徊拜舅官亭羇顔一開語言煦煦閔慰兼該處以行署拔于荆柴異俗改眼歡然相陪曽不兩月遘兹凶災訃聞始至肝心裂摧百感惻惻淋漓淚腮慈幃之掩再更律灰觸事殞絶不能強排惟吾舅親他親莫偕如母之存實慰此懷不意忽奄孤心頓乖相閲令器朝家淑才不登年齡豈天所差執牽西送長江之隈丹旐的的素帆皠皠死生隔絶今又獨回致此薄奠庶將告哀尚饗祭滕子京文武功蘇某等謹以清酌庶羞之奠恭致祭于知府待制學士之靈惟靈稟之剛眀精于義斷學有根柢才無涯岸往在諫列讜論侃侃屢觸權要卒就貶竄提兵窮邊策畫貫穿士奮樂死戎讋而散謗起南逐曽不愁歎改麾于吳忽此凶變人已師􅍖國失蕃翰月然公庭屢奉談宴今哭而趨循視斂棺光儀精爽爛爛如見無以宣哀是用酌薦靈其來下歆此微奠嗚呼哀哉尚饗蘇學士文集卷第十五
