  text: 蘇學士文集卷第一
  hash: sha256:305b85e28f2834bb950d18723f7c1256c539c46953232b51fd4ee98f746aca78
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_001-1a}
body:
  text: 感興三首後寢藏衣冠前廟宅神主吾聞諸禮經此制出中古秦嬴食先法乃復祭於墓漢衣以月遊於道蓋無取宣帝尊祖廟失制遍九土孝元酌前文一旦悉除去魏帝樂銅臺遺令平置歌舞昏嗣竟從之此事狂夫阻唐制益紛華諸陵銷嬪御曠女日哀吟於先亦奚補吾朝三聖人乘雲不可覩威靈巳霄漢嗣皇念宗祖繪事移天光刻象肖神武遍敕舊遊地輸材起宮宇階墄扣以金牆壁衣之黼功既即奉迎法仗疊簫鼓玩好擇珍奇目奪不可數三京佛老家已有十數處朝家雖奉先越禮古不許君不祭臣僕又不祭支庶丹楹豈非孝聖貶甚蕭斧大祀當以時寢廟即其所惜哉共儉德乃為侈所蠱痛乎神聖姿遂與夷為侶蒼生何其愚瞻歎走㫄午賤子私自嗟傷時淚如雨在昔帝堯日光宅闢四門所賔無凶邪德教日益敦末世多濫姦九重嚴大閽扞掫主譏察誰何辨語言一關百力士列立甃石溫設官按尺籍唱號於未昏唐末稍懈怠嘗值外史奔京城凶豪兒奮劒闖帝藩狂呼嘯虎豹便欲傾乾坤賴有宰相在不然神器翻我朝講制度門籍反不存近知賤丈夫突入犯赤軒陛官未暇執呶呶何其喧祖宗創業難愼重在後昆勇夫猶重閉况乃天子尊何羅猶宜察况乃外寇屯興語一及此舌出反自捫吾家本寒微世受朝廷恩欲奏鴟梟詩當塗誰薦論瞽說聖所擇愚謀帝不罪况乎言有文白黑時利害前日林書生自謂胸臆大潛心托世病榮成謂可賣投顙觸諫函獻言何耿介云昨見凶星上帝下警戒意若日昏㧻出處恣蜂蠆安坐弄神器開門納珍賄宗支若繫囚親親禮日殺大臣尸其柄咋舌希龍拜速速伐虎叢無使自沈瘵陛下幸察之聰眀即不壞如忽賤臣言不瞬防禍敗一封朝飛入羣目已睚眦力夫暮塞門執縛不容喟十手捽其胡如負殺人債幽諸死牢中繫灼若龜蔡亦既下風指黥而播諸海長途萬餘里一錢不得帶必令朝夕閒渴飢死于械從前有口者蹜脰氣如鞴獨夫已去除易若吹糠稗奈何上帝眀非德不可蓋倏忽未十旬炎官下其怪乙夜紫禁中一燎不存芥天王下牀走倉猝畏挂礙連延舊寢廷頑失若空塞眀朝黃紙出大赦遍中外嗟乎林書生生命不可再翻令凶惡囚纍纍受恩貸慶州敗無戰王者師有備軍之志天下承平數十年此語雖存人所棄今歲西戎背世􅉀直隨秋風寇邊城屠殺熟户燒障堡十萬馳騁山嶽傾國家防塞今有誰官為承制乳臭兒酣觴大嚼乃事業何嘗識會兵之機符移大急搜卒乘意謂就戮如縛尸未成一軍之出戰驅逐急使緣嶮巇馬肥甲重士飽喘雖有弓劒何所施連顚自欲􅑁深谷虜騎笑指聲嘻嘻一麾發伏鴈行出山下奄截成重圍我軍免胄乞死所承制面縛交涕洟逡巡下令藝者全爭獻小技歌且吹其餘劓馘放之去東走矢液皆淋漓首無耳準若怪獸不自愧恥猶生歸守者沮氣陷者苦盡由主將之所為地機不見欲僥勝羞辱中國堪傷悲及第後與同年宴李丞相宅十年苦學文出語背時向榮力不自知藝圍輒棹鞅薄技遭休眀一第君所唱拔身泥滓砥飄迹雲霞上氣和朝言甘夢好夕魂王軒眉失舊斂舉意有斯况爽如秋後鷹榮若凱旋將台府張宴集吾輩縱謔浪花梢血點乾酒面玉紋漲狂歌互喧傳醉舞迭閬伉兹時實無營此樂亦以壯去去登顯涂幸無隳素尚升陽殿故址昔在開元中此名升陽殿西通大名宮夾道直如箭至尊黃金輿乘春日幸宴翠嬪戛鐘鼓歡呼奏新遍巧舞風燕翻奴歌露鶯囀酒光射錦幄上下花㑹炫雕盤堆繁英豔粉弱自戰天歡日無窮臣諫莫敢獻樂極哀繼之在理亦可見胡來塞宫闕腥羶汚香薦縱火寢廟平揮戈君臣迸庸嗣忽前醜泚巢福更亂冉冉竟覆亡返為耕牧便瓦礫雖費犂土壤頗肥衍蓋由殺人多膏血浸漬逺髑髏今成堆皆昔燕趙面每因鉏耨時數得寶玉片今秋雨澤多榖穗密如瓣農惟喜豐稔吾獨閔遷變不有失德君焉為穡夫佃大國尚如此小人易流轉道德可久長作詩將自勸大霧欲曉霜氣重不收餘陰乘勢相淹留化為大霧塞白晝咫尺不辨人與牛羣鳥啁啾滿庭樹欲飛恐遭羅網囚四簷暗藹下重幕微風吹過冷自流竊思朝廷政無濫未嘗一日封五侯何為終朝不肯散焉知其下無蚩尤思得壯士翻白日光照萬里銷我之沈憂藍田悟真寺作旅食長安城回遑奔走無停行清懷壯抱失素向胸中堆積塵土生偷閒得至玉峰下為聞悟真之寺之嘉名杖邛赤腳渡藍水細流激激心骨清仰看蒼山髙峰㫄白雲眀滅藏日光行人遙指置寺處正在白雲之中央逡巡緣棧更險絶攀蘿捫壁隨低昂眀行咫尺乃相失已與雲霧相翶翔時聞啼鳥如吹竹數步一休還縱目行行未知髙則危下視昏煙覆平陸滿巖佳樹尤朴􅈪赫赤如霞間濃緑是時八月初路㫄已見芬芬菊貪奇戀景不知倦側睥又復心瑟縮神魂飛下大壑幽定省移時進雙足寺門髙開朝日輝丹青黯淡唐時屋老僧引我周遊看且云白氏子詩乃實録此詩疇昔豫所聞殷殷更向碑前讀按言索像今無復惟有流泉數道如車輻我嫌世纍欲暫居又云此地無留宿殿宇之後林莽中日暮嘗有虎豹伏鑿石龕邊崕至深近有浮屠於此相張觸快心宿忿兩不解一乃顚擠死其谷我聞為之久顰蹙此向期將避煩辱不為傷生事爭如平地隨流俗歎息回頭急出山始覺全軀已為福興慶池餘潤漲龍渠疏溜連清滻助曉逺昏山浮秋眀刮眼漁歸別浦間鴈下滄波晚岸北有髙臺離魂蕩無限長安春日效東野前秋長安春今春長安秋節物自榮悴我有樂與憂窮閻何卑漏時燕不見投門庭謝過從蘭萌舒緑柔燕託喜廣厦亦非善是仇蘭生靜愈茂堪將義為儔芳香誠可慕對之蠲窮愁太行道行行太行道一步三太息念厥造化初夫何險此極左右無砥壑前後至頑石髙者欲作天朋黨深者疑斷地血脈夜中巖下埋斗杓日午陰壁風雪號攀緣有路到絶仞四望羣峰合沓如波濤忽至逼側處咫尺顚墜恐莫逃嗟乎古昔未開時隔絶往來人不思淳源一破山嶽碎巧心遂去緣嶮巇嶮巇不窮甚可畏悼此二者亡其宜天地不自嶮嶮由人為之彼車摧輪馬傷足中路勿歎勿慟哭世上安塗故有焉孰使汝行此道驅髙軒喪墜不收宜爾然對酒丈夫少也不冨貴胡顔奔走乎塵世豫年已壯志未行案上敦敦考文字有時愁思不可掇崢嶸腹中失和氣倚官得來太行顚太行美酒清如天長歌忽發淚逬落一飮一斗心浩然嗟乎吾道不如酒平禠哀樂如摧朽讀書百車人不知地下劉伶吾與歸夜中夜分衆喧死耿耿抱真履中君湛以寧不為外官使七兵乘間入攻剽勢向圮主將不謀陳敵惡蕩然失守遽藏避駭浪奔騰一刻萬里紛紛變化無窮已俄如獨繭絲忽復滿天地乳虎不受縛狂龍難馴致我思精甲以扞異類邪慝弗萌元辟復位輔以逍遙之至道爛然光輝照無際蜀士蜀國天下險奇怪生中間有士賈其姓抱材東入關獻冊叩諫鼓其言蔚可觀願以微賤軀一得至上前掉舌滅西寇畫地收幽燕且云太平久兵戰無人言臣嘗學其法自集數百篇治亂與成敗密然不可刪三獻輒罷去志屈心悲酸將相門户深欲往復見攔負販冒日熱引重衝雪寒羇苦輦轂下以圗晨夕餐如此三歲餘夜夜抱䣛歎義者或賑給遂復歸巴川嗟乎區宇大此徒亦已繁城市與巖穴隱默孰辨旃幸得出自鬻何惜置末班吾相柄天下處事當幾先古之設爵位蓋欲英雄躔次第立名級不使智慮間稍有才器者必以祿仕牽所患在不出既出那棄捐放蛟入大水驅虎還深山失一故無害其類莫可攀己卯冬大寒有感延川未撤警夕烽照冰雪窮邊苦寒地兵氣相躔結主將初臨戎猛思風前發朝笳吹餘哀疊鼓暮不絶淹留未見敵愁端密如髮豫聞古烈士自誓立壯節丸泥封函關長纓繫南越本為朝廷羞寧計身命活功名非與期冊書豈磨滅然由在遇專醜類易翦伐訓士無他才賞罰在果決近聞邊方奏中覆多沈沒罪者既稽誅功者不見閲雖使頗牧生勇智當坐竭或云廟堂上與彼勢相戛恐其立異勳歘然自超拔不知百萬師寒刮膚革裂關中困誅斂農産半匱竭我欲叫上帝願帝下眀罰早令黠虜亡無為生民孽獵狐篇老狐宅城隅涵養體豐大不知窟穴處草木但掩藹秋食承露禾夏飲灌園派暮夜出㫄舍雞畜遭橫害晚登埤塊鳴呼吸召百怪或為嬰兒啼或變豔婦態不知幾十年出處頗安泰古語比社鼠蓋亦有恃賴邑中年少兒耽獵若沈瘵遠郊盡雉兔近水殱鱗介養犬號青鶻逐獸馳不再勇聞此老狐取必將自快縱犬索幽邃張人作疆界兹時頗窘急迸出赤電駭羣小助呼嗥奔馳數顚沛所向不能入有類狼失狽鉤牙作巨顙髓血相潰沫喘叫遂死矣爭觀若期㑹何暇正丘首腥臊滿蓬艾數穴相穿通城堞幾隳壞久縱此凶妖一旦果禍敗皮為榻上藉肉作盤中膾觀此為之吟書以為警戒難易言效韋蘇州二首擬把鉛刀伐丹桂欲坐眢井攀青天排羅嬰兒拒九虎未若以道干貴權地上拾芥亦細碎掌裏數文猶苦辛脫使摘丸下峻坂未若以財而發身大小言楚襄王登蘭臺命大夫作大言登陽臺命大夫作小言梁昭明太子殷鈞王規皆嘗作彎弓射月落揮劒決天開何言四溟廣並合不成杯託身螟兩睫卜都牛一毛奔馳萬里外終不出秋毫了語不了語了語效晉顧凱之殷仲堪作不了語效唐雍裕之作公餗欲成忽覆鼎銀瓶汲絶還沈井乳虎咆哮落深穽青萍一揮斷人頸無言以手尋珮環寒暑迭運雕朱顔八駿踏地幾時遍六龍駕日何年間舟中感懷寄館中諸君時得告之山陽挈家扁舟迎春色東下淮楚鄉側身風波地回首英俊場顧我本俗材百事無一長濫迹入冊府舉動初不皇乍脫泥滓砥稍見日月光峻閣鬱前起隱嶙天中央春風花竹眀曉雨宮殿凉溢目盡圗史接翼皆鸞凰眀窗置刀筆大案羅縑緗文字雖幼學鈍庸今廢忘不能溫舊習考古評興亡􅌤顔於其間汗下如流漿徒然日飽食出入隨羣行朝廷比多事亦合強激昂况有詔書在爛然貼北牆奮舌說利害以救民膏肓不然棄硯席挺身赴邊疆喋血鏖羌戎胞膽森開張彎弓射攙槍躍馬掃大荒功勳入丹青名迹萬世香是亦丈夫事不為鼠子量數事皆不能徒只飽腹腸有如鳬鴈兒唼唼守稻粱歲月今逝矣齒搖髮已蒼於時既無益自合早退藏諸君天下選才業吁異常願當發策慮坐使中國強蠻夷不敢欺四海無災殃莫效不肖者所向皆荒唐又不耐羞恥但欲歸滄浪濡毫備歌咏仰首看翶翔舟中稍無事思念益以詳恨無一稜田可以足糟糠出處皆未決語默兩弗臧莽不知所為大叫欲發狂作詩寄諸君鄙懷實所望送李生李生以病廢東入徂徠峰志氣尚突兀形骸已龍鍾男兒生世間有如絶壑松誤為風雷傷不與匠石逢哀哉千尺幹摧折以秋蓬蘇學士文集卷第一
