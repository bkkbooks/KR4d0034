front:
  text: 蘇學士文集卷第三
  hash: sha256:c83c1458d1be647e52d31f3a6182e85e772b41cb31eef0852dd4cb42d5440bc7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_003-1a}
body:
  text: 依韻和勝之暑飮九夏苦炎烈入伏氣候惡况兹大旱時其酷甚炮烙爭得羿復生射此赤日落欲擘青天開騰身出寥廓狂走無處逃坐恐肝腦涸不如以酒澆庶可免焦爍相呼坐僧居頃刻釂百酌佳瓜判青膚熟李吸絳膜尚嫌味不爽更與冰雪嚼裂耳發浩歌解顔縱善謔徑趨無何鄉回覺萬事錯不知余中虛外冷得所託真氣潛遁亡半夜忽發霍嘔泄不暫停迸筋走兩腳初如巨繩纒忽似秋蚓躍委頓體不支藜牀為穿鑿君言暑飲佳但得一晌樂艱難踰旬時僅飲數斗藥快意事皆然遺殃愼無作答宋太祝見贈窮冬三日雪旅腸迫枯餓不免東郭行難效袁安卧我謁故所宜君來無乃左復貺長句詩如留萬金貨恣睢莫能名豪橫不可挫怒奔時㫄出力翥復下􅑁使人但驚絶欲繼誰敢作况君名家駒少小聲已播丈夫氣剛精不必在長大譬如利錐末所向物已破余資本滯濁既壯困家禍區區走俗格僅若蟻循磨詩枯實零丁文僻又坎坷翹然當路人顧我甚涕唾雅意返願交得無自卑涴俯首已內傾撫躬輒私賀無以答髙誼胸中強搜羅披豁聊短篇安足謂酬和莞爾當棄投毋留重吾過送李冀州詩冠蓋傾動車馬稠都門曉送李冀州緑髮三十一𧽼𧽼千騎居上頭眼如堅冰腼河月氣徑倢鶻橫清秋不為膏粱所汩沒直與忠義相沉浮干戈未定民力屈此行正解天子憂男兒勝衣志四海實恥坐得萬户侯斾旌眀滅朔野闊笳鼓棲斷邊風愁孤雲南飛莫回首下有慈親雙淚眸自古忠孝不兩立功名及時乃可收衆人刮目看能事著鞭無為儒生羞和鄰幾登繁臺塔孝王有遺墟寥落千年餘今為太常宅復此繁華都踊甓冠舊丘西人號浮圖下鎮地脈絶上與烟雲俱我來歷初級穰穰瞰市衢車馬盡螻蟻大河乃汙渠躋攀及其顚四顧萬象無迥然塵坌隔頓覺襟抱舒俄思一失足立見糜體軀投步求自安不暇為他謨平時好交親豈復能邀呼舉動強自持恐為衆揶揄一身雖暫髙爭如且平居君子不幸險吾將監諸書依韻和伯鎮中秋見月九日遇雨之作衆香愛春發枯荄我知惟動兒女懷天地昏酣醉夢裡人有爽思皆沈埋豈如秋風徑利劇刀劒刮破天膜清光開衰根危蒂掃除盡辨別松竹並蒿萊青娥供霜洗夜月兼以皓露驅纖埃常年此夕或陰晦今歲澄徹將快哉是時呼賔賞此景漸見照我白玉杯清輝向人若有意徑歷窗户猶徘徊放歌狂飮不知曉爛熳酌客山嶽頽時節飄流晦朔轉巳覺九日來相催北軒隙地破蒼蘚帶花移得黃金栽倒冠露頂坐狂客擷香咀蕊浮新醅最憐小雨灑疏竹爽籟颯颯吹醉腮君時傳詩頗精麗意若泥淖不得來開緘文采自飛動欲和但愧頑無才久之黽勉強為答嫌春愛秋真可咍夜聞秋聲感而成咏同鄰幾作八月天氣肅萬物日已䦨庭前兩髙桐夜籟如哀絃志士感節物中夕耿不眠起聽抱膝吟悲烈聲相干念此華葉改想見顔色鮮顧人生世間榮悴理亦然豈傷歲月速愧無功名傳少小學文章出值用武年儒官多見侮敢為戰士先欲棄俎豆事強習孫吳篇迂鈍不可為屈曲性亦難虗言盜祿食實又畏上天未能追世好且樂樽酒間九日近不遠同醉黃花前和聖俞庭菊不謂花草稀實愛菊色好先時自封植坐待秋氣老類糚翠羽枝巳喜金靨小嚴霜發層英益見化匠巧搖疑光豔落折恐叢薄少一日三四吟一吟三四繞賞專情自迷美極語難了得書所賦詩爛漫感懷抱朗咏償此花心清為之倒答梅聖俞見贈自嗟處身拙與世嘗齟齬至於作文章實亦少精趣低摧朝市間所向觸謗怒夫子與衆殊琢飾貺佳句將然紙上動讀畢恐飛去自覺異平居恍忽忘世故迥如出泥塗熏滌失臭汚衣之青霞裾飮以紫蕊露輶軒駕飛黃蹀躞上夷路古貴知者稀流俗豈足顧雅意雖可珍三復未敢報退慙百不堪尚恐君悔誤舟至崔橋士人張生抱琴攜酒見訪晚泊野橋下暮色起古愁有士不相識通名叩佘舟鏗鏗語言好舉動亦風流自鳴紫囊琴㵼酒相獻酬余少在仕宦接納多交游失足落坑穽所向逢戈矛不圖田野間佳士來傾投山林益有味足可銷吾憂潁川留別王公輔得罪身去國犯寒挽孤舟親友舍我去乃獨與子遊子實飽文義辭閩入中州氣徑恥苟合半歲為我留我窮不相棄同載適宛丘在困見人情此意不可酬解攜春波上㑹合知何秋維舟野步呈子履白日出髙岡遠野春氣動倉鳩鳴相歡幽草色巳弄繫舟大河曲登步目一縱逍遙玩物華所樂與君共巳忘竄逐傷但喜懷抱空古人負才業未必為世用吾儕性疏拙擯棄安足痛四顧不見人髙歌免驚衆滯舟落照滿長河流水暖沖融中有鳬鶩羣上下隨和風捕魚沒淺浦矯翅入紫空嬉遊意自得肯顧冥冥鴻伊余何所適舟滯數見窮十步九暗灘咫尺不可通獠工裂吻噪捨楫將何從巨絙挽屢斷有如拔山峰夕憂寇盜至蹶弩映岸叢徊徨但搔首歎息無所容曽無鳥禽樂虗在人曹中過濠梁別王原叔交道今莫言難以古義責錙銖較利害便有太行隔余生性闊疏逢人出胸膈一旦觸駭機四向盡戈㦸平生朋遊面化為虎狼額謗氣慘不開中者若病疫遂令老成人坐是亦見斥既出藝香署又下金華席摧辱實難任官名亦非惜罪始職于豫時情未當隙今來濠水涯日夜自羞惕髙風激頽波相遇過疇昔白璧露肺肝晴雲見顔色乃知天壤間自有道義伯眀日又告行吁嗟四海窄和子履雍家園長橋南走羣山間中有雍子之名園蒼雲蔽天竹色淨暖香撲地花氣繁飛泉來從遠嶺背林下曲折寒波翻珍禽不可見毛質數聲清絶如哀彈我來踞石弄琴瑟唯恐日暮登歸軒塵紛剝落耳目異只疑夢入仙家村君之襟尚我同好作詩閎放莫可攀髙篇絶景兩不及久之想像空冥煩尹子漸哀辭並序豫昨得罪子漸數相過感慰激切恐豫重得罪於朝廷也其意結括避愼非昔時子漸也與之劇飲則必作薤露長歌舉音凄斷坐中不忍聞已而又有厭苦世故之說豫謂死者人之所惡子何樂焉對曰吾未嘗死安知死之不樂也生理局促不足樂見之矣既別才百餘日子漸化去豈其魄兆歟豫始聞之怛然震為出涕徐又追其緒言作哀辭以寄執紼者漂流江湖外負罪氣慘悽况聞故人死驚呼不成啼當案舍匕箸緬懷大河西針言尚在耳鑑若環珮隨志氣廩巳失神魂飄何之昔云死者樂復以生為悲豫知達士懷將以二物齊今也果何如無乃往意迷荆棘飽雨露叢蘭委汚泥紫鸞忽腸絶永年賊狐狸天理漭難問我意多乖睽哀吟蒼山闊注目白日低不得慟寢門雪涕江上隄天平山吳㑹括衆山戢戢不可數其間號天平突兀為之主傑然鎮西南羣嶺爭拱輔吾知造物意必以屏大府清溪至其下仰視勢飛舞偉石如長人竪立欲言語捫蘿緣險磴爛熳松竹古中腰有危亭前對紺壁舉石竇落玉泉泠泠四時雨源生白雲間顔色若粉乳旱年或播灑潤可足九土奈何但泓澄未為應龍取豫方棄塵中巗壑素自許盤桓擇雄勝至此快心膂庶得耳目清終甘死于虎奉酬公素學士見招之作人生交分恥茍合貴以道義久可要薄俗盈虛逐勢利清風綿邈日已凋長吟宇宙獨引領浩浩萬古與我遙安得此身有兩翅颯然遠舉隨風飇近逢公素我同好厭憤偷俗常鬱陶君方調官鎮京口我以重罪廢本朝身雖俱在大江外不得㑹合煩相邀秋風八月天地肅千里眀回草木焦夕霜慘烈氣節徑激起壯思冲斗杓豈如兒女但悲感唧唧吟歎隨螳蜩擬攀飛雲抱眀月欲踏海門觀怒濤念君住所近不遠江山蟠闢氣象豪接頭陰眀變霞霧檻下日夕鬭蜃蛟便將一往刷滯悶去興草茁不可呼兒撲衣辨舟楫一日百里豈憚勞君方酒酣亦思我奔墨紙上為長謡上言風物麗復壯下述宴集樂且遨意我羈愁正無賴欲以此事相誇招此篇筆絶墨未滲我舟適到范老橋古人千里有神㑹以兹可信非相遼倜然不以窮見棄曠然不以位自驕開緘朗咏毛髮竦通夕噤瘁睫不交病膜誰將寶箆刮癢背恰得仙人抓長川奔渾走一氣巨鎮截嶭上赤霄又如陰雲載雷電光怪逬漏不可包驚呼歎伏已不暇焉敢有意爭其髙却疑欺我老困頓故作大句來相鏖近罹罪辱舌雖在每避嫌謗口已膠更遭掀攪豈不畏欲取筆硯俱焚燒既承嘉命敢無報將吐復茹移昏朝留連日日奉杯宴殊無閒隙吟風騷看君岸幘卷大白有似巨浸吸百潮賔從傾頽尚未猒直恐潰爛腸與脬神迷耳熱眼生纈嚼盡寶壓狂醒消歡流樂極古所戒不免猒旦潛遁逃還家數日却愁寂夢中猶奉笑與嘲強為短篇答髙誼鄙事軋軋空自撓覽之捧腹定絶倒幸為投棄無傳抄相思復思往相㑹豫今豈復如繫匏行看雪夜景清絶更乘逸興飛輕舠遷居前歲旅淮楚去年還上都上都一歲內前後七徙居歲暮被重謫狼狽來中吳中吳未半歲三次遷里閭京師重騰移長物動數車江湖亦稍便一舟樂有餘破壞新器皿散亡舊圗書家人頗倦煩行路亦歎呼吾知人之生天壤乃蘧廬其間暫寄寓一世還須臾縱遊極南北所歷足自娛猶恨苦濡滯舉動携妻孥出入極浩與元氣俱仰首羡日月晨夕苦奔趨二物本無情亦為氣所驅况我有血肉又生名利區手足日不間在地無根株流宕固宜矣何必厭道塗此身亦外物安用傷羈孤庸人所見狹但以鄉井拘屑屑寸粒食何異雞在笯擬隨犯斗查欲上浮海桴寄語懷安者嗟嗟爾何愚遣悶隆冬雪跨月度日關門廬乘昏氣慘烈悲風吹江湖白鵠翅翼傷塌然困泥塗不入鶬鶊羣哀鳴憶雲衢夕飢乏粒食浩蕩天地俱何時闢重陰得見白日舒苦調陰暗必有鬼髙眀者惟天鍳應未始忽冥理有後先姦凶喜欺罔放意快目前虎狼嚼生人自適甘且鮮烈士兵劒起忿髮如危絃人理巳不勝神報豈泯然驚呼徹上帝灑血透九泉捫舌不敢語咄咄徒自憐蘇學士文集卷第三
