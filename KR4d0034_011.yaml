body:
  text: 乞納諫書五月二十八日具官臣某謹上書皇帝闕下臣聞治平之君使危亡禍亂之言不離于耳則天下庶可久安也髙位之臣使顚覆竄殛之禍不絶于心則百職可以無曠也苟治平而忽危亡未有不危亡者也髙位而忘顚覆未有不顚覆者也此物理之常勢古今之定分也歷觀前代聖神之君好聞乎讜議賢眀之輔不壅乎下情蓋以四海至逺民有隱慝不可以遍照故無間愚賤之言而擇用之萬幾至煩事有習弊不可以獨覽故必求衆多之議以更張之然後朝無遺政物無遁情雖有佞人邪謨莫得而進也臣昨覩乙亥詔書戒越職言事者播告四方無不驚惑往往竊議恐非本于宸衷蓋陛下即位以來屢詔羣下以求鯁直故百寮皆得轉對又置詣匭設直言極諫科今詔書如此是與前事相違豈非大臣蔽塞陛下聰眀杜塞忠良之口不惟虧損朝廷大政實亦自取覆亡之道夫納善進賢宰相之事蔽君自任未或不亡今諌官御史又多出其門下但務希旨即取好官多士盈庭噤不得語陛下拱深宮之內何由得聞天下之務乎臣前見陛下以孔道輔范仲淹剛直不撓致位諫臺後雖改他官不忘獻納此二臣者非不知緘口數年坐得卿輔蓋不敢負陛下委任之意虧臣子忠藎之節而皆競罹中傷竄謫不暇使正臣奪氣鯁士咋舌目覩時弊口不敢論昔晉公問叔向曰國家之患孰為大對曰大臣持祿而不極諫小臣畏罪而不敢言下情不得上通此患之大者是故漢文感女子之説而肉刑是除武帝聽三老之議而江充以族肉刑古法江充近臣女子老人愚耄疏隔之至也蓋以義之所在賤不可忽二君從之後世稱聖况國家班設爵位列陳豪英故當責其公忠安可教之循默賞之使諫尚恐不言罪其敢言孰肯獻納物情閉塞上位孤危軫念于兹可為驚怛伏望陛下霈發德音逮寢前詔勤于采納下及芻蕘求覩四海之安危垂念朝廷之闕失見所未見日新又新故可常守隆平保全近輔若詔榜未削欺罔成風則不唯堂下逺于千里竊恐指鹿為馬之事復見于今朝也臣區區以此言達于冕旒者非不知出口禍從為衆憫笑蓋欲陛下一悟則天下蒙福以臣之軀負蒼生之命亦已大矣伏望陛下留意焉詣匭疏景佑五年正月十八日具官臣某謹頓首再拜昧死上疏皇帝陛下臣昨初到京師聞河東地大震裂涌水壞屋廬城堞殺民畜幾十萬歷旬不止臣始聞惶駭疑惑竊思自編策所紀前代衰微喪亂之世亦未嘗有此大變方今四聖接統內外平寧戎狄交歡兵革偃息固與夫衰微喪亂之際頗異是何災變之作返過之邪且妖祥之興神實尸之各以類見未嘗妄也臣以為必無是事是亦傳言之濫耳歷問一二朝士皆曰有之因退思念天人之應古今之鑒大可恐懼凡朝廷政教昏迷下受其弊積陰鬱不和之氣上動於天天於是為下變異以警戒之使君人者回心省修翻然向道則民安而災息是故古之王者逢天地之變則必避正寢徹樂省饌詢訪正議考求失德而更去之蓋以上帝聰眀所作必驗苟弗知懼則非常之孽隨之今此異既告豈徒然哉則王者豈常安於逸豫信任近狎而不省政事乎廟堂之上執事者豈有非賢才或專威福而侵君者乎其所施設之政豈有不便於民者乎深宮之中豈有陰教不謹或以媚道濫進者乎西北之夷豈有竊萌背盟犯順之心者乎念自從逺方來不知近事心雖疑而口不敢道宮禁夷狄之事固未可知朝廷已然之失則聽輿論而有聞焉又訝朝廷知此大異殊不修補闕政以厭天戒而安民心默然不怪如平常無事時諌官御史亦不聞進牘白見鋪陳災害之端以開上心然民情洶洶聚首橫議咸有憂悸之色豈時與古不同今朝不宜倣古以為事耶又念有天下者未有不監古而治棄古而亂也豈上位者務在鎮靜不須與民同憂也則又民為邦本未有本搖而枝葉不動者豈民愚暗不當憂而憂耶則地之震天之所為也民雖愚天豈愚哉反覆思之不覺驚怛流汗自以世受君祿身齒國命涵濡惠澤以長此軀便欲盡吐肝膽以封拜奏又昨見范仲淹以剛直忤姦臣果罹中傷言不用而身竄謫甚可悲也是時降詔天下不許越職言事臣今苟務激切不避權右必恐橫遭傷害無補於時因自悲嗟不知所措既而孟夏之初雷電暴作臣以謂國家之失衆臣無有為陛下言者唯天丁寧以告陛下也陛下極聖至眀其肯忽之果能霈發眀詔許臣寮皆得獻言臣初聞之踊躍欣抃又謂雖有災異陛下能講求嘉言革去時弊故可變化而召善和也旬餘日來聞頗有言事者其間豈無切中時病而絶不聞朝廷從而行之是亦示虛言而不根實效也臣聞唯誠可以應上天惟實可以安下民今應天不以誠安民不以實徒布空文增人太息耳將何以謝神靈而救弊亂也豈大臣蒙塞天聰不為陛下行之豈言事者迂闊無所取不足行也此則未可知今臣竊見綱紀隳敗政化闕失其事甚衆不可概舉今條大者二詣匭以聞伏望陛下少賜觀覽苟有所采乞斷自睿意即時行焉言或狂瞽乞付臣斧鑕以非所宜言罪之一曰正心夫治國如治家治家者先修於己修己者先正於心心正則神眀集而萬務理也今則民間喧傳陛下數年以來多引俳優賤人於深宮之中燕樂無節賜豫過度燕樂無節則志荒蕩賜豫過度則心侈泰志荒蕩則政事不親心侈素則用度不足臣竊觀國史見祖宗逐日視朝旰昃方罷猶坐於後苑門上有白事者立得召對委曲詢訪小善必納真宗末年不豫始間日視事今陛下春秋鼎盛實宵衣旰食求治之秋而乃隔日御殿此政事不親之故也今又府庫匱竭民鮮蓋藏誅斂科率殆無虛日三司計度經費二十倍於祖宗時此用度不足眀矣政事不親而用度不足斯大可憂也伏望陛下修己以御人洗心而鑒物勤於聽斷舍其燕安放棄優諧近習之纖人親近剛眀鯁直之良士因此災變以思永圖效祖宗之勤勞惜社稷之廣大則天下之幸甚也二曰擇賢夫眀主勞於求賢而逸於任使然盈庭之士不須盡擇在擇一二輔臣及御史諌官而已今陛下用人似不能擇昨王隨自吏部侍郎轉門下侍郎平章事超越十資復為上相此乃非常之恩必待非常之才而王隨虛庸邪諂非輔相之器降麻之後物論沸騰故疾纏其身災仍於國此亦天意愛惜我朝陛下必鑒之又石中立頃在朝行以詼諧自任士人或有宴集必置席間聽其語言以資笑噱今處之近輔不聞嘉謨物望甚輕人情所忽使災害屢降而朝廷不尊蓋近臣多非才者陛下左右尚如此天下官吏可知也實恐胸奴輕笑中國伏望即時罷免別建賢才臣又竊見方今以張觀為御史中丞髙若納為司建此二人者皆登髙第本望以詞華進用素履溫和軟懦無剛鯁敢言之才斯皆執政引拔建置欲其愼默不敢舉揚其私時有所言必暗相關説旁人窺之甚可笑也故御史諌官之任臣欲陛下親擇之不令出執政門下臺諫官既得其人則近臣不敢為過乃馭下之策也臣以謂陛下身既勤儉輔弼臺諫又皆得人則天下何憂不治而災異何自而生伏望陛下少留意焉非有難也臣不勝區區之至火疏時年二十一登聞獻此疏臣聞烈士不避鈇鉞而進諌眀君不諱過失而納忠是以懷策者必吐上前蓄冤者無至腹誹則上下之情不鬱政令之出恱隨然言之之難不如容之之難容之之難不如行之之難有能言之則必容之則必行之如此則欲治之主三代之迹也願陛下留意焉臣伏覩今嵗自春徂夏霖雨陰晦未嘗少止農田受葘者幾於十九民情嗸騷如昏墊焉臣以謂近位之失人政令之多缺賞罰弗公之所致也天之降災欲悟陛下陛下反謂刑獄濫冤之至故肆赦天下以救之殊不念如此則殺人者不死傷人者不抵罪其為濫冤則又加甚古者決獄斷滯訟以平水旱不用赦也故赦下之後陰霾及今前志曰積冤生陰積陰生陽陽生則火災見焉乘夏之氣發泄於玉清宮震雨雜下烈焰四起樓觀萬疊數刻而盡誠非慢於禦備乃上天之深戒也陛下當降服減膳避正寢責躬罪已下哀痛之詔罷非業之作拯失職之民在輔弼無禆國體者去之居左右竊弄威權者去之精心念政刑之失虛懷收芻蕘之言庶幾變災以答天意浹辰之間不聞有此告諭竊知陛下將計工役再謀興修都下之人聞者駭惑往往聚首橫議咸謂非宜皆曰章聖帝勤儉十餘年天下富庶帑府流衍無所貯藏乃作斯宮及其畢功而海內為之虛竭陛下即位未及十年數歲連遭水潦雖征賦咸入而百姓頗甚困乏若大興土木之功則費用不知紀極財貨耗於內征役勞於下內耗下勞何以濟矣況天災之已為之是欲競天無省己之意逆天不祥安已難任欲祈厚貺其可得乎豈天譴告而陛下弗悟邪豈知而故為之邪豈再造祈天之祐邪臣不得反覆而量也今為陛下計者莫若采吉士去佞人姑務修德以勤至治使百姓足給而寬其征稅則可以謝天地而安民情矣夫賢君見變能修道以除凶亂君無象天不譴告今幸得天見之變是陛下修道之日豈宜忽哉昔漢元帝三年茂陵白鶴館災下詔曰乃者火災降於孝武園館朕戰栗恐懼不燭變異咎在朕躬羣司又未肯極言朕過以至於斯將何寤焉夫茂陵不及上都也白鶴館不大此宮也彼尚降詔四方以求已過是知古帝王急治如此夫火不炎上之罰正為是焉臣謹按前漢五行志云賢佞分別官人有序帥繇舊章敬重功勳如此則火得其性矣若乃信道不篤或耀虛偽讒夫昌邪勝正則火失其性矣自上而降及濫炎妄起災宗廟燒宮室雖興師衆弗能救也故魯成公三年新宮災劉向謂成公信三桓子孫之讒逐父臣之應襄公九年春宋災劉向謂宋公聽讒逐其大夫華弱奔魯之應也今宮災豈得亦有是乎願陛下恭默而內省之省而既知之願陛下悔過而追革之罷再造之勞役行古先之典法非惟大光基構亦天下之幸甚也臣愚妄之言不足益國體之萬一陛下苟容而行之三代兩漢之風指顧而可致也論西事狀臣竊見自西寇逆節天下言兵者不可勝計大抵不過訓練兵卒積聚芻粟而已其言泛雜無所操揔又陳爛使人耳厭其聞而笑忽之況清衷近輔自有上算故不當復有所獻也然臣卑居長安備見西邊事體其要在乎得人得人則練兵積粟之多不煩帷幄之議而自集也惟攻守之策必須中授何者此事至大不可輕舉近聞朝廷將議深討覆其巢穴此蓋憤其凶悖勇而不知思也孰不知羌氐之俗居不常處獸聚鳥散本無聚積若垂軍絶漠則跨歷險塗被甲裹糧操執兵械外疲而內懼一日之行有三日之勞曽未見敵先已自病隘而遇伏則將不支矣昔趙充國之論兵詳矣故中國利守夷狄利戰從古然也傳曰天子守在四夷又曰荒服者王不王則修德詩云薄伐玁狁至於太原薄伐亦謂逐出之已而來則逐之去而勿追禦戎之善策也國朝五路興師亦遇敗衄前日劉平不能持重俟隙務於速戰身罹禽獲傷剝國威是知討之不如守之之利也眀矣近者朝廷拜置夏竦韓琦范仲淹等此皆平定外夷人所屬望者賊昊姦譎故必疑畏疑畏則將以事驗之以臣竊料今秋必放兵犯塞以觀我師之方略當是之時尤須愼重若能堅壁清野勿與之敵設伏用奇於險塞之地待其師老糧盡而反覆擊之不勞深討而可成功也方今之勢不患其來戰患守之之道未至耳議其功者恐鋭而寡謀敗陛下軍事也愚者之説萬或一效以嘗預西事不敢塞默伏惟聖慮裁察之不勝􅝴􅝴之至乞發兵用銀牌狀臣謹按周禮牙璋以起軍旅漢世發兵皆以虎符所以嚴國命而絶姦端厥後給銀牌以為信五代喪亂凡奉使調發但樞密院給牒國朝太平興國中以李飛雄之為詐有詔復用銀牌焉自後又復廢罷臣竊見方今外郡兵馬只是三班使臣齎宣起發而無銀符之制況印之篆刻尋常官吏亦不能盡通姦詐或能為之當用武之際必須大為之防臣欲乞今後起發兵馬及乘遞馬者中給銀牌以復本朝舊制其規矩乞詔有司詳定之伏取進止論宣借宅事康定元年十一月二十一日臣昨於十月二十三日內侍省牒奉聖旨下務支借小宅一所與司天監楊可久今月十八日準三司牒傳宣旨指射舍屋三十間已來與醫官副使柳堯卿居止者竊以賜第之典於國體至重前朝將相非有勳業則不得賜第京師近劉平血戰亡軀家宅無託朝廷方推此惠時謂當然今兹醫卜庸流濫有求請煩瀆天聽侵亂邦經況賞罰二端國之名器所以驅駕豪傑示信四方若死行陳之家與伎術之輩均用此賞臣竊恐輕重失宜矣方今西鄙未寧暴師塞外流傳四出何以勸人伏望特降德音即時寢罷況柳堯卿自有居第極為華侈若以其醫藥有效自可以金帛賜之上以重恩賞之科使戰伐者盡其死力下以絶僥覬之望俾貪冒者萌其恥心臣事在職司合有獻納蓋期賞之不僭非敢文而自營上瀆宸嚴無任􅝴到之至乞用劉石子弟臣近到闕聞黃德和以退軍及妄奏劉平石元孫叛逆朝廷已從軍法處分然劉平石元孫以血戰陷沒死於賊手初朝廷未能辨眀即時以兵卒監圍其第及德和既已伏辜二族未霑恩澤遷延纍日人頗疑惑古者舍爵策勳貴其速也此雖敗衄是亦勤勞於是伏望陛下斷自睿意詔有司於西郊備禮致祭陛下出次素服西向舉哀故禮云軍有憂則素服哭於庫門之外赴軍不載櫜韔蓋古者義也即日降册追贈賻其家族爵其子弟使死者有知豈無冥助生者懷感必當盡忠烈士義夫聞之震激人人思為陛下用也劉平子弟臣雖不識聞其頗知邊事用敵西寇必有成功況國恥家讎異於他將則吳用子胥唐拜田布即其義也投匭疏時年二十二臣昨伏覩陛下發德音下眀詔廣延天下博習之士以大治本降詔之日識者喧然咸謂陛下張祖宗之基致億兆之福慮意有所不逮政有所未敷雖碩輔盈庭諌臣滿署朝訪前王之陳迹夕講先朝之故事尚欲親問芻蕘廣采髦哲此非唯藴才抱器者幸甚實亦天下之幸甚也臣竊見分四制限十一科使官京師者得應賢良體用之目潛白屋者出赴沈淪髙蹈之制州縣判等限以字數武舉策試兼之騎射臣敢謂陛下之詔體則正矣而綱條未至輒有營穴願鋪白而言之夫賢良之科肇於漢世故公孫丞相之徒多以褐衣射策而解中入仕其以居位者日邇帝光出入禁掖志或未發則可囊奏而建言政有未安則可排闥而請見況其身檢命敕已得為朝中官則口鉗舌卷鮮肯言天下事惟是韋帶繩樞之士義疏禮隔趨走塵土間未嘗咫尺人主之顏面加以天閽九重交戟數里雖胸文陸離筆語滂沛而豈得一達旒纊之下哉脫欲聲鼓叩輦則有司必以狂妄之罪罪之且身無一命志氣自得邦家闕政實亦敢言漢世兼采庶士者深有意於此也下至李唐穿鑿前軌以謂民間不知帝王之動靜俗儒不講朝廷之經法專以官士者得應言科及我炎統勃興不血刃而得天下太祖太宗拓樹基扃誕布鴻文而大變汚俗真宗嗣二后教信兩漢法笑却唐弊追還古風故詔賢良而草莽之士無棄也今陛下之詔有異於上是未至者一也次則髙蹈丘園沈淪草澤臣亦謂未至者何嘗聞帝者愼器與名不務虛假且遁逸之士不示見聞今陛下垂詔而雜舉之是欲使之自見聞也若出而赴陛下之詔是其人非沈淪者若出而求陛下之試是其人非髙蹈者則皆露已揚才干時謁進者也非唯失彼之行恐使人謂陛下設虛名無精求之意州縣判等亦未折衷夫録人罪失務在淺要不過數字以見意數句以成文今限字二百束之對偶則皆漫誕而無功繁博而寡要不可施用是為空言至如武舉策試兼之騎射竊觀詔旨既令先進軍機後即陛試是陛下取將帥材者也反使張一弓發數矢是陛下校一夫之藝取一人之敵也夫欲練將材而取一夫之技又何異考編鐘堵磬而求鄭衛之音伏願賢良之科使復兩漢真宗之制不以官士為之限則國家之得失可聞也沈淪髙蹈者則令諸郡守宰根索其名而籍奏之然後給傳續食達輦會試以文則蓄響埋照之流不逺而至矣書判者削其字限各罄其才而為之文識髙劣盡可見矣武舉者去騎射之末而訪以機略之大則將帥之具鱗集矣若然則陛下之詔不虛下天下之人無異議四條眀而十一科正矣臣碌碌者豈當輒述國家大事上干天子聽覽蓋以陛下開言路塞諱門采瞽説納愚慮是以析肝瀝悃而具述之若陛下責其犯上罪其錯議臣雖膏鉞轉壑不為之怨伏願俯而察之干冒宸嚴無任隕越五事景佑四年五月七日閣門下臣聞重閉尚設於勇夫擊柝以待乎暴民是皆前籍立戒以監後人故國門九闔梐枑百重刑人以守閽下士以拂闑所以深嚴帝禁以備非常古者非有符節不得輒入君門降及後來乃設籍禁品庶官之髙下限諸門之出入故東籍而西入者律令有文焉臣竊見國朝皇城宮門皆無名籍往來無間甚非防微之意也臣欲乞今後內城諸門應分番宿直諸色人等各立名籍仍差中官專切提轄一臣聞事不師古傅説所譏必也正名仲尼之訓臣竊以國寺之監乃卿佐之局南省諸曹皆尚書之任近朝多差京朝官或貟外專判於理不順且逺方一州一郡唯使相及僕射以上方得言判豈京朝小官得判省寺重地臣欲乞今後非有本官者但稱權及句當不令專判庶合前規一臣謹按前志曰白事之吏民之仇讎又云急吏緩民則吏不可縱政之大功也臣竊見州縣之吏多是狡惡之人窺伺官寮探刺旨意清白者必多方以誤之貪婪者則啖利以制之然後析律舞文鬻獄市令上下其手輕重厥刑變詐奇邪無所不作苟或敗露立便逃亡稍候事平復出行案設有強眀牧宰督察太嚴則締連諸曹同日亡命或獄訟未具遂停鞫劾賦稅起納無人催驅近年以來習成此弊官長務從姑息恐失大計見其邪濫不敢以法繩之惟此輩凶人唯利是嗜每糾以嚴憲尚不悛心何況縱之使亂正法實政理之巨蠹黎民之大害焉人雖切齒無可奈何蓋緣國家別無敕條以加檢束臣欲乞今後州縣曹司有闕並於第二人户上選差仍令每五人互相為􅍖或逃亡者立差官籍其家量取以充賞募人收捉或遇赦首身亦乞流配別郡如此則不敢公然作過以紊政經一臣聞矜孤養老邦家之大政恤貧寬疾册書之格言竊見前代皆置悲田養病坊堂在長安中命使專領亦選名德僧徒兼掌其事縣官出錢收利籍而用之開元中丞相宋璟上言乞罷中旨不從會昌沙汰僧尼李德裕以悲田院出於釋氏遂易名而增修國家富有四海生齒實繁山澤之間舉無遺利賦稅之外復有逺倉或水旱為災則流亡相屬遇慈惠之吏必率斂而飼養逢苟且之政必枕籍而死亡􅑁本非慵多致歉乏又京兆之內丐乞者多飢寒所侵往往殘廢或自折支體困入泥塗號呼里閭呻吟道路聚為祲厲甚傷風化陛下仁被草木惠及昆蟲惟此夭傷未霑王澤臣欲乞依有唐故事創置悲田養病坊州郡並以曹官領之仍於髙年擇信行可稱者三兩人與僧官同切管句三京給田十頃望鎮州七頃諸州軍等第給田以充粥食有羡餘官錢置本收利以備醫藥十歲以下八十以上仰州縣察訪無家可歸者亦令看養如此則大益仁化無虧國風頌聲喧傳上資聖算和風浹洽可召豐年一臣聞巨壑雖深獸知所避烈火至猛人無蹈死故歷塊而蹶者皆是玩水而溺者有之古垂此言以喻刑辟者昔聖人惡殘賊之害良民也故眀設嚴刑大張憲網必使易避而難犯防微而杜原約之不至煩苛威之以令畏懼姦凶之輩翻然革心固而行之自然刑省茍務矜貸則冒禁者繁竊見官吏多犯贓汚乃由朝廷法制稍寬貪鄙因緣為弊凡中人之性本非大凶皆以禁約不嚴是為貨利所沒手提刑憲人不敢言心恣誅求下受其困夫殺人者死傷人者刑古今之制也殺傷之害不過數人今貪官在官民皆受苦雖有轉運提刑位皆尊崇罕與民接詢訪官吏鮮得實情苟無訟端莫肯發摘知者或欲陳告又非干已臣欲乞今後官典犯入已贓許諸色人陳論得實者以其贓充賞如此則必畏多言之人亦防十目之視荀卿所謂威厲而不試刑嚴而不用此其得之矣蘇學士文集卷第十一
