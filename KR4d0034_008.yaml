front:
  text: 蘇學士文集卷第八
  hash: sha256:f11a6e6b9728854d890d521adbd49e5e0d82c0e3c158d56c6c7483b36881f27d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_008-1a}
body:
  text: 和彥猷晚宴眀月樓二首溪聲來從一氣外樓閣插在蒼霞中豔歌橫飛送落日哀筝自響吹霜風低昂黛色四山黯凌亂纈紋疏樹紅憑䦨揮手問世俗何人得到蟾蜍宮落晚天邊燕席開溪山相照絶纖埃緑楊有意簷前舞凉月多情海上來香穗縈斜凝畫棟酒鱗環合起金罍自疑身是乘查客泛徹銀河却欲回依韻和王景章見寄歲律崢嶸臘候深一天風雪卷愁陰故人默默懷交意逐客栖栖上國心千里相望空盼盻當年下吏阻追尋咄嗟謗口聞高誼披豁羇懷見雅吟學道元將禦窮困浮生何必計升沈世間機盡知難避往者圖書可自任猶得雲山開醉眼可無俗物撓沖襟鵩來閒暇何須怪鬼見邪歈豈易禁楚客留情著香草啓期傳意入鳴琴夫君自上丹霄去莫忘雲泉寄好音答仲儀見寄前歲京都吏議喧徑弓摧翮兩連翩男兒窮困終歸道世路傾危自有天雲壑已通塵外意茅齊仍得自髙眠寄聲吾舅無相念今作江湖九館仙雨中聞鶯嬌騃人家小女兒半啼半語隔花枝黃昏雨密東風急向此漂零欲泥誰滄浪亭一徑抱幽山居然城市間髙軒面曲水修竹慰愁顔迹與豺狼逺心隨魚鳥間吾甘老此境無暇事機關秋雨陰風攪林壑驟雨到江湖白日不覺沒繁雲何處無樓吟凉筆硯溪夢亂菰蒲聞說京華盛汚泥入敝廬中秋三夕對月三夕月俱好清光惟望多風應落桂子露恐減金波念昔歡娛極如今羇旅何窮猿不相棄夜夜伴吟哦懷月來求聽琴詩因作六韻正聲今遁矣古道此焉存商緩知臣僭風薰見帝尊雄豪尚餘勇淡泊忽忘言繁極殊無閒來長若有源已能通變化直可探胚渾此理師應得西風獨掩門送黃通浪遊天下訪知音健節亭亭恥陸沈當日拜官隨鶴版此時孤宦入蛔林羇愁雖得著書樂風物能傷遷客心顧我冥頑入瓦石為君分袂亦悲吟秋宿虎丘寺數夕執中以詩見貺因次元韻生事飄然付一舟吳山蕭寺且淹留白雲已有終身約醁酒聊驅萬古愁峽束蒼淵深貯月巖排紅樹巧裝秋徘徊欲出向城市引領烟蘿還自羞滕子京哀辭雲霓收壯氣星象卷英魂賢去人何賴才亡世不尊論兵虗玉帳問俗失朱􅙲自為知音絶低回慟寢門忠義平生事聲名夷敵聞言皆出諸老勇復冠全軍冥莫知誰主賢愚豈更分江頭送丹旐哭向九華雲寒食招和叔遊園異鄉風俗傷嘉節久客情懷喜友人共挈一尊諸處賞誰家得似故園春春日懷舊遊羇旅怯春風風光上國同情如花有約愁與酒相攻雨外傷飄燕樓頭羡去鴻西郊遊冶地誰復醉芳叢春日感懷微物亦生輝輕風弄客衣花間情脈脈蝶暖喜霏霏望國勳名晚傷時歲月飛淹留伴猿鳥何日片帆歸夢歸雨隔疏鐘曉不知春風吹夢過江西雨聲破夢北窗響臥憶江西路亦迷獨步遊滄浪亭花枝低攲草色齊不可騎入步是宜時時攜酒秖獨往醉倒唯有春風知初晴遊滄浪亭夜雨連眀春水生嬌雲濃暖弄陰晴簾虗日薄花竹靜時有乳鳩相對鳴滄浪觀魚瑟瑟清波見戲鱗浮沈追逐巧相親我嗟不及羣魚樂虗作人間半世人遊招隱道中揚鞭望招隱塵思漠然收雲接青林合泉兼碧草流疏鐘傳别壑晚日動前樓嘉遁平生志吁嗟得暫遊揚州城南延賔亭亂蟬咽咽柳霏霏獨上危亭俯落暉江外山從林下見城中人向渡頭歸風烟逺近思髙遁豺虎縱橫難息機出處兩乖空自撓傷哉吾道欲何依吳江岸曉色兼秋色蟬聲雜鳥聲壯懷消鑠盡回首尚心驚晚泊龜山南灣晚泊一徘徊小徑山間佛寺開石勢向人森劒㦸灘光和月㵼瓊瑰每傷道路銷時序但屈心情入酒杯夜籟不喧羣動息長吟聊以寄餘哀滄浪靜吟獨繞虗亭步石矼靜中情味世無雙山蟬帶響穿疏户野蔓盤青入破窗二子逢時猶死餓三閭遭逐便沈江我今飽食髙眠外惟恨醇醪不滿缸丹陽子髙得逸少瘞鶴銘于焦山之下及梁唐諸賢四石刻共作一亭以寶墨名之集賢伯鎮為之作記逺來求詩因作長句以寄山陰不是換鵝經京口今存瘞鶴銘瀟灑集仙來作記風流太守為開亭兩篇玉蕊塵初滌四體銀鉤蘚尚靑我久臨池無所得願觀遺法快沈冥遊霅上何上今古何山是勝遊亂峰縈轉繞滄洲雲含老樹眀還滅石礙飛泉咽復流遍嶺烟霞迷俗客一溪風雨送歸舟自嗟塵土先衰老砥事孤僧亦白頭霅上玉人攜手弄秋英尋遍池臺見月生小杜有靈應羡我今為間客此間行杜詩云願為間客此間行冬夕偶書謾走聲名三十年亦曽文采動君前玉顔皓齒他人樂獨守殘燈理斷編寒夜十六韻答子履見寄風雨夜寒新空齊感慨頻詩書窮不放燈火靜相親眺聽時懷土低摧動畏人魏文詩云客子常畏人漫書成咄咄逺吠厭狺狺念昔離憂患唯君共苦辛漂流數千里會合十餘旬各閔傷弓翼聊同喣沫鱗誰知公冶罪衆笑伯龍貧隔絶今一水暌離將再春嘉篇數為貺尺牘亦相珍倚伏時難定屯亨理亦循劒埋猶有氣蠖屈尚能伸邦國方登俊江湖且放神不憂知在命任重莫如身白首襟期逺靑雲志業均陶然任元化愼勿損天真獨遊曹氏園館因寄伯玉去年把酒共徘徊今日尋幽獨此來竹密似嫌間客入梅含應待主人開贊謀盛府方投刃捍患長隄正展才早晚得歸如舊約伴君池上倒尊罍小酌寒雀喧喧滿竹枝驚風淅瀝玉花飛霜柑糖蟹新醅美醉覺人生萬事非送人還吳江道中作江雲春重雨垂垂索莫情懷送客歸不憤東風促行棹羡他雙燕逆風飛題廣喜法師堂我為名驅苦俗塵師知法喜自怡神未知歡戚兩忘者始是人間出世人詩僧則暉求詩全吳氣象豪詩思合翹翹風雅久零落江山應寂寥㑹將趨古淡先可去浮嚻好約長吟處霜天看怒潮關都官孤山四照閣勢壓蒼崕險可驚攀雲半日到軒楹㫄觀竹樹回環翠下視湖山表裏清漸覺愁隨烟靄散只疑身有羽翰生他年君挂朱􅙲後蠟屐卭枝伴此行清軒誰鑿幽軒刮眼眀湖中嘉處更禪扃龍聽夜講寒生席鷗伴晨齊暖戲庭水月澄眀應作觀雲山濃淡自開屛我公亦為留奇句此地人閒合有靈某為世所棄困居於蘇平生交遊過門不顧長安侍讀葉丈不以秦吳之逺髙下之隔閔此窮悴特貺以詩然韻險句奇不可攀續仰酬髙誼強抉蕪音公鎮西都擁劇權逺嗟窮苦寄新篇氣雄迥出關河外句險空驚魚鳥前玉帳夜嚴兵似水茅齊春靜草如烟才愚榮悴皆殊絶自笑相酬更斐然暑中間詠嘉果浮沈酒半醺床頭書冊亂紛紛北軒凉吹開疏竹臥看靑天行白雲寄題趙叔平嘉樹亭嘉樹名亭古意同拂簷圍砌共青蔥午陰間淡茶烟外曉韻蕭疏睡雨中開户常時對君子繞軒終日是清風盤根得地年年盛豈學春林一晌紅西軒垂釣偶作曽以文章上石渠忽因讒口出儲胥致君事業堆胸臆却伴溪童學釣魚夜聞笮酒有聲因而成咏糟牀新壓響泠泠攲枕初聞睡自輕幾段愁悰俱滴破一畨歡意巳篘成空階夜雨徒傳句三峽流泉無此聲只待松軒看飛雪呼賔同飲甕頭清秋夕懷南中故人向夕依䦨念昔遊蕭條節物更他州池平不動天深碧月色無情人獨愁千里江山幽信絶一場風露敗荷秋征鴻急急知何事斷續哀鳴過不休蘇學士文集卷第八
