body:
  text: 蘇學士集校語蘇學士集行世惟商邱宋氏刊本舊本罕見今假海寧陳氏藏何義門校本勘其異同並補録施元之跋何校勝宋本遠甚茲以何校為大字以宋本注于下歐序一葉一行無原字蘇學士文集總目武功蘇舜欽字子美一葉四行無古詩二十四首六字七行無與同年三字十七行無己卯冬三字二十行有二首二字二葉二行無感懷二字五行無古詩二十首五字六行無揚子江觀風浪六字九行無高文悅三字十行無釋字十三行作揚子江觀濤吳江亭看月寄張子野十四字十四行無越州二字十五行無之作二字十六行無歸值風三字十七八行作出京後寄韓二歐陽九杜二三葉一行撿書下有高山別鄰幾一行三行作答呂公初五行暴作大無雷霆二字七行無古詩二十首五字八行無依韻二字十行無詩字十一行無和鄰幾三字十二行無依韻見月遇雨六字十三行無夜聞感而成詠六字十六行作張生攜琴酒見過十八行無呈子履三字二十行作留別王原叔四葉一行無和子履三字二行無尹字四行作答公素學士九行無古詩十八首五字十行無若神二字十二行作郡侯見訪十三行無赴彭門三字十四行無寄字十五行無感詠二字十七行無庶子泉三字陽冰上有李字五葉二行無子華二字五六行作夜出盤門呈黃尉十一行無古詩十四首五字十二行作黃雍佚老亭十三行無還家二字十四行無和歌二字十五行無詩字十六行無圖字十七八行作演化彈琴十九行無同年二字二十行無丙子仲冬四字六葉六行無淮上二字八行無律詩三十四首六字十十一行作師黯寄彭甘十四行無後字十六行無夏日呈王尉五字十七行無還鄉二字七葉一行無游南內三字二行無游江南三字三行無和馬承之四字六行無獨字七行無過字八九行作含元殿基十行無望字十一行無留題二字十二行無宿終南山下五字十三行無與友生會話五字十四行作王揚庭宰巫山十六行無春暮初晴四字十七行作寄王耿十八十九二十行作范希文尹師魯歐陽永叔八葉四行無和遇二字五行作先公愛馬八行無律詩三十九首六字十行無無錫二字十三四行作通越門十五六七行作秀州城外思解生九葉一行無杭州二字二行作安濟亭看潮四行無長橋未明四字五行無晚霽二字九行無藍田二字十行無冬夕有懷四字十二行無答和叔三字十五行無有感二字十七行無有感二字十八行無野步有感四字二十行作和公素丹陽晚望見懷十葉二行無題壁二字七行作鶴唳八行作松江橋對月九行作答杜丞相十二行律詩四十三首六字無十三行無晚字十四行無依韻二字十五行無見寄二字十九行無三夕二字二十行作懷月聽琴十一葉二行作宿虎丘寺八行無步亭二字九行無亭字十一行無揚州城南四字十五行吟作游十六七八行作墨寶亭之集賢十九行作霅上游何山作卷第十四十五行無啓表十二首五字十六行作上奉寧軍陳侍郎啓十九行後有哀穆先生文祭舅氏文祭滕子京文三行十五葉三行無第一二字四行至七行第二表等字皆作又字八行作卷第十五九行無記序雜文十六首七字十一行作大悲殿記十二行無新修二字十六葉四行無孝子二字四行作卷第九七行無志銘八首四字十一行無知代州三字志下有銘字十行作崔處士君墓志銘十三行作太常博士宋公墓志銘十四行作屯田郎中鄭公墓志銘十六行作卷第十十七行志銘六首四字無十七葉二行後有韓公行狀王子野行狀二行四行至十行俱無十二行作蘇學士文集目録終蘇學士文集卷第一武㓛蘇舜欽字子美一葉六行無傍注平字七行鎖鎖十二行父又十六行舜堯十七行干扞十九行使史二葉七行榮榮十二行眦睚睚眦十八行頓頑寨塞三葉五行火大六行已之八行騎虜指笑虜騎笑指十五行薾榮掉棹十七行新斯四葉二行明名十行辮瓣二十行尚向五葉十一行殷勤殷殷十四行棖張十五行不為傷生事更多宋本無更多二字何云据舊校增六葉十行截絶十八行侍倚八葉十五行堄塊九葉一行蒿蓬大小言宋本作一首校分作二首了語不了語二篇文刻鑑句章郡詩其為句甬無疑七行册詩按三行夢斷風一颯下從文鑑及時刻宋詩鈔作別為一篇題為別鄰幾余賦高山詩以見意後見舊校云鈔本如此九葉三行仆自八行暴淫十二行看首蘇學士文集卷第三二葉五行冀州緑髮三十一冀州二字從舊校增六行面腼珂河健倢九行凄棲三葉一行皆香四行塵纖徹特徹將六行經徑十行淸精苦若十一行俯勉四葉四行君書愜感五行無花字淸下有尊字九行惚忽八行將疑鏘五葉一行義意十七行臆膈所四十八行烈烈不開之者二十行器亦於于川水六葉一行平疇玉璧二行嗟吁七行羽質據踞瑟琴何氏書和子履雍家園詩後云此詩亦載歐公外集據歐集則荆公四家詩選中亦有之剝落歐集作解剝君之作知君十七行震下有起字二十行緬緬鏗鑑七葉一行凛廩三行賦賊九行聚竪十行迸落十七行緬綿八葉一行衝冲三行治住五行可下有休字辦辨十行㾕音審瘁二十行思事九葉六行已樂九行滯濡滯八入十行晨夕苦蘇學士文集卷第四一葉三行然於放然十一行庖厨十二行炙釂十四行見跋已跋己見十六行關閔十七行身世十九行益抑二葉一行於與二行琚裾四行辜孤十二行蹤縱三葉一行惚恍忽貺具俱四行但耽寢耽晝寢五行鶱騫十四行孺立四葉六行力辨力辨八行森生十行寇官椎追十五行揶邪五葉二行含舍十四行波浪十五行經徑十七行漫熳十八行平半十九行子豫二十行歎難六葉四行石古晃見六行嶔嵌飣餖七行飣餖餖飣八行未又九行聞文十行南向十九行瞰看二十行楞稜七葉三行子履杖履四行彼被九行擲撾十七行碧壁十八行相疑明八葉十二行眷卷十三行豫子九葉一行礔霹靂五行必心十一行澄不流不流流紛紛澄澄十五行精淸十六行餖飣十葉六行葉木汙汚八行忘妄十一行嘉佳蘇學士文集卷第五一葉十四行虎步步虎二葉二行褊偏八行精積十四行北此十八行入噤慘人襟滲三字何云以意改三葉一行月石硯屏歌石月屏圖四行得成五行且或兩二七行常蛾嫦娥下同十行吸向十一行爍爛四葉三行至主仗伏十五行兼問十八行蘿羅五葉二行木水七行危瓦㩻十四行柅楃十七行鴈燕十八行緣原十九行歌六葉三行王玉下同九行郛郭十三行疾病病疾十四行已以十七行立世資勤誦讀圓曲勿自悅時命不復說何云圓曲以取世資所謂草竊也鑑本亦誤十八行紲恰旅拾稆十九行漿飲渴竭七葉三行長中六行貪食七行才足足才九行危瓦􅑶㩻甈十二行大天十四行驗念十六行汙汚十七行暇敢二十行輊幹八葉一行媼嫗七行當賞十二行尫羌十四行惰隨十五行麾揮伏復十七行令今九葉一行蜜密四行牢勞七行情清十四行映隱十七行鴉啞十八行閔閒送梁子熙聯句大榮大辱能生死人叔才二物不並以撓厥真子美之子病悶腸如車輪叔才勞憂到母餓寒著身子美世俗鹵莽輒置莫親叔才文殺光艷伏不得伸子美凄吟哀號酸入四鄰叔才夜計破午若燕若秦子美腹憤軋軋胸奇陳陳叔才淮國晚嶺吳渠春津子美去謝夙蘊歸逢故辛子美雌火在丑刮鑿遁屯叔才駕風鞭霆以脫凡鱗子美山谷跋云景祐元年仲春子美于蜀綾紙上楷寫字極端徑可愛叔才蓋才翁舊字此篇不見于家集右聯句一首並跋義門從山谷集録補餓寒原作寒餓光艷原作光焰腹憤原作腸憤鞭霆原作鞭鱗均依宋槧豫章黃先生集校改蘇學士文集卷第六一葉十一行闕殿十二行觚孤三葉七行刑型八行算等四葉七行揶邪九行寞莫十一行塘堂十二行古今今古五葉六行緌纓七行電殿九行尊爭十七行陳原作塵何云疑作陳六葉二行去去去七葉二行貶謫三行寬慰四行袞原作裒何依范集附録改七行來原作束何依范集附録改十二行相向十六行界事十八行亭當八葉六行駛駃七行帷斃蘇學士文集卷第七一葉十行刮括二葉五行寞莫七行鑑鏡三葉二行唐塘四行後浚十一行燒曉四葉十二行蕭瀟十三行無原本缺三字五葉三行烹魚十四行淮懷十五行晴陰隂睛七葉十行棲栖十四行世色何又云後村詩話作色十七行諳諧八葉二行去字下何云吳郡志作住蘇學士文集卷第八一葉二行首字下有次韻二字三行角閣十一行眄盼盼盻十三行穽盡針任十五行揶邪十九行日自二葉一行雨中聞鶯何云歐公嘗與聖俞泥滑滑及自作畫眉鳥詩俱書之殆此篇耳九行甚盛十二行居猿十九行蛇蛔二十行如入三葉四行空還八行翟敵四葉三行是吳郡志作時六行微隂五葉十一行見是十四行山上六葉五行概慨七行罹離七葉一行寞莫分憤流風回行從吳郡六行志改回則志作八行荆去志作十四行鎮淸明八葉十七行引飲十九行光平獨酌出朝補之所記乃其真蹟一酌澆腸俗慮奔鷃微鵾大豈堪論焚靈當日能知此肯入滄江作旅魂蘇學士文集卷第十一原作第九一葉五行刀刃殭彊七行焉哉八行行無狀行無狀疑有訛十六行於以十七行憂幽二葉六行小善善小二十行意慈三葉四行襞檗八行殞命捐軀捐命九行掇輟之以此書印本稍後者之以一作以之十四行蓋益十九行頃輕四葉一行概慨二行川州五行二二据范集附録改八行于子于疑守字范集附録作局于一州九行制置十五行而又從附録十九行寇貪五葉六行俟使從附録七行返反九行虜十三行惰墮十五行亢先十七行幸甚下又重幸甚二字練護護練六葉十行藝文文藝十一行謄騰闔下似脫門字十八行衷下有焉字某下無為字七葉三行蓋亦尺一一尺詳羣十七行時雖可欺時雖欺之十八行丈又八葉十行忠下有臣字十四行反失十五行辭詞下同十九行董薰十葉一行問聞七行山三八行傷韙九行奴十四行翹翹詡詡十五行幹體十七行次路十一葉十七行讎酬十二葉四行孳蘖九行翟十九行構搆十三葉四行窮鞫鞫窮十四葉五行時下有惟字蘇學士文集卷第十二原作第十一葉四行開見京下有師字六行趣尚趨向十二行嫌疑疑嫌十三行捽猝十五行鈎賾賾言存在二葉七行栖栖棲棲八行笑我譏笑十九行適下有故字二十行宦官三葉四行莫不七行于下有未字九行子華詩子注十三行來未四葉五行君聖十五行不敢敢不五葉二行來老三行祖租五行得下無以字十行止秖十三行天生十六行閔問十八行置實十九行儼嚴二十行又久六葉一行語下有於字六行藩籓八行光下有明字十行下下有其字十四行美矣十七行欲豫豫欲七葉二行聲身七行滑淆十五行上止八葉二行此為十二行某其十七行悻幸二十行主太丈文九葉二行志忠十四行次下有伏毒不敢開口但日日窺伺閣下之失將以快意十九字十五行帥師十葉五行始既八行效效十八行如下有於字依范集附録十一葉一行實甚五行疑上有人字天上有又字十行甚其十一行利下有甚字十五行齎齊十七行咨目二字無下同十二葉二行于十三行勾內十五行軍經十三葉九行間閒十三行在任十七行級給十四葉十八行閉閒偶耦二十行省者十五葉十六行國朝相國十七行云去十七葉五行庶幾隨變制宜庶知幾變隨時制宜九行第十二第十蘇學士文集卷第十三原作第十一一葉十五行無詣字匭下有函字二葉一行臺諫諫臺十二行追逮十七行閔憫貿負十九行無景佑五年側注宋史作康定中三葉四行夷狄六行告見四葉五行耶也十二行春夏十六行初和十八行效效五葉一行聽聰三行謹今十八行正直效效六葉一行愼能七行謀謨十九行疏下無小注二十行臣上有某月日草茅臣冒死謹拜疏於皇帝闕下十六字七葉二行教政四行聽意五行被受八行連至八葉一行減咸八行意地九行世君十二行羣下有有字十六行禮敬九葉一行拱恭五行也下有時年二十一詣登聞獻此疏小注七行寇下有暴字十行早卑二十行而巳巳而十葉九行效效十七行文篆之篆十九行矩下有增減二字十一葉六行族宅八行神名十二葉一行時是三行軍車九行疏下無小注十行臣上有某月日臣冒萬死拜疏皇帝闕下十三字十三行著署十八行管營十九行巾中十三葉九行應下有極字十二行焉也十四葉一行卒是三行弮弓十三行懇悃十五行越下有時年二十二小注十五葉十九行況惟十六葉一行之下無大字馬焉七行唐至堂在十三行本非墮墮本非值致十五行化風風化八葉五行伏望下有尊號二字十二行本下有中謝二字十七行惟下有尊號二字十八行全令縷螻十九行冀俯九葉二行願顧扦行尤由請下有中謝二字十三行音旨十四行瀆下有中謝二字二十行效效十葉一行知下疑有脫字自思八行帑幣十三行愛而愛之十六行望下有尊號二字二十行效效十一葉一行敢下有有字四行十四十二蘇學士文集卷第十五原作第十三一葉六行泮判十三行平字舊校云旁注二葉九行橐櫜十行物助十三行圓智智圓十四行事章三葉五行久下無之字十五行絶捷十九行求永四葉二行永遠三行愜慝六行焉矣十二行移陵五葉二行函原作合依文鑑改十六六十四行祐右承祐出于教坊不當載其名子美殆未見國史爾十一行人情人字從吳郡志志無耳字寓遇十五行能下有見字從志十六增行自目十九行雲霞霞雲七葉四行嚗喝莊子嚗然而笑一作呁六行二三八行耳下有慶歷七年十一月五日記十字十八行正止八葉三行新斯四行基根十二行曹曾十六行祿仕仕祿九葉五行堋棚八行斡幹十葉四行堙埋六行立歷八行惰墮九行泉下無之字十二行固故十七行完丹猥茂黈繁茂嵯峨十一葉二行焉安四行賤職八行厄沒十行無也字疑尚有脫文十四行採采十二葉一行特振時震三行卒率義意五行遇事遇者九行也于矣下有康定元年十一月十七日序十一字十四行疹痛二十行與於十三葉四行俗僞七行史叟狼浪十一行此皆十四行堯下有之字十七行寂寥寥寂十八行謂為十四葉七行孽妖妖孽十三行灰原作炭後漢書注中訛作炭故文家仍之炭豈能動也十四行于其仁子其仁十九行彖象十五葉五行名也名焉六行孳蘖七行陽隕十二行息耶息也十三行在下十七行天而十六葉一行焉矣四行而專不專九行孝行十一行呵訶十八行洚澤十九行於與十七葉一行帛下有粟字謂下無衆字九行於薄十行然能十一行牽掌效效十六行後前前後十八葉一行一亦五行唐塘十行五三蘇學士文集卷第九原作十四一葉十八行較校二葉三行羣郡十四行叙緒十五行既上有亦字十六行覯備在任十八行丁下二十行庾庚扇倉三葉六行困固七行可下有以字十一行痌癎十五行碩果之之於果二十行間開四葉四行不犯無犯喪下旁注平字十五行人八二十行銜延五葉十五行命民十七行汨淚十九行地六葉三行三四在任五行病痛六行不可逮過十二行呼吁七葉一行頓下有失字二行寢下無失字三行君若五行二十六矣三月十六也舊校云上云七日而逝自十三至十六才四日耳恐宜從鈔本但尚衍脫一年字十九行自下有將字八葉四行在任九行數百兵百十二行轉騎幕漠十三行帥師二二十七行建進十九行束東僥徼貰殊貫珠九葉五行效效八行書下有五字在任十九行郎部十葉五行耀擢會委八行於下有平字十一行中申十五行記託十九行頽閒十一葉二行史吏三行聞道道辟敗賤四行著於十二葉五行邑邑悒悒六行置繫七行比乃十一行誼義十二行偶遇十六行西函二十行何云叙鄭所自出既曰微子又曰桓公為所未喻疑前一行自其先至出焉為宋仲達志錯簡十三葉一行因土因王二行無逃患二字三行劔斂七行官氏官文八行羑菱九行迫睦十一行惠某十七行鍾於河鍾河於十九行揵犍十四葉一行殺下旁注去字五行相下旁注去字八行嘗常九行佳其頌公十行藝就十四行效效十八行隱垣禽擒十九行讓公下有公字二十行濫隘十五葉二行明道二年九月日明年二月九日十三行雄弘十八行名民十六葉十三行資資十七行酒次蘇學士文集卷第十原作十五一葉三行繼室何云此二字誤用六行公下有公字十一行侈後二葉七行效效十三行校下有理曰絳太子中允曰繹曰維曰縝太常寺太祝曰緯二十字二十行實石三葉六行吁可十八行無復四葉四行寃魂六行祜祐禁某八行笑矣十一行特改特授十六行羣郡二十行效效五葉二行唐塘五行中下有為字十三行部郡十四行暍下無音謁二字小注十五行在任六葉三行息恩四行丞下有相字十六行間關門闋蘇學士文集卷第十六此行衍舊本止十五卷也一葉八行真貢十行繇縣十一行朝師十五行處下有焉字二葉二行迸送四行祠祀八行裒取十八行名明三葉三行封下有府字十行瑋煒十七行文穆公知四葉三行有脫字四行有罰有法十六行祠祀十九行大太五葉五行茂幾七行嘉加八行二下有美字十九行徙抄本作當是涉字六葉三行謂下無嘶字四行之上無囉字藩籓八行效效十四行臣城十五行格俗十六行真貢二十行斂下有郡字七葉四行社杜十二行公先公前十四行水上有任字十五行縝績八葉三行充尤十七行宗旦宗且九葉六行而祀之祀之而十一行重輕輕重十二行關問十三行面而十葉十一行于豫須需十四行慕下有向字十九行倍俗十一葉二行幸偉四行無上使字十行謂有謂之十一行數教十二葉十六行托撫十三葉五行共皆十三行蘇學士文集卷第十六一行衍蘇子美集十五卷歐陽文忠公為之首序子美在寶元慶曆間有大名其文章瑰奇豪邁自成一家不幸淪落早世故生平所著才止于此而近時亦少見之元之因俾鏤板于三衢又得尚書汪公聖錫所藏豫章先生詩為子美作也惜其未大傳並附之左方若祭文墓志已見于文忠集中此不復載乾道辛卯六月已巳吳興施元之書困學紀聞載子美作大相國寺藏太宗御書飛白寶殿頌吳郡志四十九卷有邂逅劉公尤于平望走筆敍意五言古詩一首此頌周益公有跋按歐公序出于公之所集録者十五卷今必紛更舊次為十六卷是亦好妄而巳徐節孝愛愛歌序云子美有詩今亦不見集中朝氏讀書記載李文公集前有蘇舜欽序云唐之文章稱韓柳翺文雖不逮韓而理過于柳今頌與此序無之蓋亦非完書云康熙巳卯夏六月焯識巳上二則在目録後康熙庚寅良月之望借叢書堂鈔本校過焯記卷九後於此見子美之不負所知范公之取人為不苟同世徒以一觴一詠稱之者淺也然如選擇宗子一事當范公作參政恐尚未可行之會且此宗社非常大計亦當白之宰相同詞以請豈參政獨為建白始試以空言博天下虛譽哉卷十後戊寅九月初五日閲第九卷至末卷畢子美之才高於歐公得年不永未見其止爾家貧不能購宋元文集此集非徐氏重刊何由寓目此事實默受商邱中丞之賜矣焯識周益公稱衢本滄浪集蓋嘗刻于三衢南渡後本也計世當有之顧修遠云子美有答歐陽公書載梁溪漫志中集不載歐公詩集中有扶溝知縣周職方録示白鶴宮蘇才翁子美贈黃道士詩集不載司馬溫公傳家集亦載此詩見蠶尾集載渠家有宋槧滄浪集正衢本也商丘與新城交最深而不知假以是正蓋近人讀書但備數而不求善本雖倦圃竹垞猶不免況北方之學者乎又記巳上在卷末
