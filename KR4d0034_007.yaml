front:
  text: 蘇學士文集卷第七
  hash: sha256:2ac214df1abed7b6dd0f92191eb53e3768897848fda90a1262e556e4249de92e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_007-1a}
body:
  text: 晚出潤州東門京口古雄處昔年嘗此過風流看石獸人事共江波河轉路疑盡日斜山更多城樓鬱天半回首恣吟哦無錫惠山寺寺古名傳唐相詩三伏奔迸豫何之雲山相照翠㑹合殿閣對走凉參差清泉絶無一塵染長松自是拔俗姿二邊羌胡日鬭格釋子宴坐殊不知過蘇州東出盤門括眼眀蕭蕭疏雨更陰晴緑楊白鷺俱自得近水逺山皆有情萬物盛衰天意在一身羇苦俗人輕無窮好景無緣住旅櫂區區暮亦行吳江亭氣象清雄天與鄰世間不合有埃塵擬將纍句酬佳景只恐江山解笑人秀州通越門外八九里臨水多佳木茂樹以便風不得停舟一賞愴然為詩密樹重蘿覆水光珍禽無數語琅琅驚帆瞥過如飛鳥回首風煙空斷腸秀州城外九里有竹樹小橋豫十八年前與友人解晦叔飲別於此今過之景物依然而解生已亡悲歎不足復成小詩當年共醉此橋邊道舊狂歌至暮天得句旋題新竹上移舟還傍亂花前君埋塵土骨應化我逐風波心欲燃落日長號感人事沙頭寂莫上漁船天章道中畫鷁低飛湖水平髙低樓閣滿稽城人遊鏡裏山相照魚戲空中日共眀盡是荷風香不斷忽逢溪雨氣尤清籃輿却上蘭亭步猿鳥雲蘿伴此行望太湖杳杳波濤閲古今四無邊際莫知深潤通曉月為清露氣入霜天作暝陰笠澤鱸肥人膾玉洞庭柑熟客分金風烟觸目相招引聊為停橈一楚吟大禹寺鑑湖盡處衆峰前寺古蕭疏水石閒殿閣北垂連禹廟松筠東去入稽山坐中巖鳥自上下吟久溪雲時往還我厭區區走名宦未能來此一生間杭州㢲亭公自登臨闢草萊赫然危構壓崔嵬凉翻簾幌潮聲過清入琴尊雨氣來疇昔江山何處好生平懷抱此中開東南地本多幽勝此向東南特壯哉宿錢塘安濟亭觀潮支肘聽潮聲喧豗久未停隨風過漁浦江東地名伴月出滄溟鰌穴浚時滿胥神果有靈連天卷雲霧徹曉下雷霆拾楫游心倦憑䦨醉魄醒誰窮造物意擬訪酈元經使風長風天外來十幅健帆開仰首飛雲合牽心翠竹回間觀水知性靜與睡為媒始覺揚舲快疲駑亦可哀松江長橋未眀觀漁曙光東向欲朧眀漁艇縱橫映逺汀濤面白煙昏落月嶺頭殘曉混疏星鳴桹莫觸蛟龍睡舉網時聞魚鱉腥我實宦遊無况者擬來隨爾帶笭箵新開湖晚霽霽霞飛盡失西東水入天光浩氣中籍籍輕帆一遊鳥似乘風力上虗空九日汴中旅櫂出江湖漂然迹更孤風波數破膽時事一長吁聞說西羌使猶稽北闕誅欲言無上策且復醉茱萸淮中晚泊犢頭春陰垂野草青靑時有幽花一樹眀晚泊孤舟古祠下滿川風雨看潮生韓忠憲公挽詞二首才發經綸地心開忠義源朝端遺盛業泉下閟英魂儲禁追封美儀曹集諡尊他年還駟馬餘德在髙門中臺典故眀二府弼諧成車挂身方佚舟移世共驚霜風吹縞帳野月照丹旌寂莫都門路傷哉如昔行詔獄中懷藍田髙先生自嗟疏野性不曉世塗艱仰首羡飛鳥冥心思故山剛來投密網誰復為顰顔寄語髙安素今思日往還湘公院冬夕有懷去年急雪灑窗夜獨對殘燈觀陳圗今夕悲風撼軒竹又來開卷擁寒爐禪房瀟灑皆依舊世路崎嶇有萬殊原本缺離京後作春風奈别何一櫂逐驚波去國丹心折流年白髮多脫身離網罟含笑入煙蘿窮達皆常事難忘對酒歌答和叔春日舟行幽人漂泊興無窮弄水尋花處處同春入水光成嫩碧日勻花色變鮮紅靜中物象知誰見間極情懷覺道充寄語悠悠莫疑我五湖今作狎鷗翁答子履塌翼下層雲飄然江漢濆蒼蠅休聚謗白鳥已為羣銀鯽晨魚美松醪夜酌醺生平同得失此日又逢君舟行有感忽忽賞節物區區何所歸天陰鳥自語水落岸生衣客况知誰念人生與願違東風百花發獨採北山薇淮亭小飲山氣復清淮亭臨亂石開旅愁無處避春色為誰來酒賴啼鶯送歌隨去雁哀相攜聊一醉休使壯心摧淮中風浪春風如怒虎掀浪沃斜暉天闊雲相亂汀遙鷺共飛冥冥走陰氣凜凜挫陽威難息人閒險臨流涕一揮夀陽閒望有感維舟亭下偶登臨下蔡風流古至今逺嶺抱懷隨曲折亂雲行野乍陰晴幽人憔悴搔白首啼鳥哀鳴思故林觸處塗窮何足慟直回天地入悲吟阻風野步有感呈子履輕舟留滯已春殘攜手栖栖田野間盡日東風吹百草有時雙鷺下前灣古來少見如君困世上應無似我間抖擻塵襟莫回首謗書終不到溪山過泗水五年六經此仰首歎勞生山是往時色人皆今日情機心去國少塵眼向淮眀物理吾俱曉漂流安足驚和丹陽公素學士晚望見懷古郡登臨足勝遊使君才調更風流過雲送雨海山暗斜日催蟬江樹秋屢辱嘉招嗟放棄又傳新咏慰淹留霜天乘興當西謁共醉城尖四望樓送子履一舸風前五兩飛南遷今去別慈闈人生多難古如此吾道能全世所稀幸有江山聊助思莫隨魚鳥便忘歸君親恩大須營報學取三春寸草微題花山寺壁寺裏山因花得名繁英不見草縱橫栽培翦伐須勤力花易凋零草易生春睡別院簾昏掩竹扉朝酲未解接春暉身如蟬蛻一榻上夢似楊花千里飛嗒爾暫能離世網陶然直欲見天機此中有德堪為頌絶勝人間較是非覽照鐵面蒼䫇目有稜世閒兒女見須驚心曽許國終平虜命未逢時合退耕不稱好文親翰墨自嗟多病足風情一生肝膽如星斗嗟爾頑銅豈見眀病起吳天搖落奈愁何病起風前白髮多爭得松江變醇酒拍浮終日恣酣歌秋懷年華冉冉催人老風物蕭蕭又變秋家在鳳皇城闕下江山何事苦相留秋曉聞鶴唳一聲落月銜栖露乍零竹閒孤唳入靑冥未知蟋蟀緣何事牀下微吟不暫停中秋松江新橋對月和柳令之作月晃長江上下同畫橋橫絶冷光中雲頭豔豔開金餅水面沈沈臥綵虹佛氏解為銀色界仙家多住玉華宮地雄景勝言不盡但欲追隨乘曉風病中得杜丞相見寄詩感而有作易毁唯遷客難諧是俗情愁多怯秋夜病久厭人生委順聞之舊衰羸見者驚新詩如接侍吟罷涕淋纓滄浪懷貫之滄浪獨步亦無悰聊上危臺四望中秋色入林紅黯淡日光穿竹翠玲瓏酒徒漂落風前燕詩社凋零霜後桐君又暫來還徑去醉吟誰復伴衰翁蘇學士文集卷第七
