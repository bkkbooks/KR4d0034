front:
  text: 蘇學士文集卷第二
  hash: sha256:a2acebd7a585510257393596e5a96f53fdff810940fb70de69c0d8584014886d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_002-1a}
body:
  text: 楊子江觀風浪晚至瓜州渡繫舟泊西灣日落暴風起大浪得縱觀憑凌積石岸吐吞天外山霹靂左右作雪灑六月寒吁嗟至柔物威壯不可干若爲神龍憑氣勢非一端大艦失所操翻覆如轉丸髙山雖有路轍險馬足酸居朝號安逸重禄多憂患爭得清靜交共騎雙翔鸞矯翅入赤霄不見此險難奈何蚩蚩衆共處天壤間因知古聖人立法萬世安濟川作舟梁鑄鼎窮神姦朝廷布禮度粲粲莫可刪後來漸破壞所向行路難凶邪得騁志物命遭摧殘視此念古昔杖藜空盤桓哭曼卿去年春雨開百花與君相㑹歡無涯髙歌長吟插花飲醉倒不去眠君家今年慟哭來致奠忽欲出送攀魂車春暉照眼一如昨花已破蕾蘭生芽唯君顔色不復見精魄飄忽隨朝霞歸來悲痛不能食壁上遺墨如棲鵶嗚呼死生遂相隔使我雙淚風中斜吾聞吾聞壯士懷恥與歳時没出必鑿凶門死必塡塞窟風生玉帳上今下厚地裂百萬呼吸閒勝勢一言決馬躍踐胡腸士渴飲胡血腥膻屏除盡定不存種孽予生雖儒家氣欲吞逆羯斯時不見用感歎腸胃熱書臥書冊中夢過玉關闕送安素處士髙文恱皇天稔巨憝羌虜稽顯戮廟算忽小醜王師數傾衄秦民著暴斂慘慘生意蹙賊氣愈張王鋒銳不可觸帷幄監前敗降心問白屋尺詔下中天公車塞章牘䇿慮盡頗牧勇決過賁育先生胸臆大經術内自足逸韻脫滓塵素節抱冰玉獨恥論兵戰因時射君禄不唯吾志乖亦使王道局放懷但文史散髮自溪谷近臣上薦書天子渇髙躅束帛三及門不免至京轂萬鍾非所好大議戛鈞軸孤鸞入紫煙網罟安可束天風萬里長沆瀣朝滿腹更期下翔集以爲蒼生福贈釋祕演髙車大馬闐上京釋曰演者何聲名當年余嘗與之語實亦可喜無俗情作詩千篇頗振絶放意吐出吁可驚不肯低心事鐫鑿直欲淡泊趨杳冥落落吾儒坐滿室共論慤若木陷釘賣藥得錢輒沽酒日費數斗同醉醒傷哉不櫛被佛縛不爾烜赫爲名卿數年不見今老矣自說厭苦居都城垂頤孤坐若癡虎眼吻開合猶光精雄心瞥起忽四顧便擬擊浪東南行開春余行可同載相與曠快觀滄溟城南感懷呈永叔春陽泛野動春陰與天低遠林氣藹藹長道風依依覧物雖蹔適感懷翻然移所見旣可駭所聞良可悲去年水後旱田畝不及犂冬温晚得雪宿麥生者稀前去固無望即日已苦飢老稚滿田野斲掘尋鳬芘此物近亦盡卷耳共所資昔云能驅風充腹理不疑今乃有毒厲腸胃坐瘡痍十有七八死當路横其尸犬彘咋其骨烏鳶啄其皮胡爲殘良民令此鳥獸肥天豈意如此決蕩莫可知髙位厭粱肉坐論攙雲霓豈無冨人術使之長熙熙我今飢伶俜閔此復自思自濟既不暇將復奈爾爲愁憤多滿胸嶸􅗆不能齊吳越大旱吳越龍蛇年大旱千里赤尋常秔穄地爛漫長荆棘蛟龍久遁藏魚鼈盡枯腊炎暑發厲氣死者道路積城市接田野慟哭去如織是時西賊羌凶燄日熾劇軍須出東南暴斂不暫息復聞藉兵民驅以教戰力吳儂水爲命舟檝乃其職金革戈盾矛生眼未嘗識鞭笞血塗地惶惑宇宙窄三丁二丁死存者亦乏食冤對結不宣衝迫氣候逆二年春及夏不雨但赫日安得凉冷雲四散飛霹靂霶𩃱消祲癘甘潤起稻稷江波開舊漲淮嶺發新碧使我揚孤帆浩蕩入秋色胡爲泥滓中視此久戚戚長風卷雲陰倚柂淚横臆中秋夜吳江亭上對月懷前宰張子野及寄君謨蔡大獨坐對月心悠悠故人不見使我愁古今共傳惜今夕况在松江亭上頭可憐節物㑹人意十日陰雨此夜收不惟人間重此月天亦有意於中秋長空無瑕露表裏拂拂漸漸寒光流江平萬頃正碧色上下清澈雙璧浮自視直欲見筋脈無所逃遁魚龍憂不疑身世在地上秖恐查去觸斗牛景情境勝返不足歎息此際無交游心魂冷烈曉不寢勉爲筆此傳中州越州雲門寺翠嶂環合封白雲中有蕭寺三爲鄰雲門梁武帝所作今分爲三寺相連老松偃蹇若傲世飛泉噴薄如避人蒼猿嘯斷夜月古丹花開徧陽崖春盤桓數日不忍去舟岀邪溪猶慘神和韓三謁歐陽九之作予方居憂艱胸懷積瘡刺昬眀走日月慘慘絶生意杜門厭過從掩耳避時事韓子我所佳招我懃有謂城南訪永叔共可豁蒙蔽是時窮陰久泥淖沒馬鼻區區不憚遠飢渇奔髙誼永叔聞我來解榻顔色喜殷勤排清罇甘酸飣果餌圗書堆滿牀措論極根柢伊余昬迷中忽若出夢寐劃然毛骨開精神四邊至既歸尚泠然數日飽滋味韓子歎不足作詩暢情義爛如珊瑚鈎光豔不可閉迫余使之和庶以同氣類自顧屯鈍極出語少姿媚抉剔雖強成徒使腸胃沸永叔經術深爛熳不可既雖得終日談百未岀一二倉皇逼行役蕭䬃包素志不日便乖拆安能訖精粹他年老門牆君子無我棄城南歸值大風雲一夜大雪風喧豗未眀跨馬城南回四方迷惑共一色揮鞭欲進還徘徊舊時崖谷不復見縦有直道令人猜低頭搶朔風兩眼不敢開時時偷看問南北但見白羽之箭紛紛來既以脂粉傅我面又以珠玉綴我顋天公似憐我貌古巧意裝點使莫偕欲令學此兒女態免使埋沒隨灰埃據鞍照水失舊惡容質潔白如嬰孩雖然外飾得蹔好自覺面目如刀裁又不知胸中肝膽掛鐵石安能柔軟隨良媒世人飾詐我尚笑今乃復見天公乖應時降雪故大好愼勿改易吾形骸出京後舟中有作寄文韓二兄弟永叔歐陽九和叔杜二久居倦京城歸心日傾寫扁舟理棹楫已與峻流下斷岸如崩山遠樹若奔馬回頭雲間闕出沒見圗畫還家快雖蹔去國傷以乍况我二三友眷戀數返駕前夕南巷堤昨日東城舍論精如可收意宻不見罅恍惚夢寐中蕭然巳相捨他人所至樂惟我氣類寡迂僻不能鐫往往自嗟罵平生居京都君輩乃知者異鄉孰與言救謗定不暇柔軟衆所佳佞面誰可借中懷百憂集包釀似𦵔鮓身世苦飄浮歳月不可把後期浩難知髙吟但悲灑寄冨彦國自古猾者胡與羌胡羌相連動朔方姦謀陰就一朝發直欲截割吾土疆遣使持書至闕下四方物論如沸湯天子仄席旰未嘗相君日暮猶廟堂彦國感槩請奉使誓將摧折其鋒鋩受詔驅馬出都門都人走觀歎且傷猾胡聞風已厭伏聚聽大議羞亂常願如故約不敢妄脫甲爭獻寳玉觴斾旌威遲還上國所至觀者如傾江杖父奔蹶喜出泣婦女聚語氣激昂至尊虚懐坐赭牀中人催入見未央對久赤日下輦道翠華影轉熏風凉歸來堂上拜夀母賔車塞破甘泉坊衣塵未滌又出使往來絶域如門牆巳知髙賢抱器識因時與國爲輝光不煩一甲屈萬衆以此可見才短長彦國本爲廊廟器何秖口舌平強梁使之當國柄天下夷狄豈復能猖狂大風秋半收穫登郊原欹側小屋愁夕眠是夜大風拔樹走吹倒南壁如崩山夢中驚起但呼呌病僕未動徒豗喧驅令燃火徧照燎瓦甓狼籍滿我前披衣抱枕欲避去去此乃是曠野田况時風怒尚未息直恐涇渭遭吹翻露坐不免念禾黍必已刮刷無完根六事不和暴風作嘗聞洪範有此言昔時大風禾盡偃上帝蓋直周公冤方今天子至神聖惟恐臣下辜其恩是何此風乃震作吹盡秋實傷元元有能返風起禾者亦足表異知所存至誠皎潔固不昧時雖今古同乾坤檢書煩心思所持屏事入小閣踾撲下塵梁侈哆張敗笈雨爛百數蕃蟲食三四夾軒昂醉墨閙纎悉新書雜魚子或破碎蠶兒尚狎恰快心伯長文跋尾清臣搨幼辭反知進故句時自愜墜亡多玩愛存聚必劵帖疎宻交及戚前後生與誨束儼父師寒暑布兒妾謔浪笑忽還私匿情再接愴事涕涔涔憫時歎􅊱􅊱一餉誠寂寞千里遽㑹合遊心到句涌開眼見苕霅京華歷􅍓復節物怱怱涉恍爾驚異方遁去乃幾臘囬頭厭襞積舉體覺疲薾東閣聊欠伸夢㫁風一䬃髙山扶層巓下與地盤結氣貫不變移澤枯乃朽裂有如善人交生死兩固節語黙無異方黯沮在爲別世風隨日儉俗態逐勢熱負子好古心噓歎星斗滅近得鄰幾生胸懷貯霜雪飢渇入詩書趣向著羈絏又與斯人離先日心破折古也當貽言在子可捫舌奈何區區誠敢以御者說器成必刓琢德潤資澡刷空文謾徽墨古訓乃佩玦帝門急豪英濟物無自孑雜興虎豹性食人智者畜爲戲形影本相親愚夫見而畏疑同不疑異遠哉愚與智呂公初示古詩一編因以短歌荅之覧君古風之章句兩謝不足以下顧長江走瀾天外來黄鵠軒風日邊去上有致君却敵之良䇿下有逍遥傲世之眞趣惜乎志大名位卑眀珠投闇人疑之昔時名價滿天下此日塞黙趨塵泥古人但以才術喻冨貴自餘之外胡足思公初之道既如此宐乎窮約而不悲媿無玉案報神藻聊此感激成荒辭老萊子常羨老萊子七十親不衰䬃然雙白鬢尚服五綵衣戲游曰膝下弄物心熙熙或時暫自跌輒作嬰兒啼清朝萬鍾禄不肯賣片時人生有此樂何暇外慕爲伊余生不造才壯蒼天虧搏膺念之子歎咏形諸詩想像且三復苦血下交頤往王順山值暴雨雷霆蒼崖六月陰氣舒一霔淫雨如繩麤霹靂飛出大壑厎烈火黒霧相奔趨人皆喘汗抱樹立紫藤翠蔓皆焦枯逡巡巳在天中吼有如上帝來追呼震揺巨石當道落驚噑時聞虎與貙俄而青巓吐赤日行到平地晴如初囬首絶壁尚可畏吁嗟神怪何所無蘇學士文集卷第二
