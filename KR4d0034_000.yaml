body:
  text: 商丘漫堂先生宋犖鍳定卷第一古詩二十四首感興三首慶州敗及第後與同年宴李丞相宅升陽殿故址大霧藍田悟真寺作興慶池長安春日效東野太行道對酒夜中蜀士己卯冬大寒有感獵狐篇難易言二首大小言了語不了語二首舟中感懷寄館中諸君送李生卷第二古詩二十首楊子江觀風浪哭曼卿吾聞送安素處士髙文恱贈釋祕演城南感懷呈永叔吳越大旱中秋夜吳江亭上對月懷前宰及寄君謨蔡大越州雲門寺和韓三謁歐陽九之作城南歸值大風雪出京後舟中有作寄文韓二兄弟永叔歐陽九和叔杜二寄冨彥國大風檢書雜興呂公初示古詩一編因以短歌答之老萊子往王順山值暴雨雷霆卷第三古詩二十首依韻和勝之暑飲答宋太祝見贈送李冀州詩和鄰幾登繁臺塔依韻和伯鎮中秋見月九日遇雨之作夜聞秋聲感而成咏同鄰幾作和聖俞庭菊答梅聖俞見贈舟至崔橋士人張生抱琴攜酒見訪頴川留別王公輔維舟野步呈子履滯舟過濠梁别王原叔和子履雍家園尹子漸哀辭天平山奉酬公素學士見招之作遷居遣悶苦調卷第四古詩十八首若神棲心堂郡侯訪豫于滄浪亭因而髙㑹翌日以一章謝之送關永言赴彭門寄題豐樂亭夏熱晝寢感詠哭師魯和永叔琅邪山庶子泉陽冰石篆詩答章傅遊山寒夜送施秀才送韓三子華還家觀放金山寺九月五日夜出盤門泊于湖間偶成密㑹坐上書呈黃尉送張統尉嘉禾秋夜寄題周源家亭卷第五古詩十四首黃雍於西安修水之側起佚老亭以奉親送黃莘還家和菱磎石歌頂破二山詩永叔石月屏圗演化琴德素髙昔嘗供奉先帝聞豫所藏寶琴求而揮弄不忍去因為作歌以寫其意云寄王幾道同年丙子仲冬紫閣寺聮句水輪聮句薦福塔聮句悲二子聮句地動聮句瓦亭聮句淮上喜雨聮句卷第六律詩三十四首和石曼卿眀河詠師黯以彭甘五子為寄因懷四眀園中此果甚多偶成長句以為謝遊洛中內送杜密學赴並州送家靜及第後赴官清水串夷靜勝堂夏日呈王尉黎生下第還鄉春日晚晴代人上申公祝夀有客遊南內九龍宮送陳進士遊江南和馬承之古廟和解生中秋月宿太平宮獨遊輞川過下馬陵覽含元殿基因想昔時朝㑹之盛且感其興廢之故望秦陵留題樊川李長官莊宿終南山下百塔院宿華嚴寺與友生㑹話送王楊庭著作宰巫山晚意春暮初晴自御宿川之華嚴寺次韻和師黯寄王耿端公聞京尹范希文謫鄱陽尹十二師魯以黨人貶郢中歐陽九永叔移書責諌官不論救而謫夷陵令因成此詩以寄且慰其遠邁也暑景夏中夏意和淮上遇便風先公之愛馬以病寄他廏今死矣重過句章郡卷第七律詩三十九首晚出潤州東門無錫惠山寺過蘇州吳江亭秀州通越門外八九里臨水多佳木茂樹以便風不得停舟一賞愴然為詩秀州城外九里有竹樹小橋豫十八年前與友人解晦叔飲别于此今過之景物依然而解生已亡悲歎不足復成小詩天章道中望太湖大禹寺杭州㢲亭宿錢塘安濟亭觀潮使風松江長橋未眀觀漁新開湖晚霽九日汴中淮中晚泊犢頭韓忠憲公挽辭二首詔獄中懷藍田髙先生湘公院冬夕有懷離京後作答和叔春日舟行答子履舟行有感淮亭小飲淮中風浪夀陽間望有感阻風野步有感呈子履過泗水和丹陽公素學士晚望見懷送子履題花山寺壁春睡覽照病起秋懷秋曉聞鶴唳一聲中秋松江新橋對月和柳令之作病中得杜丞相見寄詩感而有作滄浪懷貫之卷第八律詩四十三首和彥猷晚宴眀月樓二首依韻和王景章見寄答仲儀見寄雨中聞鶯滄浪亭秋雨中秋三夕對月懷月來求聽琴詩因作六韻送黃通秋宿虎丘寺數夕執中以詩見貺因次元韻滕子京哀辭寒食招和叔遊園春日懷舊遊春日感懷夢歸獨步遊滄浪亭初晴遊滄浪亭滄浪觀魚遊招隱道中揚州城南延賔亭吳江岸晚泊龜山滄浪靜吟丹陽子髙得逸少瘞鶴銘于焦山之下及梁唐諸賢四石刻共作一亭以寶墨名之集賢伯鎮為之作記逺來求詩因作長句以寄遊霅上何山霅上冬夕偶書寒夜十六韻答子履見寄獨遊曹氏園館因寄伯玉小酌送人還吳江道中作題廣喜法師堂詩僧則暉求詩關都官孤山四照閣清軒某為世所棄困居於蘇平生交遊過門不顧長安侍讀葉丈不以秦吳之逺髙下之隔閔此窮悴特貺以詩然韻險句奇不可攀續仰酬髙誼強抉蕪音暑中閒詠寄題趙叔平嘉樹亭西軒垂釣偶作夜聞笮酒有聲因而成咏秋夕懷南中故人卷第九書七首上三司副使段公書上范希文書應制科上省使葉道卿書上京兆杜公書上孫冲諫議書上孔待制書上集賢文相書卷第十書六首答韓持國書答馬永書答范資政書答李鋭書答杜公書上范公參政書並咨目七事咨目一咨目二咨目三咨目四咨目五咨目六咨目七卷第十一上書疏狀九首乞納諫書詣匭疏火疏論西事狀乞發兵用銀牌狀論宣借宅事乞用劉石豫弟投匭疏論五事卷十二啓表十二首啓事上奉寧軍陳侍郎上杜侍郎啓上執政啓薦王景仁啓京兆求罷表杜公讓官表杜公謝官表杜公求退第一表第二表第三表第四表第五表卷第十三記序雜文十六首粹隱堂記東京寶相禪院新建大悲殿記並州新修永濟橋記滄浪亭記蘇州洞庭山水月禪院記處州照水堂記浩然堂記漣水軍新閘記送外弟王靖序送王緯赴選序石曼卿詩集序送王規方叔序符瑞復辨杜誼孝子傳題杜子美別集後卷第十四志銘八首先公墓志銘江寧府溧陽令蘇君墓志銘亡妻鄭氏墓銘內園使連州刺史知代州劉公基志處士崔君墓志太常博士宋仲達墓志銘屯田郎榮陽鄭公墓志銘歙州黟縣令朱君墓志銘卷第十六志銘六首太原郡太君王氏墓志太理評事杜君墓志奉禮郎杜君妻張氏墓文兩浙轉運使司封郎中王公墓表大理評事程君墓志銘廣陵郡太君髙氏墓志銘卷第十六行狀哀辭祭文五首韓公行狀王子野行狀哀穆先生文祭舅氏文祭滕子京文蘇學士文集總目震澤徐惇復七來挍
