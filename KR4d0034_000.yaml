front:
  text: 蘇子美文集序豫宦遊吳門得宋蘇子美滄浪亭遺址於荒煙蔓草中稍稍為之起廢墜葺垣屋數年以來亭之樹石若歲益而古嘉花名卉若月益而娟妍而吳之人雅好事春秋佳日遊屐麕集遂擅郡中名勝我輩馮弔古蹟履其地則思其人思其人則必慨想其生平求其文章詞翰以髣佛其萬一蓋尚友之道然耳子美故有集若干卷久傳於世惜板已毁世之獲見其集者蓋少豫幸得是本而卒業焉子美詩磊落自喜文章雄健負奇氣如其為人以之妃眺儷張殆無愧色顧朝張繼起於古學大盛之日而子美獨崛興於舉世不為之時挽楊劉之頽波導歐蘇之前驅其才識尤有過人者學者論宋初古文往往以子美與穆伯長並稱其實伯長不及也吳門徐子七來年少嗜古偕兄念修重為開雕將欲與豫之滄浪小志並廣其傳豫喜亟取是集付之書成請豫序豫曰昔歐陽公言之矣歐陽之序蘇氏文集曰子美齒少於豫而豫學古文反在其後又曰斯文金玉也弃擲埋沒糞土不能銷蝕其見遺於一時必有收而寶之於後世者嗚呼詎不有待於今日與康熙戊寅八月之朔滄浪寓公宋犖序大中丞宋公命復挍子美集讀之數日而乃恍然於公之重修滄浪亭之意也始亭之修也不知者以為政有餘暇僅以供遊覽也其知者以為愛慕其才不忍使其遺蹟之泯沒無傳也而公之意則大不然夫子美抱經世之學懷忠君之心觀其所為詩文及論時事劄子雖未見諸實事然其議論侃侃慷慨切直皆有關于社稷生民之故能言人之所不敢言不可以區區文人才士目之矣使當日天子宰相知其賢而大用之殆無難澤被一世名垂於後而惜乎其以酒食之過至遷謫以死徒使後之人憑弔遺蹤為之拊膺歎恨于九原之不可復作不大可惜哉公重其學問心術而惜其見棄于當時之君相又憫其亭之廢而不存是以修之也夫子美慶曆人也自慶曆迄今垂六七百年已無有過而問之者儻更歷幾百年其詩文必散失而無傳而所謂滄浪故址者亦且銷滅於榛莽之中而不可考將並不知子美為何如人豈復有新其亭而珍其遺集者乎雖其生平行事略備宋史而所載之文僅二三首苟不睹全集卒無由論其世知其人則世亦不過與文苑諸人同類稱之而止矣此公既修其亭而又命復挍其集之意也昔歐陽永叔序其集云凡人之情忽近而貴遠子美屈於今世猶若此其伸於後世宜如何也其猶此志歟復既承公命因與兄念修次第挍之而付諸劂氏康熙戊寅皋月下浣震澤徐惇復書于白華書屋蘇學士文集原序豫友蘇子美之亡後四年始得其平生文章遺稿於太子太傅杜公之家而集録之以為十五卷子美杜氏壻也遂以其集歸之而告於公曰斯文金玉也棄擲埋沒糞土不能銷蝕其見遺於一時必有收而寶之於後世者雖其埋沒而未出其精氣光怪已能常自發見而物亦不能掩也故方其擯折摧挫流離窮厄之時文章巳自行於天下雖其怨家仇人及嘗能出力而擠之死者至其文章則不能少毁而掩蔽之也凡人之情忽近而貴遠子美屈於今世猶若此其伸於後世宜如何也公其可無恨豫嘗考前世文章政理之盛衰而怪唐太宗致治幾乎三王之盛而文章不能革五代之餘習後百有餘年韓李之徒出然後元和之文始復于古唐衰兵亂又百餘年而聖宋興天下一定晏然無事又幾百年而古文始盛於今自古治時少而亂時多幸時治矣文章或不能純粹或遲久而不相及何其難之若是歟豈非難得其人歟苟一有其人又幸而及出於治世世其可不為之貴重而愛惜之歟嗟吾子美以一酒食之過至廢為民而流落以死此其可以歎息流涕而為當世仁人君子之職位宜與國家樂育賢才者惜也子美之齒少於豫而豫學古文反在其後天聖之間豫舉進士於有司見時學者務以言語聲偶摘裂號為時文以相誇尚而子美獨與其兄才翁及穆參軍伯長作為古歌詩雜文時人頗共非笑之而子美不顧也其後天子患時文之弊下詔書諷勉學者以近古由是其風漸息而學者稍趨於古焉獨子美為於舉世不為之時其始終自守不牽世俗趨舍可謂特立之士也子美官至大理評事集賢挍理而廢後為湖州長史以卒享年四十有一其狀貌奇偉望之昂然而即之溫溫久而愈可愛慕其才雖髙而人亦不甚嫉忌其擊而去之者意不在子美也賴天子聰眀仁聖凡當時所指名而排斥二三大臣而不欲以子美為根而纍之者皆蒙保全今並列於榮寵雖與子美同時飲酒得罪之人多一時之豪俊亦被收采進顯於朝廷而子美獨不幸死矣豈非其命也悲夫廬陵歐陽修序宋史本傳蘇舜欽字子美參知政事易簡之孫父耆有才名嘗為工部郎中直集賢院舜欽少慷慨有大志狀貌傀偉當天聖中學者為文多病偶對獨舜欽與河南穆修好為古文歌詩一時豪俊多從之游初以父任補太廟齊郎調滎陽縣尉玉清昭應宮災舜欽年二十一詣登聞鼓上火疏文載集中不録㑹有詔戒越職言事又上書文載集中不録尋舉進士改光祿寺主簿知長垣縣遷大理評事監在京店宅務康定中河東地震舜欽詣匭通疏極陳災變異常時政得失纚纚千餘言無所回避文載集中不録羣小為之側目范仲淹薦其才召試為集賢校理監進奏院舜欽娶宰相杜衍女衍時與范仲淹冨弼在政府多引用一時聞人欲更張庶事御史中丞王拱辰等不便其所為㑹進奏院祀神舜欽與右班殿直劉㢲輒用鬻故紙公錢召妓樂間多㑹賔客拱辰廉得之諷其屬魚周詢等劾奏因欲搖動衍事下開封府劾治於是舜欽與㢲俱坐自盜除名同時㑹者皆知名士因緣得罪逐出四方者十餘人世以為過薄而拱辰等方自喜曰吾一舉網盡矣舜欽既放廢寓于吳中其友人韓維責以世居京師而去離都下隔絶親交舜欽以書報之文載集中不録二年得湖州長史卒舜欽數上書論朝廷事在蘇州買水石作滄浪亭益讀書時發憤悶於歌詩其體豪放往往驚人善草書每酣酒落筆爭為人所傳及謫死世尤惜之妻杜氏有賢行兄舜元字才翁為人精悍任氣節為歌詩亦豪健尤善草書官至尚書度支員外郎三司度支判官蘇學士文集總目
