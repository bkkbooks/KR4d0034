  - {type: variant, offset: 5013, length: 0, content: '', WYG: 餘年公至復出訴察嫗色寃甚遂索舊牘視之皆未嘗引乳醫爲證一日盡召其黨出乳醫示之甲遂伏辜母子復故}
  - {type: page-break, offset: 5013, content: '', id: KR4d0034_WYG_016-3a, image: WYG1092/WYG1092-0120a.png}
  - {type: variant, offset: 5014, length: 1, content: 葉, WYG: 年遷屯田員外郎知相州時河北蝗旱轉運使因嵗計覆不以實聞諸郡畏莫敢言公力抗章請蠲賦役州民賴以全活詔嘉奬焉郡伍伯誘民詐許以事禱主子舎者而隂受其賕公察知之盡捕繫獄表請御史推鞫獄成杖伍伯及同姦竄海島事雖驗白宰相與文正公有隙者言於上猶下遷公通判大明府時文節張公鎮魏薦公才中御史遂召爲殿中侍御史尋擢侍御史時淮浙蝗旱民飢殍流􅄆命公爲安撫所至賑廩囷蓄家罷諸役作舉良吏以牧養之合肥有陂可漑田久爲右姓專其利公決導以濟下户得以衣食者不可勝數未還上嘉其稱職除開封判官}
  - {type: page-break, offset: 5014, content: '', id: KR4d0034_WYG_016-3b, image: WYG1092/WYG1092-0120b.png}
  - {type: variant, offset: 5016, length: 1, content: 行, WYG: 日奏事畢趨出至屏外復召賜緋衣銀魚嵗餘除河北轉運使詔畱監定故丞相向公諸子分財丁崖州當國勢懾天下私所親諭公欲市向公長安華嚴别墅又諷其子從之公至其家面戒曰土田衣食之源不可棄故餘財盡均而華嚴獨存不以分由是忤崖州意及赴河朔舊二使並移他道公先獨領其任㑹章聖御樓宴駕今上踐祚賞賫重沓常計不能支朝廷深以爲慮督責甚急又定州帥曹煒威名素著得士卒心爲崖州所惡以大將軍貶萊州朝議憂其拒命逗撓爲變詔公馳驛收其兵柄崖州又欲緣此伺公隙以危法中之公從容優裕處之甚閒無不得其宜者覃恩改司封員外郎乂加直史館天聖二年移知青州才數月召爲侍御史知雜事賜金紫三年判大理寺遷工部郎中治臺雜㡬二年時中丞闕久不補連鞫詔獄郡將有託所親納金于宰相文穆公又因牙吏審之公知執吏以聞詔付臺鞫焉郡將遂誣吏誤以聞所親之語達文穆欲滅其迹公平心窮治果郡將以疾懼廢求外徙金未達而言漏文穆大怨之時都下有告急變者中貴人夜開禁門捕卒百餘人付臺公}
  - {type: page-break, offset: 5016, content: '', id: KR4d0034_WYG_016-4a, image: WYG1092/WYG1092-0120c.png}
