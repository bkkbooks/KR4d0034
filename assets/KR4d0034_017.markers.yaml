  - {type: variant, offset: 5658, length: 0, content: '', WYG: 萬將以爲資送執政者諭意欲公往謁之公終不往遂不得公謫官靈仙至窘匱乃舉族蔬食數年未嘗食肉每得俸入輙厚享賔客數日而竭公年三十入爲尚書郎每授命則惕然驚悸曰吾先君夀六十有八終于省郎吾今亦已老矣性純孝毎道先君事則霶然泣下公弟素自淮南按察使被召帥涇原命下之日公通夕不寐召諸子謂曰吾弟母老且病子至幼詎可以禦戎窮邉乎吾無親憂而汝輩長矣明日遂上言乞留素而自代願死節以報國弗從又命其子規曰朝廷不免吾弟之}
