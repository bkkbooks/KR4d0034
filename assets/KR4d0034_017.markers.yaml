  - {type: variant, offset: 5659, length: 1, content: 實, WYG: 吾所憂也汝其往侍無怠焉公特愛於規其以多病未嘗使離膝下又幼弟端力學勤官十餘年未出州縣公當遷官拜章乞端召試遂賜進士出身公智識閎逺善譚名理雖庸人之善終身不忘爲郡先化導不尚威罰主漕荆南也嘗權府事有媪訴其婦之見逐無所歸公召而詰之婦曰舅始亡姑即嫁去既窮而歸奉養甚謹後取去金又嫁今復窮而歸故不敢舎公曰姑雖不良獨不念若夫邪又謂其婦之子曰爾母薄于姑爾獨不念父邪遂切責媪諭以改行又取家人之衣以衣之與婦孫廩粟使以歸養於是皆感泣而去孝愛如初大凡民有犯法詆欺者雖末事必竟過誤雖大必貸之或良頑共罪頑雖辭勝若真可信者公必直指其隠善惡立決衆伏其明所至横猾屏迹畏公之明不敢犯外臺非其人多暴斂于民者公悉不承命與之講辨或不決聞之于朝毎多見從故數爲惡吏摘事以中公亦浩然不校然不能害公治家嚴明有法度以道義訓子弟初文正爲中書舎人家至窶與昆弟貸息錢約違期以所乗之馬償之公閱書得劵召子弟而示之曰此吾家清風爾曹當毋忘此事又得顔魯公爲尚書時乞米于李大夫墨帖親摹于}
