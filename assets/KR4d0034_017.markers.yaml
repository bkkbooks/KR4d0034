  - {type: variant, offset: 5555, length: 0, content: '', WYG: 久嵗遣人至京師貨易出入民間如家公深以爲不便請下詔推恩置館舎遣使接引官爲監其貨易若優待逺人者實羈防之也事旣下㑹公參知政事不久且出不果行唃􅣳囉與元昊交兵􅣳囉來獻捷朝廷議加節制公獨以謂􅣳囉之族俱籓臣縱不能諭令解仇又以獻㨗加賞是激元昊之怒而爲中國生患固執不可遂寢陜西轉運使奏乞遷土兵内郡以省轉餉公不可曰此兵世爲邉人樂自爲戰一旦徙去鄉里必怨不可用亦罷其議景祐四年授參知政事占謝之日召坐嘉歎西府之效尋遷户部侍郎是嵗定襄地大震星文見變公方在告力疾入對爲上陳災異之端且虞夷狄内侮宜下詔求直言消復之術上欣然從之有頃罷知政事改吏部侍郎知應天府三年以西羌擾邉復授北備授公資政殿學士知成德軍入境在道中使齎手詔問攻守方畧公畫備禦之策甚詳延州陷沒邉城中人誣以降敵朝廷發兵監其家公求對力辨戰俗甚苦無降屈之狀上意釋然去守兵或謂鎮定不當北衝改知澶州屬以控扼之計數以疾請便郡移亳州郡本多盜公始至諸邑日有剽刼民情騷然公爲設策刺取乃府大吏爲之囊槖以故益滋不敗宻發卒盡捕得百餘人尸于市郡中震肅訖公去不復有盜轉運使嵗斂民力不堪遣牙校齎輕貨即地所有市之民不知有賦而軍須以給慶厯元年遷尚書左丞拜章固讓有詔襃荅}
