  - {type: variant, offset: 5653, length: 0, content: '', WYG: 大理評事次􅛻太常寺太祝女六人長適端明殿學士給事中李淑次早卒次適大理評事蘇舜賔次適太常寺太祝王整二人幼未嫁孫男十三人長宗彦大理寺丞次宗道太常寺奉禮郎次宗古次宗哲宗師宗弼將作監主簿餘幼未名孫女十二人長適光禄寺丞李夀朋餘未嫁曾孫女一人舜欽于公族爲仍親故稔公風烈敢録其實迹納于太常謹狀朝奉大夫尚書度支郎中允天章閣待制知陜州軍府事平晉縣開國男食邑三百户上䕶軍賜紫金魚袋王公行狀曾祖某左拾遺累贈太師尚書令魯國公祖某兵部侍郎累贈太師尚書令晉國公父某兵部郎中贈户部尚書公諱質字子野其先占籍大名由晉公貴始居京師自幼好學不羣兒嬉太尉文正公即公之伯父祥符中爲大丞相䕃公爲太常寺奉禮郎稍長向學益篤一日以所著獻于文正文正覽之驚嗟親爲作詩以美之改大理丞尚未冠又以文聞奏御召試學士院考入進士第劉尚書筠在翰林與諸公交薦遂充館閣校勘轉中丞太常博士遷集賢校理改祠部員外郎時年始}
