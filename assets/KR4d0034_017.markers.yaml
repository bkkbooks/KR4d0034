  - {type: variant, offset: 5655, length: 1, content: 字, WYG: 五風韻髙灑喜辨論所交皆當世豪英未始敢以貴勢少年遇之俄丁尚書憂旅于南都與諸弟飯脫粟茹蔬至性孝睦旅無間言服除同判蘇州郡守黄公宗且前輩有才望任氣自雄長以公齒未壯初未甚禮公事之至恪雖被譏嘲絶不讎應官事有未便者必乗間以白之不聼則力爲辨其枉直必于行而後已黄公初忿恨終感悟而加禮焉還朝賜緋魚改度支同判尚書刑部又判吏部南曹改司封知蔡州蔡之圭田頗瘠民嵗輸租甚苦之公至郡悉蠲除不取俗舊祠吳元濟公曰安有逆醜而廟食者乎長吏不能革舊俗之濫民何觀焉於是毁元濟之像以狄梁公李太尉有功于唐而德及蔡人遂建二公之祠號雙廟率羣吏往拜祀之而轉祠部郎中召爲開封府推官公兄雍時亦爲三司判官公曰是皆劇職吾兄弟並命妨寒士之進遂懇辭之出知夀州郡素號多訟而邑所部送囚雖重辟往往偽竄其名以上公摘其濫姦擒邑吏坐鞭而黥之自是肅然又多豪姓五等之籍久廢毎斂率無科吏以賂爲輕重公將定其籍不闗吏手吏竊相笑語曰是烏能周知吾民之產乎公一日㑹官吏坐府中自爲檄召隠豪而諭之皆稽首歎服餘之登耗纖悉無差一府震駭號爲神明又移廬州巨盜張雄殺其黨并所貲而遁邏者獲之公以法誅之牘下大理法官引近詔盜殺其徒者原之雄不當死吏當坐罪公曰法所以戢姦而㫁實原情今雄本罪當死而又殺人以取貲既非自首而捕得之盜無悛惡之狀法無破姦之術疏三上不省公曰吾不勝法吏矣又上疏自劾願不坐羣吏又不聽願自爲首乃聽遂左降監舒州靈仙觀他吏得減一等公襟上髙爽有仙風道格日與二三逸人放意於江山之間笑歌盤嬉灑然得方外之趣夙有羸病藥劑未嘗去手既至舒數月而舊疾頗愈因採古今練形攝生之術著寳元總録一百巻逾年今資政殿學士給事中韓公𤦺知審刑院上言前法頗濫因申明舊制請盜殺其徒者不首不原朝廷從之如公往者之議又今資政殿大學士鄭公戩翰林侍讀學士葉公清臣皆薦公才可大用而以非辜久黜遂起知泰州嵗中改度支郎中入朝授荆湖北路轉運使賜三品服自西方用武領是職者務先掊下以爲事事爭以羨餘爲名貢于朝以助軍需其實誅于民也朝廷往往擢之好官號爲稱職公深嫉之常賦之外無一毫横斂逺民賴焉富公弼爲資政殿學士常帶史館脩撰平生未嘗識公面而素慕之薦公有賢業而恬不喜進願召還代脩撰從之又命同判吏部流内銓俄拜天章閣待制是時上方登用俊良剗革夙弊公雍容侍從之列以清風峻節爲一時所畏或以公少所獻納爲議者君子謂使子野于朝雖恬然不言士大夫仰其風采亦當競亷讓而忘鄙俗之心焉爲吏部未一嵗號爲稱職嘗謂同列曰官局之設若權衡然險者妄自髙下非器之弊也苟遇物持平輕重判然于中矣故貴豪者毋偉請孤逺者毋廢勞老吏手束脅息不敢揺動其法州縣巧黠吏有以賄得舉者於格當遷公亷知之遂爲宻啓使使從中罷者甚衆俄出知陜州才一年寢疾慶厯五年終于官舎享年四十有五累階爲朝奉大夫勲爲上護軍爵平晉縣開國男公少以師禮事楊文公億文公深器之嘗以書譽于劉翰林曰子野英妙不􅃷文干進當世佳士也又以公詩句手寫扇上衆爭玩之由是名稱益大公剛峭介潔而性仁厚果于義㫁論者謂有烈祖之風操靜退不喜進趨或與公同在館閣者皆去爲達官當塗教誘公終不爲屈以是益不見用公亦自適無所憾朝議嗟之公有女當嫁遂求廬州例得裝錢}
