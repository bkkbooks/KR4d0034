  - {type: variant, offset: 5550, length: 0, content: '', WYG: 改元拜諌議大夫居益部}
  - {type: variant, offset: 5552, length: 0, content: '', WYG: 值大旱薦飢力爲拯濟他郡流冗者歸焉故事每嵗官糶粟六萬石與貧民公爲先常期增數以出之以故民不太乏久旱水涸苗枯且死公詢舊老得}
  - {type: page-break, offset: 5552, content: '', id: KR4d0034_WYG_016-6a, image: WYG1092/WYG1092-0121c.png}
  - {type: variant, offset: 5553, length: 1, content: 月, WYG: 升江口決以溉田訖今利之又移上供物於他州不飢處將代郡人遮轉運使言願上白留公三年手詔敦奬既而有㫖召公參知政事宰相以益部逺方不可亟還須代歸以拜事緩遂力援他人補之故公命中格及召還止授御史中丞充理檢使入對建言維㡬二州地接羌夷秦隴商賈交易蕃部驅馬至永康軍場以賣盡熟山川􅊂險道路所出宜徙場境上以絶其覘覦兩川之意又奏疏言時務者五事上深加納之景祐中楊尚二人以罪斥出掖庭公上章引古事爲戒杜其復入及依唐故事奏置御史裏行四貟以廣言職馬季良在貶賂執政者求致仕遂遣家人撾登聞鼓命始下言事者以謂致仕所以優賢季良既以罪廢安可得詔共刻登聞吏不當通其奏公以謂事行不行在丞相府登聞吏無罪何所劾納敕不奉行上韙之議者以爲有體不踰年授工部侍郎同知樞宻院事公以天下久承平武備不戒願與二府各列武臣才仕將率者試用之又乞纂兵法以授邉將上遂自集神武祕略頒焉嶺南蠻寇邉先時必自中發兵多不及事至是公奏置廣南東西路鈐轄司委以便宜專用土兵鎮守北兵不徙瘴癘之地而有以應猝夏賊稱籓}
