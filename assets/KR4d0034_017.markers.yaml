  - {type: variant, offset: 5018, length: 0, content: '', WYG: 訊情得悉釋其縛中貴人即付詔督促自以捕反者有功及文致獨坐告者誣罪誅之三司更茶法嵗課比不登公承詔劾前與議者由丞相而下輕重有法用法持平不爲權貴傾撓二宫稱歎時議難之俄兼知審官院四年授龍圗閣待制充北朝國信使副介匪人妄傳明肅皇太后㫖于虜中寺人虜主問曰太后即有㫖大使宜知公應曰本朝每遣使必謂之曰繼好之事傳示後世兩朝之臣毋相阻猜此乃平時戒使者語非欲達于北朝也虜主大喜即以語附公謝上時皆美公能以副介失辭更爲恩好之意還掌貢舉又編近制敕公曉析條義衆皆咨而後定仍乞以新書頒天下許所在條陳其不安者更之既而出知亳州未㡬上以審刑案牘之緐召公領之公建言乞促日限以降㫁敇及刑名當奏稟者}
