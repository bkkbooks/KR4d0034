  - {type: variant, offset: 5030, length: 346, content: 文集卷第九原作十四一葉十八行較校二葉三行羣郡十四行叙緒十五行旣上有亦字十六行覯備在任十八行丁下二十行庾庚扇倉三葉六行困固七行可下有以字十一行痌癎十五行碩果之之於果二十行閑開四葉四行不犯無犯喪下旁注平字十五行人八二十行銜延五葉十五行命民十七行汨淚十九行地六葉三行三四在任五行病痛六行不可迨過十二行呼吁七葉一行頓下有失字二行寢下無失字三行君若五行二十六矣三月十六也舊校云上云七日而逝自十三至十六纔四日耳恐宜從鈔本但尙衍脫一年字十九行自下有將字八葉四行在任九行數百兵百十二行轉騎幕漠十三行帥師貳二十七行建進十九行束東僥徼貰殊貫珠九葉五行効效八行書下有五字在任十九行郞部十葉五行耀擢會委八行於下有平字十一行中申十五行記託十九行頽閒十一葉二行史吏三行聞道道辟敗賤四行著於十二葉五行邑邑悒悒六行寘繫七行比, WYG: 知益州留侍郊祀}
