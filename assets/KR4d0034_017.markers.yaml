  - {type: variant, offset: 5661, length: 5, content: 三葉六行吁, WYG: 遍遺親友公喜士好施凡遇人危急平生仇惡皆一視若已未嘗問家有無唯聚書數千巻古琴數張出處未嘗舎去公既卒陜人哀哭塞道朝野無賢愚皆相弔出涕家貧柩不能還先塋朋舊在要官者皆力之遂得還京師嘗語人曰吾思世故無所爲忽忽欲熟醉以死幸矣屢以後事屬家人且笑曰人世一吷耳安}
