  - {type: indent, offset: 0, content: 　, id: KR4d0034_krp_017-bkkind1}
  - {type: variant, offset: 0, length: 3, content: 蘇學士, WYG: 部銓補令久不治始廷擇京師官宰之公旣至刮剗宿滯去人所不便安者又爲興起其利未數月一邑驩然從之郡將皇甫選爲世吏師聞公治狀歎伏不能已又貽之書而稱美之自是他邑訴訟之不決者必屬公平處匈奴南牧章聖皇帝狩於澶淵太尉文正王公奏筦機事牘章緐委一出公手景德二年外臺表公永城之勞改大理寺丞通判陳州尋移通判鄆州未㡬信國棄養䕶喪歸上都服除通判許州再移於陳時郡界河決害民計其補塞費鉅萬公馳至其地}
  - {type: page-break, offset: 0, content: '', id: KR4d0034_WYG_016-2a, image: WYG1092/WYG1092-0119c.png}
  - {type: variant, offset: 4, length: 32, content: 校語蘇學士集行世惟商邱宋氏刊本舊本罕見今假海甯陳氏藏何義門校本勘, WYG: 瀕河丁壯就伐薪藁親爲裁畫一物不取於民而堤復完堅又去郡數十里有羣寇大浮艦而下將刧旁邑公亷知之自部十餘卒夜掩至命匽河絶上流舉火伐鼓以疑之賊棄舟逃走盡束以付吏譚者伏}
