  - {type: variant, offset: 1442, length: 980, content: 爲句甬無疑七行册詩按三行夢斷風一䬃下從文鑑及時刻宋詩鈔作別爲一篇題爲別鄰㡬余賦高山詩以見意後見舊校云鈔本如此九葉三行仆自八行暴淫十二行看首蘇學士文集卷第三二葉五行冀州綠髮三十一冀州二字從舊校增六行面腼珂河健倢九行凄棲三葉一行皆香四行塵纖澈特徹將六行經徑十行淸精苦若十一行俛勉四葉四行君書愜感五行無花字淸下有尊字九行惚忽八行將疑鏘五葉一行義意十七行臆膈所四十八行烈烈不開之者二十行器亦於于川水六葉一行平疇玉璧二行嗟吁七行羽質據踞瑟琴何氏書和子履雍家園詩後云此詩亦載歐公外集據歐集則荆公四家詩選中亦有之剝落歐集作解剝君之作知君十七行震下有起字二十行緬緬鏗鑑七葉一行凛廩三行賦賊九行聚竪十行迸落十七行緬緜八葉一行衝冲三行治住五行可下有休字辦辨十行㾕音審瘁二十行思事九葉六行已樂九行滯濡滯八入十行晨夕苦蘇學士文集卷第四一葉三行然於放然十一行庖厨十二行炙釂十四行見跋已跋己見十六行關閔十七行身世十九行益抑二葉一行於與二行琚裾四行辜孤十二行蹤縱三葉一行惚怳忽貺具俱四行但耽寢耽晝寢五行鶱騫十四行孺立四葉六行力辯力辨八行森生十行寇官椎追十五行揶邪五葉二行含舍十四行波浪十五行經徑十七行漫熳十八行平半十九行子予二十行歎難六葉四行石古晃見六行嶔嵌飣餖七行飣餖餖飣八行未又九行聞文十行南向十九行瞰看二十行楞稜七葉三行子履杖履四行彼被九行擿撾十七行碧壁十八行相疑明八葉十二行眷卷十三行予子九葉一行礔霹靂五行必心十一行澄不流不流流紛紛澄澄十五行精淸十六行餖飣十葉六行葉木汙汚八行忘妄十一行嘉佳蘇學士文集卷第五一葉十四行虎步步虎二葉二行褊偏八行精積十四行北此十八行入噤慘人襟滲三字何云以意改三葉一行月石硯屏歌石月屏圖四行得成五行且或兩二七行常蛾嫦娥下同十行吸向十一行爍爛四葉三行至主仗伏十五行兼問十八行蘿羅五葉二行木水七行危瓦㩻十四行柅楃十七行鴈燕十八行緣原十九行歌六葉三行王玉下同九行郛郭十三行疾病病疾十四行已以十七行立世資勤誦讀圓曲勿自悅時命不復說何云圓曲以取世資所謂草竊也鑑本亦誤十八行紲恰旅拾稆十九行漿飲渴竭七葉三行長中六行貪食七行才足足才九行危瓦􅑶㩻甈十二行大天十四行騐念十六行汙汚十七行暇敢二十行輊幹八葉一行媼嫗七行當賞十二行尫羌十四行惰隨十五行麾揮伏復十七行令今九葉一行蜜密四行牢勞七行情清十四行映隱十七行鵶啞十八行閔閒送梁子熙聯句大榮大辱能生死人叔才二物不並以撓厥眞子美, WYG: 兄}
