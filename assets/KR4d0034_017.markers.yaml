  - {type: variant, offset: 5563, length: 4, content: 行雄弘十, WYG: 以某年某月葬于許州長杜縣嘉禾鄉之先塋公累階自將仕郎至正奉大夫勲自騎都尉至上柱國爵自伯至公疏封之寵三加焉公性方嚴質重雖笑言不妄毎朝廷有大議論所持堅正形於顔色惟義所在不恤權忌一發于言衆莫敢奪雖燕居未嘗見其惰容治家處身一以素約起微中至貴始終無少異者訓厲諸子蓁然皆成立遇物以誠不爲外飾視人困厄必欲力之葬外親貧無竁者二家䕃孤藐不自振者四人使以祿奉其先祀公先夫人蒲氏追封安定郡太君也再取王氏進封太原郡太君相國文正公之女男}
