  - {type: variant, offset: 2503, length: 695, content: 謝夙蘊歸逢故辛子美雌火在丑刮鑿遯屯叔才駕風鞭霆以脫凡鱗子美山谷䟦云景祐元年仲春子美于蜀綾紙上楷寫字極端勁可愛叔才蓋才翁舊字此篇不見于家集右聯句一首並跋義門從山谷集錄補餓寒原作寒餓光艶原作光燄腹憤原作腸憤鞭霆原作鞭鱗均依宋槧豫章黃先生集校改蘇學士文集卷第六一葉十一行闕殿十二行觚孤三葉七行刑型八行算等四葉七行揶邪九行寞莫十一行塘堂十二行古今今古五葉六行緌纓七行電殿九行尊爭十七行陳原作塵何云疑作陳六葉二行去去去七葉二行貶謫三行寬慰四行袞原作裒何依范集附錄改七行來原作束何依范集附錄改十二行相向十六行界事十八行亭當八葉六行駛駃七行帷斃蘇學士文集卷第七一葉十行刮括二葉五行寞莫七行鑑鏡三葉二行唐塘四行後浚十一行燒曉四葉十二行蕭瀟十三行無原本缺三字五葉三行烹魚十四行淮懷十五行晴陰隂睛七葉十行棲栖十四行世色何又云後村詩話作色十七行諳諧八葉二行去字下何云吳郡志作住蘇學士文集卷第八一葉二行首字下有次韻二字三行角閣十一行眄盼盼盻十三行穽盡箴任十五行揶邪十九行日自二葉一行雨中聞鶯何云歐公嘗與聖兪泥滑滑及自作畫眉鳥詩俱書之殆此篇耳九行甚盛十二行居猿十九行蛇蚘二十行如入三葉四行空還八行翟敵四葉三行是吳郡志作時六行微隂五葉十一行見是十四行山上六葉五行槪慨七行罹離七葉一行寞莫分憤流風迴行從吳郡六行志改迴則志作八行荆去志作十四行鎭淸明八葉十七行引飲十九行光平獨酌出晁補之所記乃其眞蹟一酌澆腸俗慮奔鷃微鵾大豈堪論焚靈當日能知此肯入滄江作旅魂蘇學士文集卷第十一原作第九一葉五行刀刃殭彊七行焉哉八行行無狀行無狀疑有訛十六行於以十七行憂幽二葉六行小善善小二十行意慈三葉四行襞檗八行殞命捐軀捐命九行掇輟之以此書印本稍後, WYG: ''}
