  - {type: variant, offset: 5769, length: 941, content: 此行衍舊本止十五卷也一葉八行眞貢十行繇縣十一行朝師十五行處下有焉字二葉二行迸送四行祠祀八行裒取十八行名明三葉三行封下有府字十行瑋煒十七行文穆公知四葉三行有脫字四行有罰有法十六行祠祀十九行大太五葉五行茂幾七行嘉加八行二下有美字十九行徙抄本作當是涉字六葉三行謂下無嘶字四行之上無囉字藩籓八行効效十四行臣城十五行格俗十六行眞貢二十行斂下有郡字七葉四行社杜十二行公先公前十四行水上有任字十五行縝績八葉三行充尤十七行宗旦宗且九葉六行而祀之祀之而十一行重輕輕重十二行關問十三行面而十葉十一行于予須需十四行慕下有向字十九行倍俗十一葉二行倖偉四行無上使字十行謂有謂之十一行數教十二葉十六行摭撫十三葉五行共皆十三行蘇學士文集卷第十六一行衍蘇子美集十五卷歐陽文忠公爲之首序子美在寶元慶曆間有大名其文章瑰奇豪邁自成一家不幸淪落早世故生平所著纔止于此而近時亦少見之元之因俾鏤板于三衢又得尙書汪公聖錫所藏豫章先生詩爲子美作也惜其未大傳幷附之左方若祭文墓志已見于文忠集中此不復載乾道辛卯六月已巳吳興施元之書困學紀聞載子美作大相國寺藏太宗御書飛白寶殿頌吳郡志四十九卷有邂逅劉公尤于平望走筆敍意五言古詩一首此頌周益公有跋按歐公序出于公之所集錄者十五卷今必紛更舊次爲十六卷是亦好妄而巳徐節孝愛愛歌序云子美有詩今亦不見集中晁氏讀書記載李文公集前有蘇舜欽序云唐之文章稱韓柳翺文雖不逮韓而理過于柳今頌與此序無之蓋亦非完書云康熙巳卯夏六月焯識巳上二則在目錄後康熙庚寅良月之望借叢書堂鈔本校過焯記卷九後於此見子美之不負所知范公之取人爲不苟同世徒以一觴一詠稱之者淺也然如選擇宗子一事當范公作參政恐尙未可行之會且此宗社非常大計亦當白之宰相同詞以請豈參政獨爲建白始試以空言博天下虛譽哉卷十後戊寅九月初五日閱第九卷至末卷畢子美之才高於歐公得年不永未見其止爾家貧不能購宋元文集此集非徐氏重刊何由寓目此事實默受商邱中丞之賜矣焯識周益公稱衢本滄浪集蓋嘗刻于三衢南渡後本也計世當有之顧脩遠云子美有答歐陽公書載梁溪漫志中集不載歐公詩集中有扶溝知縣周職方錄示白鶴宮蘇才翁子美贈黃道士詩集不載司馬温公傳家集亦載此詩見蠶尾集載渠家有宋槧滄浪集正衢本也商丘與新城交最深而不知假以是正蓋近人讀書但備數而不求善本雖倦圃竹垞猶不免況北方之學者乎又記巳上在卷末, WYG: ''}
