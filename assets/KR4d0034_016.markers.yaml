  - {type: variant, offset: 51, length: 4954, content: 師聞公治狀歎伏不能已又貽之書而稱美之自是他邑訴訟之不決者必屬公平處匈奴南牧章聖皇帝狩於澶淵太尉文正王公奏筦機事牘章緐委一出公手景德二年外臺表公永城之勞改大理寺丞通判陳州尋移通判鄆州未幾信國棄養護喪歸上都服除通判許州再移於陳時郡界河決害民計其補塞費鉅萬公馳至其地集瀕河丁壯就伐薪藁親爲裁畫一物不取於民而堤復完堅又去郡數十里有羣寇大浮艦而下將劫㫄邑公廉知之自部十餘卒夜掩至命匽河絶上流舉火伐鼓以疑之賊棄舟送走盡束以付吏譚者伏其謀勇轉運使鄭文寳聞之走檄㑹公于許既至歎曰急欲識公之面顔耳秩滿上祀汾陰恩遷殿中丞因進文十卷上覧之加賞欲召試文正公避嫌例除逺郡守特召見改太常博士知洋州郡有公校李甲者豪於里中誣其兄之子爲他姓賂里嫗之貌類者使奪以爲己子又醉其嫂以嫁之盡取其貲嫂流離􅍓訴於州及提刑轉運使毎置對甲輒賂吏常掠使自誣服杖而去者前後十餘年公至復出訴察嫗色冤甚遂索舊牘視之皆未嘗引乳醫爲證一日盡召其黨出乳醫示之甲遂伏辜母子復故八年遷屯田員外郎知相州時河北蝗旱轉運使固歳計覆不以實聞諸郡畏莫敢言公力抗章請蠲賦役州民賴以全活詔嘉獎焉郡伍伯誘民詐許以事禱主子舍者而陰受其賕公察知之盡捕繫獄表請御史推鞫獄成杖伍伯及同姦竄海島事雖驗白宰相與文正公有隙者言於上猶下遷公通判大眀府時文節張公鎭魏薦公才中御史遂召爲殿中侍御史尋擢侍御史時淮浙蝗旱民飢殍流散命公爲安撫所至賑廩囷蓄家罷諸役作舉良吏以牧養之合肥有陂可漑田久爲右姓專其利公決導以濟下户得以衣食者不可勝數未還上嘉其稱職除開封判官一日奏事畢趨出至屏外復召賜緋衣銀魚歳餘除河北轉運使詔留監定故丞相向公諸子分財丁崖州當國勢懾天下私所親諭公欲市向公長安華嚴別墅又諷其子從之公至其家面戒曰土田衣食之源不可棄故餘財盡均而華嚴獨存不以分由是忤崖州意及赴河朔舊二使並移他道公先獨領其任㑹章聖御樓宴駕今上踐祚賞賫重沓常計不能支朝廷深以爲慮督責甚急又定州帥曹煒威名素著得士卒心爲崖州所惡以大將軍貶萊州朝議憂其拒命逗撓爲變詔公馳驛收其兵柄崖州又欲縁此伺公隙以危法中之公從容優𥙿處之甚閒無不得其宜者覃恩改司封員外郞又加直史館天聖二年移知青州才數月召爲侍御史知雜事賜金紫三年判大理寺遷工部郎中治臺雜幾二年時中丞闕久不補連鞫詔獄郡將有託所親納金于宰相文穆公又因牙吏審之公知執吏以聞詔付臺鞫焉郡將遂誣吏誤以聞所親之語達文穆欲滅其迹公平心窮治果郡將以疾懼廢求外徙金未達而言漏文穆大怨之時都下有吿急變者中貴人夜開禁門捕卒百餘人付臺公一訊情得悉釋其縛中貴人即付詔督促自以捕反者有功及文致獨坐吿者誣罪誅之三司更茶法歳課比不登公承詔劾前與議者由丞相而下輕重有法用法持平不爲權貴傾撓二宮稱歎時議難之俄兼知審官院四年授龍圖閣待制充北朝國信使副介匪人妄傳眀肅皇太后㫖于虜中寺人虜主問曰太后即有㫖大使宐知公應曰本朝毎遣使必謂之曰繼好之事傳示後世兩朝之臣毋相阻猜此乃平時戒使者語非欲達于北朝也虜主大喜即以語附公謝上時皆美公能以副介失辭更爲恩好之意還掌貢舉又編近制敕公曉析條義衆皆咨而後定仍乞以新書頒天下許所在條陳其不安者更之既而出知亳州未幾上以審刑案牘之緐召公領之公建言乞促日限以降㫁敕及刑名當奏稟者亦乞裁定中典頒下自是無滯獄七年改兵部郎中同判吏部流内銓八年授樞密直學士知益州留侍郊祀乃行眀道改元拜諫議大夫居益部二年值大旱薦飢力爲拯濟他郡流冗者歸焉故事毎歳官糶粟六萬石與貧民公爲先常期増數以出之以故民不太乏久旱水涸苗枯且死公詢舊老得九升江口決以溉田訖今利之又移上供物於他州不飢處將代郡人遮轉運使言願上白留公三年手詔敦獎既而有㫖召公參知政事宰相以益部逺方不可亟還須代歸以拜事緩遂力援他人補之故公命中格及召還止授御史中丞充理檢使入對建言維幾二州地接羌􅊂秦隴商賈交易蕃部驅馬至永康軍場以賣盡熟山川􅊂險道路所出宜徙場境上以絶其覘覦兩川之意又奏疏言時務者五事上深加納之景祐中楊尚二人以罪斥出掖庭公上章引古事爲戒杜其復入及依唐故事奏置御史裏行四員以廣言職馬季良在貶賂執政者求致仕遂遣家人撾登聞鼓命始下言事者以謂致政所以優賢季良既以罪廢安可得詔公劾登聞吏不當通其奏公以謂事行不行在丞相府登聞吏無罪何所劾納敕不奉行上韙之議者以爲有體不踰年授工部侍郎同知樞宻院事公以天下久承平武備不戒願與二府各列武臣才任將率者試用之又乞纂兵法以授邊將上遂自集神武祕略頒焉嶺南蠻寇邊先時必自中發兵多不及事至是公奏置廣南東西路鈐轄司委以便宜專用土兵鎭守北兵不徙瘴癘之地而有以應猝夏賊稱籓日久歳遣人至京師貨易出入民間如家公深以爲不便請下詔推恩置館舍遣使接引官爲監其貨易若優待逺人者實羈防之也事旣下㑹公參知政事不久且出不果行唃􅣳囉與元昊交兵􅣳囉來獻捷朝廷議加節制公獨以謂􅣳囉之族俱籓臣縱不能諭令解仇又以獻捷加賞是激元昊之怒而爲中國生患固執不可遂寢陜西轉運使奏乞遷土兵内郡以省轉餉公不可曰此兵世爲邊人樂自爲戰一旦從去郷里必怨不可用亦罷其議景祐四年授參知政事占謝之日召坐嘉歎西府之效尋遷户部侍郎是歳定襄地大震星文見變公方在吿力疾入對爲上陳災異之端且虞夷狄内侮宐下詔求直言消復之術上欣然從之有頃罷知政事改吏部侍郞知應天府三年以西羌擾邊復授北備授公資政殿學士知成德軍入境在道中使齎手詔問攻守方略公畫備禦之策甚詳延州陷沒邊城中人誣以降敵朝廷彂兵監其家公求對力辨戰俗甚苦無降屈之狀上意釋然去守兵或謂貢定不當北衝改知澶州屬以控扼之計數以疾請便郡移亳州郡本多盜公始至諸邑日有剽劫民情騷然公爲設策刺取乃府大吏爲之囊槖以故益滋不敗宻彂卒盡捕得百餘人尸于市郡中震肅訖公去不復有盜轉運使歳斂民力不堪遣牙校齎䡖貨即地所有市之民不知有賦而軍須以給慶曆元年遷尚書左丞拜章固讓有詔襃荅眀年請老授太子少傅致仕四年八月十五日薨于京師之里第享年七十三以某年某月葬于許州長杜縣嘉禾郷之先塋公累階自將仕郎至正奉大夫勲自騎都尉至上柱國爵自伯至公疏封之寵三加焉公性方嚴質重雖笑言不妄毎朝廷有大議論所持堅正形於顔色惟義所在不恤權忌一發于言衆莫敢奪雖燕居未嘗見其惰容治家處身一以素約起微中至貴始終無少異者訓厲諸子蓁然皆成立遇物以誠不爲外飾視人困厄必欲力之葬外親貧無竁者二家蔭孤藐不自振者四人使以禄奉其先祀公先夫人蒲氏追封安定郡太君也再娶王氏進封太原郡太君相國文正公之女男八人長曰綱前水部員外郎次綜太常博士集賢校理次絳太子中允次繹次維次績太常寺太祝次緯大理評事次緬太常寺太祝女六人長適端眀殿學士給事中李淑次早卒次適大理評事蘇舜賔次適太常寺太祝王整二人幼未嫁孫男十三人長宗彦大理寺丞次宗道太常寺奉禮郎次宗古次宗哲宗師宗弼將作監主簿餘幼未名孫女十二人長適光禄寺丞李夀朋餘未嫁曽孫女一人舜欽于公族爲仍親故稔公風烈敢錄其實迹納于太常謹狀朝奉大夫尚書度支郎中允天章閣待制知陜州軍府事平晉縣開國男食邑三百户上護軍賜𬗋金魚袋王公行狀曽祖某左拾遺累贈太師尚書令魯國公祖某兵部侍郎累贈太師尚書令晉國公父某兵部郎中贈户部尚書公諱質字子野其先占籍大名由晉公貴始居京師自幼好學不羣兒嬉太尉文正公即公之伯父祥符中爲大丞相蔭公爲太常寺奉禮郞稍長向學益篤一日以所著獻于文正文正覧之驚嗟親爲作詩以美之改大理丞尚未冠又以文聞奏御召試學士院考入進士第劉尚書筠在翰林與諸公交薦遂充館閣校勘轉中丞太常博士遷集賢校理改祠部員外郎時年始二十五風韻髙灑喜辨論所交皆當世豪英未始敢以貴勢少年遇之俄丁尚書憂旅于南都與諸弟飯脫粟茹蔬至性孝睦族無間言服除同判蘇州郡守黄公宗且前輩有才望任氣自雄長以公齒未壯初未甚禮公事之至恪雖被譏嘲絶不讎應官事有未便者必乗間以白之不聽則力爲辨其枉直必于行而後已黄公初忿恨終感悟而加禮焉還朝賜緋魚改度支同判尚書刑部又判吏部南曹改司封知蔡州蔡之圭田頗瘠民歳輸租甚苦之公至郡悉蠲除不取俗舊祠吳元濟公曰安有逆醜而廟食者乎長吏不能革舊俗之濫民何觀焉於是毁元濟之像以狄梁公李太尉有功于唐而德及蔡人遂建二公之祠號雙廟率羣吏往拜祀之而轉祠部郎中召爲開封府推官公兄雍時亦爲三司判官公曰是皆劇職吾兄弟並命妨寒士之進遂懇辭之出知夀州郡素號多訟而邑所部送囚雖重辟往往僞竄其名以上公摘其濫姦擒邑吏坐鞭而黥之自是肅然又多豪姓五等之籍久廢每斂率無科吏以賂爲輕重公將定其籍不問吏手吏竊相笑語曰是烏能周知吾民之産乎公一日㑹官吏坐府中自爲檄召隱豪而諭之皆稽首歎服餘之登耗纖悉無差一府震駭號爲神眀又移廬州巨盜張雄殺其黨并所貲而遁邏者獲之公以法誅之牘下大理法官引近詔盜殺其徒者原之雄不當死吏當坐罪公曰法所以戢姦而斷實原情今雄本罪當死而又殺人以取貲旣非自首而捕得之盜無悛惡之狀法無破姦之術疏三上不省公曰吾不勝法吏矣又上疏自劾願不坐羣吏又不聽碩自爲首乃聽遂左降監舒州靈仙觀他吏得減一等公襟上髙爽有仙風道格日與二三逸人放意於江山之間笑歌盤嬉灑然得方外之趣夙有羸病藥劑未嘗去手既至舒數月而舊疾頗愈因採古今練形攝生之術著寶元總録一百卷逾年今資政殿學士給事中韓公琦知審刑院上言前法頗濫因申眀舊制請盜殺其徒者不首不原朝廷從之如公往者之議又今資政殿大學士鄭公戩翰林侍讀學士葉公清臣皆薦公才可大用而以非辜久黜遂起知泰州歳中改度支郎中入朝授荆湖北路轉運使賜三品服自西方用武領是職者務先掊下以爲事事爭以羨餘爲名貢予朝以助軍需其實誅于民也朝廷往往擢之好官號爲稱職公深嫉之常賦之外無一毫横斂逺民賴焉冨公弼爲資政殿學士常帶史館脩撰平生未嘗識公面而素慕之薦公有賢業而恬不喜進願召還代脩撰從之又命同判吏部流内銓俄拜天章閣待制是時上方登用俊良剗革夙弊公雍容侍從之列以清風峻節爲一時所畏或以公少所獻納爲議者君子謂使子野于朝雖恬然不言士大夫仰其風采亦當競廉讓而忘鄙俗之心焉爲吏部未一歳號爲稱職甞謂同列曰官局之設若權衡然險者妄自髙下非器之弊也苟遇物持平䡖重判然于中矣故貴豪者毋偉請孤逺者毋廢勞老吏手束脅息不敢揺動其法州縣巧黠吏有以賄得舉者於格當遷公㢘知之遂爲密啓使使從中罷者甚衆俄出知陜州才一年寢疾慶曆五年終于官舍享年四十有五累階爲朝奉大夫勲爲上護軍爵平晉縣開國男公少以師禮事楊文公億文公深器之嘗以書譽于劉翰林曰子野英妙不衒文干進當世佳士也又以公詩句手冩扇上衆爭玩之由是名稱益大公剛峭介潔而性仁厚果于義㫁論者謂之烈祖之風操靜退不喜進趨或與公同在館閣者皆去爲達官當塗敎誘公終不爲屈以是益不見用公亦自適無所憾朝議嗟之公有女當嫁遂求廬州例得裝錢二十萬將以爲資送執政者諭意欲公往謁之公終不往遂不得公謫官靈仙至窘匱乃舉族蔬食數年未嘗食肉每得俸入輒厚享賔客數日而竭公年三十八爲尚書郞毎授命則惕然驚悸曰吾先君夀六十有八終于省郞吾今亦已老矣性純孝每道先君事則霶然泣下公弟素自淮南按察使被召帥涇原命下之日公通夕不寐召諸子謂曰吾弟母老且病子至幼詎可以禦戎窮邊乎吾無親憂而汝輩長矣眀日遂上言乞留素而自代願死節以報國弗從又命其子規曰朝廷不免吾弟之行吾所憂也汝其往侍無怠焉公特愛於規其以多病未嘗使離䣛下又幼弟端力學勤官十餘年未出州縣公當遷官拜章乞端召試遂賜進士出身公智識閎逺善譚名理雖庸人之善終身不忘爲郡先化導不尚威罰主漕荆南也嘗榷府事有媪訴其婦之見逐無所歸公召而詰之婦曰舅始亡姑即嫁去既窮而歸奉養甚謹後取之金又嫁今復窮而歸故不敢舍公曰姑雖不良獨不念若夫邪又謂其婦之子曰爾毋薄于姑爾獨不念父邪遂切責媪諭以改行又取家人之衣以衣之與婦孫廩粟使以歸養於是皆感泣而去孝愛如初大凡民有犯法詆欺者雖末事必竟過誤雖大必貸之或良頑共罪頑雖辭勝若眞可信者公必直指其隱善惡立決衆伏其眀所至横猾屏迹畏公之眀不敢犯外臺非其人多暴斂于民者公悉不承命與之講辨或不決聞之于朝毎多見從故數爲惡吏撫事以中公亦浩然不校然不能害公治家嚴眀有法度以道義訓子弟初文正爲中書舍人家至窶與昆弟貸息錢約違期以所乗之馬償之公閱書得劵召子弟而示之曰此吾家清風爾曹當毋忘此事又得顔魯公爲尚書時乞米于李大夫墨帖親摹于石遍遺親友公喜士好施凡遇人危急平生仇惡皆一視若已未嘗問家有無唯聚書數千卷古琴數張出處未嘗舍去公既卒陜人哀哭塞道朝野無賢愚皆相弔出涕家貧柩不能還先塋朋舊在要官者皆力之遂得還京師嘗語人曰吾思世故無所爲忽忽欲熟醉以死幸矣屢以後事屬家人且笑曰人世一吷耳安可久期哉公之生也以七月二十六日亦以是日而亡娶周氏封襃信縣君故禮部侍郎起之女男三人曰毖將作監主簿曰規前眀州奉化縣主簿曰復將作監主簿女二人長適太常寺太祝范, WYG: ''}
