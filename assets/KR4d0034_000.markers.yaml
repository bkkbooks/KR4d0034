  - {type: variant, offset: 0, length: 4179, content: 蘇子美文集序予宦遊呉門得宋蘇子美滄浪亭遺址於荒煙蔓艸中稍稍爲之起廢墜葺垣屋數年以來亭之樹石若歳益而古嘉花名卉若月益而娟妍而呉之人雅好事春秋佳日遊屐麕集遂擅郡中名勝我輩馮弔古蹟履其地則思其人思其人則必慨想其生平求其文章詞翰以髣髴其萬一蓋尚友之道然耳子美故有集若干卷久傳於世惜板已毁世之獲見其集者蓋少予幸得是本而卒業焉子美詩磊落自喜文章雄健負奇氣如其爲人以之妃眺儷張殆無媿色顧晁張繼起於古學大盛之日而子美獨崛興於舉世不爲之時挽楊劉之頽波導歐蘇之前驅其才識尤有過人者學者論宋初古文往往以子美與穆伯長並稱其實伯長不及也吳門徐子七來年少嗜古偕兄念修重爲開雕將欲與予之滄浪小志並廣其傳予喜亟取是集付之書成請予序予曰昔歐陽公言之矣歐陽之序蘇氏文集曰子美齒少於予而予學古文反在其後又曰斯文金玉也弃擲埋沒糞土不能銷蝕其見遺於一時必有收而寳之於後世者嗚呼詎不有待於今日與康熙戊寅八月之朔滄浪寓公宋犖序大中丞宋公命復挍子美集讀之數日而乃恍然於公之重脩滄浪亭之意也始亭之脩也不知者以爲政有餘暇僅以供遊覧也其知者以爲愛慕其才不忍使其遺蹟之泯没無傳也而公之意則大不然夫子美抱經世之學懷忠君之心觀其所爲詩文及論時事劄子雖未見諸實事然其議論侃侃慷慨切直皆有關于社稷生民之故能言人之所不敢言不可以區區文人才士目之矣使當日天子宰相知其賢而大用之殆無難澤被一世名垂於後而惜乎其以酒食之過至遷謫以死徒使後之人憑弔遺蹤爲之拊膺歎恨于九原之不可復作不大可惜哉公重其學問心術而惜其見棄于當時之君相又憫其亭之廢而不存是以修之也夫子美慶曆人也自慶曆迄今垂六七百年已無有過而問之者儻更歷幾百年其詩文必散失而無傳而所謂滄浪故址者亦且銷滅於榛莽之中而不可考將幷不知子美爲何如人豈復有新其亭而珍其遺集者乎雖其生平行事略備宋史而所載之文僅二三首苟不睹全集卒無由論其世知其人則世亦不過與文苑諸人同類稱之而止矣此公既脩其亭而又命復挍其集之意也昔歐陽永叔序其集云凡人之情忽近而貴遠子美屈於今世猶若此其伸於後世宐如何也其猶此志歟復既承公命因與兄念修次第挍之而付諸劂氏康熙戊寅皐月下澣震澤徐惇復書于白蕐書屋蘇學士文集原序予友蘇子美之亡後四年始得其平生文章遺稾於太子太傅杜公之家而集錄之以爲十五卷子美杜氏壻也遂以其集歸之而吿於公曰斯文金玉也棄擲埋沒糞土不能銷蝕其見遺於一時必有收而寳之於後世者雖其埋沒而未出其精氣光怪已能常自發見而物亦不能揜也故方其擯折摧挫流離窮厄之時文章巳自行於天下雖其怨家仇人及嘗能出力而擠之死者至其文章則不能少毁而揜蔽之也凡人之情忽近而貴遠子美屈於今世猶若此其伸於後世宜如何也公其可無恨予嘗考前世文章政理之盛衰而怪唐太宗致治幾乎三王之盛而文章不能革五代之餘習後百有餘年韓李之徒出然後元和之文始復于古唐衰兵亂又百餘年而聖宋興天下一定晏然無事又幾百年而古文始盛於今自古治時少而亂時多幸時治矣文章或不能純粹或遲久而不相及何其難之若是歟豈非難得其人歟苟一有其人又幸而及出於治世世其可不爲之貴重而愛惜之歟嗟吾子美以一酒食之過至廢爲民而流落以死此其可以歎息流涕而爲當世仁人君子之職位宜與國家樂育賢才者惜也子美之齒少於予而予學古文反在其後天聖之間予舉進士於有司見時學者務以言語聲偶摘裂號爲時文以相誇尚而子美獨與其兄才翁及穆叅軍伯長作爲古歌詩雜文時人頗共非笑之而子美不顧也其後天子患時文之弊下詔書諷勉學者以近古由是其風漸息而學者稍趨於古焉獨子美爲於舉世不爲之時其始終自守不牽世俗趨舍可謂特立之士也子美官至大理評事集賢挍理而廢後爲湖州長史以卒享年四十有一其狀貌奇偉望之昂然而即之温温久而愈可愛慕其才雖髙而人亦不甚嫉忌其擊而去之者意不在子美也賴天子聦眀仁聖凡當時所指名而排斥二三大臣而不欲以子美爲根而累之者皆蒙保全今並列於榮寵雖與子美同時飲酒得罪之人多一時之豪俊亦被收采進顯於朝廷而子美獨不幸死矣豈非其命也悲夫廬陵歐陽脩序宋史本傳蘇舜欽字子美參知政事易簡之孫父耆有才名嘗爲工部郎中直集賢院舜欽少慷慨有大志狀貌傀偉當天聖中學者爲文多病偶對獨舜欽與河南穆脩好爲古文歌詩一時豪俊多從之游初以父任補太廟齋郎調滎陽縣尉玉清昭應宮災舜欽年二十一詣登聞鼓上火疏文載集中不録㑹有詔戒越職言事又上書文載集中不録尋舉進士改光禄寺主簿知長垣縣遷大理評事監在京店宅務康定中河東地震舜欽詣匭通疏極陳災變異常時政得失纚纚千餘言無所回避文載集中不録羣小爲之側目范仲淹薦其才召試爲集賢校理監進奏院舜欽娶宰相杜衍女衍時與范仲淹冨弼在政府多引用一時聞人欲更張庶事御史中丞王拱辰等不便其所爲㑹進奏院祀神舜欽與右班殿直劉㢲輒用鬻故紙公錢召妓樂間多㑹賔客拱辰㢘得之諷其屬魚周詢等劾奏因欲揺動衍事下開封府劾治於是舜欽與㢲俱坐自盜除名同時㑹者皆知名士因縁得罪逐出四方者十餘人世以爲過薄而拱辰等方自喜曰吾一舉網盡矣舜欽既放廢寓于吳中其友人韓維責以世居京師而去離都下隔絶親交舜欽以書報之文載集中不録二年得湖州長史卒舜欽數上書論朝廷事在蘇州買水石作滄浪亭益讀書時發憤懣於歌詩其體豪放往往驚人善草書每酣酒落筆爭爲人所傳及謫死世尤惜之妻杜氏有賢行兄舜元字才翁爲人精悍任氣節爲歌詩亦豪健尤善草書官至尚書度支員外郎三司度支判官蘇學士文集緫目商丘漫堂先生宋犖鍳定卷第一古詩二十四首感興三首慶州敗及第後與同年宴李丞相宅昇陽殿故址大霧藍田悟眞寺作興慶池長安春日效東野太行道對酒夜中蜀士己卯冬大寒有感獵狐篇難易言二首大小言了語不了語二首舟中感懷寄館中諸君送李生卷第二古詩二十首楊子江觀風浪哭曼卿吾聞送安素處士髙文恱贈釋祕演城南感懷呈永叔吳越大旱中秋夜吳江亭上對月懷前宰及寄君謨蔡大越州雲門寺和韓三謁歐陽九之作城南歸值大風雪出京後舟中有作寄文韓二兄弟永叔歐陽九和叔杜二寄冨彦國大風檢書雜興呂公初示古詩一編因以短歌荅之老萊子往王順山值暴雨雷霆卷第三古詩二十首依韻和勝之暑飲荅宋太祝見贈送李冀州詩和鄰幾登緐臺塔依韻和伯鎭中秋見月九日遇雨之作夜聞秋聲感而成咏同鄰幾作和聖俞庭菊荅梅聖俞見贈舟至崔橋士人張生抱琴攜酒見訪頴川留別王公輔維舟野步呈子履滯舟過濠梁别王原叔和子履雍家園尹子漸哀辭天平山奉酬公素學士見招之作遷居遣悶苦調卷第四古詩十八首若神棲心堂郡侯訪予于滄浪亭因而髙㑹翌日以一章謝之送關永言赴彭門寄題豐樂亭夏熱晝寢感詠哭師魯和永叔琅邪山庶子泉陽冰石篆詩荅章傅遊山寒夜送施秀才送韓三子華還家觀放金山寺九月五日夜出盤門泊于湖間偶成宻㑹坐上書呈黄尉送張統尉嘉禾秋夜寄題周源家亭卷第五古詩十四首黃雍於西安修水之側起佚老亭以奉親送黄莘還家和菱磎石歌頂破二山詩永叔石月屏圗演化琴德素髙昔嘗供奉先帝聞予所藏寳琴求而揮弄不忍去因爲作歌以冩其意云寄王幾道同年丙子仲冬紫閣寺聮句水輪聮句薦福塔聮句悲二子聮句地動聮句瓦亭聮句淮上喜雨聮句卷第六律詩三十四首和石曼卿眀河詠師黯以彭甘五子爲寄因懷四眀園中此果甚多偶成長句以爲謝遊洛中内送杜密學赴幷州送家靜及第後赴官清水串夷靜勝堂夏日呈王尉黎生下第還郷春日晚晴代人上申公祝夀有客遊南内九龍宮送陳進士遊江南和馬承之古廟和解生中秋月宿太平宮獨遊輞川過下馬陵覧含元殿基因想昔時朝㑹之盛且感其興廢之故望秦陵留題樊川李長官莊宿終南山下百塔院宿華嚴寺與友生㑹話送王楊庭著作宰巫山晚意春暮初晴自御宿川之華嚴寺次韻和師黯寄王耿端公聞京尹范希文謫鄱陽尹十二師魯以黨人貶郢中歐陽九永叔移書責諌官不論救而謫夷陵令因成此詩以寄且慰其遠邁也暑景夏中夏意和淮上遇便風先公之愛馬以病寄他廏今死矣重過句章郡卷第七律詩三十九首晚出潤州東門無錫惠山寺過蘇州吳江亭秀州通越門外八九里臨水多佳木茂樹以便風不得停舟一賞愴然爲詩秀州城外九里有竹樹小橋予十八年前與友人解晦叔飲别于此今過之景物依然而解生已亡悲歎不足復成小詩天章道中望太湖大禹寺杭州㢲亭宿錢塘安濟亭觀潮使風松江長橋未眀觀漁新開湖晚霽九日汴中淮中晚泊犢頭韓忠憲公挽辭二首詔獄中懷藍田髙先生湘公院冬夕有懷離京後作荅和叔春日舟行荅子履舟行有感淮亭小飲淮中風浪夀陽閑望有感阻風野步有感呈子履過泗水和丹陽公素學士晚望見懷送子履題花山寺壁春睡覧照病起秋懷秋曉聞鶴唳一聲中秋松江新橋對月和柳令之作病中得杜丞相見寄詩感而有作滄浪懷貫之卷第八律詩四十三首和彦猷晚宴眀月樓二首依韻和王景章見寄荅仲儀見寄雨中聞鶯滄浪亭秋雨中秋三夕對月懷月來求聽琴詩因作六韻送黃通秋宿虎丘寺數夕執中以詩見貺因次元韻滕子京哀辭寒食招和叔遊園春日懷舊遊春日感懷夢歸獨步遊滄浪亭初晴遊滄浪亭滄浪觀魚遊招隠道中揚州城南延賔亭呉江岸晚泊龜山滄浪靜吟丹陽子髙得逸少瘞鶴銘于焦山之下及梁唐諸賢四石刻共作一亭以寳墨名之集賢伯鎭爲之作記逺來求詩因作長句以寄遊霅上何山霅上冬夕偶書寒夜十六韻荅子履見寄獨遊曹氏園館因寄伯玉小酌送人還呉江道中作題廣喜法師堂詩僧則暉求詩關都官孤山四照閣清軒某爲世所棄困居於蘇平生交遊過門不顧長安侍讀葉丈不以秦吳之逺髙下之隔閔此窮悴特貺以詩然韻險句奇不可攀續仰酬髙誼強抉蕪音暑中閒詠寄題趙叔平嘉樹亭西軒垂釣偶作夜聞笮酒有聲因而成咏秋夕懐南中故人卷第九書七首上三司副使段公書上范希文書應制科上省使葉道卿書上京兆杜公書上孫冲諫議書上孔待制書上集賢文相書卷第十書六首荅韓持國書荅馬永書荅范資政書荅李銳書荅杜公書上范公參政書幷諮目七事諮目一諮目二諮目三諮目四諮目五諮目六諮目七卷第十一上書疏狀九首乞納諫書詣匭疏火疏論西事狀乞發兵用銀牌狀論宣借宅事乞用劉石予弟投匭疏論五事卷十二啓表十二首啓事上奉寧軍陳侍郎上杜侍郎啓上執政啓薦王景仁啓京兆求罷表杜公讓官表杜公謝官表杜公求退第一表第二表第三表第四表第五表卷第十三記序雜文十六首粹隱堂記東京寳相禪院新建大悲殿記幷州新修永濟橋記滄浪亭記蘇州洞庭山水月禪院記處州照水堂記浩然堂記漣水軍新牐記送外弟王