front:
  text: 蘇學士文集卷第六
  hash: sha256:a2cc0d8abddee40806819dfb430b9fef7640ee320ea0632276ebca8d168501dc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_006-1a}
body:
  text: 和石曼卿眀河詠八月銀河好天髙夜自眀樓臺通迥意風露得餘清幾爲浮雲亂都宜小雨晴離人強回首耿耿邈無情師黯以彭甘五子爲寄因懷四眀園中此果甚多偶成長句以爲謝憶向江東太守園猗猗甘樹蔽前軒風摇玉蕊霏微落霜發金衣委墜緐枕畔冷香通醉夢齒邊餘味滌吟魂天彭路遠無因得猶賴君心記舊恩遊洛中内洛陽宮殿鬱嵯峨千古榮華逐逝波別殿秋髙風淅瀝後園春老樹婆娑露凝碧瓦寒光滿日轉孤稜暖豔多早晚金輿此遊幸鳳樓前後看山河送杜密學赴幷州維帝私眀哲遥遥世可論風流擅南國文采續髙門才美趨賢路名雄出帝閽雍容初入幕烜赫已開蕃黠吏腹心潰疲民襦袴温讞刑曽攬轡按俗亦飛軒倚注宸襟切淹回物論喧朔區官益峻憲府望彌尊除弊朝之急于時孰肯言議髙心不撓補外衆爲冤西雍新恩重中臺故事存政行殊有體化洽宻無痕尺詔來丹扆雙符換太原具裝眀晚野大斾卷朝暾惠愛留關輔風威入塞垣印車行急召想望慰元元送家靜及第後赴官清水幾年塵土客京華一日春乗犯斗査夢好夜歸全蜀道眼眀朝宴上林花白頭佐邑非爲晚藍綬還鄉亦可誇况有雄圗看悟主莫傷孤宦向天涯串􅊂區區黠虜敢狂呼遣使峨冠謁上都輒出封章辭國命妄傳聲勢困軍須閉之塞漠爲良策啖以民膏是失圗淳俗易摇無自撓每聞流議一長吁靜勝堂夏日呈王尉虚堂吏事稀吟臥欲忘機窓靜蜂迷出簾輕燕誤飛煩心傾晚簟倦體快風衣更想霜雲外同君看翠微黎生下第還鄉人云之子賢文采出巴川失意聲名在還家歳月遷離懷春色裏歸路夕陽邊無廢靑箱學窮愁古亦然春日晚晴人言春雨好更好晚來晴樹色通簾翠烟姿著物眀得泥初燕喜避弋去鴻輕誰見危欄外斜陽盡眼平代人上申公祝夀維神祚炎曆發藴含靈嶷爾爲人瑞居然出相庭舜門登夙望韋氏繼先經積學方開隩當官已發硎純誠貫白日闊步上青冥才力回元氣胸懷納四溟八荒歸冨夀萬象染丹靑懇牘辭魁柄開蕃宻帝扃碧旌油重潤蒼佩玉眀熒輿望知難轉王心幾不寧西羌動妖孽秦塞困羶腥羽奏飛關路兜烽照濁涇裴公辭激烈袁相涕飄零天爲移文象人思奉典型歡謠塞歸路召節下宸廷勝等劇破竹威聲如走霆折衝千里定指畫衆心醒大議虗懷納訏謨前席聽玉關收舊地廟鼎續新銘復聳巖巖石増輝兩兩星川源流盛美岳鎭敵長齡有客慙才薄區區詠德馨有客有客論時事相看各慘然蠻􅊂殺郡將蝗蝻食民田蕭瑟心空遠徘徊志自憐何人同國恥餘憤落樽前遊南内九龍宮昔帝龍驤後因池大此宮簫笳叠終日旌仗展無窮繪塑神靈集飛潜爪角雄陰軒常隱霧暗堵亦含風巨盜來移國天王遽避戎蒼黄狩巴蜀倐忽陷河潼閣殿回看逺塵氛久見蒙歸來故基在不與往時同叠瓦煙間碧新蕖露下紅波春蕩初月沙晚發悲鴻世變今無復人愁杳莫終樹穿瑶甃裂碑碎玉樓空九曲皆遺石諸王秖斷蓬興亡何足問一一夕陽中送陳進士游江南昔也衣裾已化塵驅車今去􅍱驚津淮天蒼茫二字並仄背殘臘江路逶迤二字並平逢舊春時有飄梅應得句苦無蒸酒可霑巾歸來莫戀溪山勝楓鬼邪􅟧解笑人和馬承之古廟廟貌空山裏垣頽入逕斜尚應名竹素不復祭牲豭木暗鴞呼鬼庭荒雀啅虵有靈從寂莫愼勿學凶邪和解生中秋月不爲人間意居然節物清銀堂通夜白金餠隔林眀醉客尊前倒棲烏露下驚悲歡今古事寂寂􅑁荒城宿太平宮驅車長道久塵勞一宿清宮醒骨毛古檜有風天自籟石壇多露鶴爭噑星河耿耿秋還迥樓觀澄澄夜更髙吟對疎鐘俗機盡已疑身世屬仙曹獨遊輞川行穿翠靄中絶澗落疎鐘數里踏亂石一川環碧峰暗林麋養角當路虎留蹤隐逸何曽見孤吟對古松過下馬陵下馬陵頭草色春我來懷古一霑巾陵邊又有纍纍冢應是當年取酒人覽含元殿基因想昔時朝㑹之盛且感其興廢之故在昔朝元日千門動地來方隅正無事輔相復多才仗下簮纓肅天中繖扇開皇威瞻斗極曙色辨崔嵬赤案波光卷鳴梢􅢜尾回熊羆驅禁衞雨露覆蘭臺横賜傾中帑窮奢役九垓只知營國用不畏屈民財翠輦還移幸旻天未悔災羣心爭困獸回首變寒灰曽以安無慮翻令世所哀行人看碧瓦獨鳥下蒼苔雖念陵爲谷遥知禍有胎靑編遺迹在此地亦悠哉望秦陵雄心雖蓋世竟亦棄羣臣役重傾天下時危啓聖人石麟空舉首銀海罷流春隴闕今無復應深行路塵留題樊川李長官莊杜曲東邊風物幽我來繫馬獨淹留門前翠影山無數竹下寒聲水亂流酒壓新塵常得醉花開畨次不知秋主公堆案縈官事早晚歸來今白頭宿終南山下百塔院驅馬山前訪古蹤僧居蕭灑隔塵籠遶庭石鼈谷間水入户鳴䲭堆上風無限老松秋色裏數聲疎鐸月眀中村雞坐聽三號徹去前朝氣味同宿華嚴寺與友生㑹話危構岧嶤出太虗坐看斜日􅑁平蕪白煙覆地澄江闊皎月當天尺壁孤疎磬悲吟來竹閣靑燈寂莫照吟軀老僧怪我何爲者說盡興亡涕淚俱送王楊庭著作宰巫山蘭臺舊漫郎爲邑上瞿唐地僻風煙古公餘日景長江聲通白帝山勢入靑羌落筆多佳句時應滿錦囊晚意晚色微茫至前山次第昬羸牛歸徑遠宿鳥傍檐翻盤喜黄粱熟杯餘白酒渾田家雖澹薄猶得離塵喧春暮初晴自御宿川之華嚴寺春暮曽無屬物心野行聊得據鞍吟路經廢苑情通古水遶蒼山意共深殘日花間浮暖豔斷雲樓外卷輕陰騷人自昔傷鶗鴂休苦風前送好音次韻和師黯寄王耿端公嫉惡曽收柱後冠淹淪今未復榮班靑雲失路初心遠白雪盈簮壯志閑廏馬尚嘶驄奮迅篋衣猶曝繡斕斑風流縣尹多才思時寄篇章與解顔聞京尹范希文謫鄱陽尹十二師魯以黨人貶郢中歐陽九永叔移書責諌官不論救而謫夷陵令因成此詩以寄且慰其遠邁也朝野蔚多士裒然良可羞伊人秉直節許國有深謀大議摇巖石危言犯采旒蒼黄出京府憔悴謫南州引黨俄嗟尹移書遽竄歐安慙言得罪要避曲如鉤郢路㡬束馬荆川還泝舟傷心衆山集舉目大江流逺動家公念師魯父作牧于東川深貽夀母憂永叔有母垂老横身罹禍難當路積仇讎衞上寧無術亢宗非所優吾君思正士莫賦畔牢愁暑景溽暑倦幽齋縱横書亂堆風多應秀麥雨密不黄梅乳燕並頭語紅葵向背開吟餘晴月上凉思入尊罍夏中院僻簾深晝景虗輕風時見動竿烏池中綠滿魚留子庭下陰多燕引雛雨後看兒爭墜果天晴同客曝殘書幽棲未免牽塵事身世相忘在酒壺夏意別院深深夏簟清石榴開遍透簾眀樹陰滿地日當午夢覺流鶯時一聲和淮上遇便風浩蕩清淮天共流長風萬里送歸舟應愁晚泊喧卑地吹入滄溟始自由先公之愛馬以病寄他廏今死矣先君所乗馬其色白於銀磊落龍之種權奇世共珍獨嘶如想望久步見精神方目照代夜拳毛刷渭津先公在河東陜右皆乗此馬鬛寒如擁浪蹄駃不驚塵潦倒巳伏櫪蒼黄仍借人俄傳弊斃信無復錦蒙親倚棹思神駿蕭然淚灑巾重過句章郡曽隨使斾此東歸日日登臨到落暉疇昔侍行猶緫角如今重過合霑衣窺魚翠碧忘形坐趁伴蜻蜓照影飛風物依然皆自得歳華飄忽賞心違蘇學士文集卷第六
