body:
  text: 黃雍於西安修水之側起佚老亭以奉親修水崩騰落雲端傾入羣山自縈轉山囘水抱三百里邑號西安俯千磵四時夾磵花濛濛數步行人不相見但聞千珂萬馬橫陣來石激驚湍自相濺忽然瀰漫爲平川遠近人家壓清淺其間有亭號供老山水之間爲勝􅃟黃氏有子樂其親締葺之勤由富善蓋憂髙年厭家事力營此地欲自遣親意雖知風物嘉豈若有子常在眼君胡飄飄事遠遊手龜面黎兩足趼故郷不到已踰年又非跼蹐牽仕宦何如輕舟早還家日對白雲奉遊宴送黃莘還家東風搖江波碧草日夜芳藹藹春物歸遊子思故郷黃生士林華志業收精剛步虎南山隈氣立衆獸旁不步受羈轡但欲插翅翔顧亦念所親歸心劇風檣想當舎檝初喜氣充門牆晨昏奉顏色以時薦豆觴雖享萬鍾禄此樂不可償予家白日下偶來戀滄浪因君江上別撩我歸興長和菱磎石歌滁州信至詫雙石云初得自菱水濱長篇稱夸語險絶欲使來者不復言畫圖突兀亦頗怪張之屋壁驚心魂麒麟才生頭角異混沌雖死竅鑿存琅邪之郡偏且僻得石固可駭衆觀予嘗飛帆入震澤窮探異境登􅀛黿太湖二山名最出怪石居民百户石爲業日夜采琢山不貧山前森列戰白浪猶似萬百鐵馬羣雨昏浪打嵗月古千株萬穴僵復奔自嗟才力本衰弱安敢抵敵爲之文況兹出產極易致郷俗見慣不甚尊彼以至少合貴重胡爲久棄如􅀮淪偶逢積識見􅅄㧞衆目今乃稱奇珍百人擁持大車載城市觀走風濤翻立於新亭面幽谷共爲澡刷泥沙痕凉泉下照嘉樹陰翠影澄澹畱煙雲褒以篇章繪縑素積嵗汩沒一旦伸茍非髙賢獨賞激終古棄臥於窮津世人愛憎逐興廢使我吟歎傷精神頂破二山詩此邑有頂山下潛子母虯其子去爲雨以救郷人憂前擘穹峰開化出百丈湫後因號破山致祠獻庶羞嵗來省其母風雹六月秋煙雲騰蹋去不復經月畱邑民賴其靈雖旱嵗有收因成兩佛宇幽䆳號勝遊磵泉走鸞車松桂擁石樓夜堂人襟滲陰壁風颼飀近年返暴雨頗亦傷田疇老農務祈禱梵唄日不休常爲釋徒利乃作生民讎嗚呼二虯者其說何悠悠永叔石月屏圖日月行上天下照萬物根向之生榮背則死故爲萬物生死門東西兩交征晝夜不蹔停胡爲虢山石畱此皎月痕常存桂樹散疎陰有若圖畫成永叔成之不得曉作歌使我窮其原􅂉疑月入此石中分此二曜三處眀或云蟾兔好溪山逃遁出月不可關浮波穴石恣所樂嫦娥􅀌坐初不覺玉杵夜無聲無物求􅉒藥嫦娥驚推輪下天自尋捉繞地掀江蹋山岳二物驚奔不復見畱此玉輪之迹在青壁風雨不可剥此說亦詭異予知未精􅃀物有無情自相感不間幽微與髙邈老蚌向月月降胎海犀望星星入角彤霞爛石變靈砂白虹貫巖生美璞此乃西山石久爲月照著嵗久光不滅遂有團團月寒輝籠籠出輕霧坐對不復嗟殘缺蝦蟇縱汝惡觜吻可能食此清光沒玉川子若在見必喜不徹此雖􅀮石中時有靈光發土怪山鬼不敢近照之僵仆肝腦裂有如君上眀下燭萬類無遁形光􅃩百世無虧盈演化琴德素髙昔嘗供奉先帝聞予所藏寶琴求而揮弄不忍去因爲作歌以寫其意云雙墖老師古突兀索我瑤琴一揮拂風吹仙籟下虚空滿坐沈沈竦毛骨按抑不知聲在指指自不知心所起節奏可盡韻可收時於疎澹之中寄深意意深味薄我獨知陶然直到羲皇世曲終瞑目師不言忽言昔常奉主尊祥符天子政多暇詔求絶藝傳中閽􅂵宸伏退霜日紅隨鞭入對蓬萊宮平戎一弄沃舜聦貂璫壁立亦動容􅂵蘭之袍出禁府聲華一日千門通今來老病臥澤國賞音不遇前事空一雙玉鶴天上飛人間但見枯死桐幸逢寶器愜心手因聲感舊涕灑胷顧我踟躕不忍去將行更欲畱悲風寄王幾道同年新安道中物色佳山昏雲澹晚雨斜眼看好景嬾下馬心隨流水先還家步頭浴鳬暖出沒石側老松寒交加懷君覽古意萬狀獨轉澗口吟幽花丙子仲冬􅂵閣寺聮句白石太古水才翁蒼厓六月氷昏眀咫尺變子美身世逗畱増橋與飛霞亂才翁人間獨鳥升風泉冷相搏子美樓閣暮逾澄反覆青冥上才翁躋攀赤日稜唄音充別壑子美墖影弔寒藤仙掌挂太一才翁佛壇依古層巖喧聞鬭虎子美臺靜下飢鷹晴檻通年雨才翁濃羅四面􅊻日光平午見子美霧氣半天蒸潭碧寒疑裂才翁鐘清遠自凝陽陂冬聚筍子美陰壁夏垂繒有客饒佳思才翁髙吟出逺凭雄心翻表裏子美遠目著軒騰岑寂來清夜才翁沈冥接定僧宿猿深更杳子美落水靜相仍松竹髙無奈才翁煙嵐翠不勝甘酸收脫實子美坳隩布清塍北野才沈著南天更勃興恣睢超一氣才翁黤黕起孤鵬並澗寒堪摘看雲重欲崩行中向背失子美呼處下髙應庭樹巢金爵樵兒弄玉繩斷香浮缺月才翁古像守昏燈乳管眀相照莎䫇緑自矜深疑嘯神物子美㩻欲敵殽陵俯仰􅀌心撓囘翔百感登畫圖風動壁詩句涕霑膺先公有留題在澄心閣嵗月看流矢才翁心腸劇斷絙追攀初有象悲憤遂相乗故賞知無遁遺靈若此憑依然忍回首子美愁絶下崚嶒才翁水輪聮句十六韻痛矣眞源喪紛紜物􅁚來子美水輪今若此世事亦宜哉才翁上下車交輻周旋斗轉魁子美咸淵日微墮仙窟月初開才翁旁楃從爲用垂絙重亦囘枘多初不曉機密暗相該子美圃外滄浪洩庭間霹􅆮摧玉飛千仞表纓挂九泉隈才翁翻覆殊難定牽連巧自媒建瓴今比速抱甕此相哀子美平眡曽無覺深窺遂可猜團團釋子壁軋軋燕王臺才翁解見陶埏運寧觀將轂推造端原有發汲用始知材子美本異道家意定遭怡士咍轉圓非雅具器有深災才翁持滿􅁯前監相傾自下催流風無以復視此一裵囘子美薦福墖聮句踴甓皇都壯才翁盤基􅂵宙雄山河供遠目玉緯薝户發髙風梯險三休上子美輪開一氣中門當谷子午才翁影落陌西東韻鐸翻天籟玉緯危觚駐夕紅側聆悲下俗子美仰面識長空絶若神擠至才翁深疑壑暗通人寰如蟻垤玉緯身世甚秋蓬歎息與亾地子美沈吟製作工清思抱眀月狂欲把飛鴻去矣登臨興才翁巍乎造化功涼襟當爽塏幽意入鴻濛頭角峰如揖玉緯丹青樹不同城郭囘迤邐閣􅢜失穹隆可使孤懷放子美胡爲萬恨終何當得壯士提取出塵籠才翁悲二子聮句穆脩伯長凌孟陽伯華有客自遠方來以二子說穆子病疾初家事巨細缺鄰人苦其求才翁醫師久以決案杯小大空布被旁午裂餘喘尚能鼓子美老憤知已結目淒望羊泓髭斷反蝟茁憂酸繫餘生才翁噑嘑畱永訣語妻後日計書策未可徹敎子勤誦讀子美時命不復說吾屬何流離衆人方草竊凌子久道路才翁十口著羈紲拾稆重江間正值大饑節旣無裹飯交子美疾走繼粗糲又無執飲人及時沃枯竭惜哉損天命才翁痛焉在親絰帝胡生爾身世復稱其傑胷伏氣萬丈子美腸貯怨百折艱難汩風波顦顇􅑁霜雪久僕勤龍鍾才翁弱女癡蹩躠文隨寒餓空道與煙燄滅魂􅀆竟何歸子美去矣不得別中府豈無財莫濟醫藥切太倉豈無粟才翁莫解腹腸􅀬天子聖在上海内清欲澈伊人胡不官子美旣死安得活朝青與暮􅂵神喜天不軋昂車與怒馬才翁門滿道不絶之子苟閒厠斯民廼食餮髙亢世弗親子美方嚴鬼所掣敢言足才珍寧免否來齧思潛淚輒抽才翁慘舊面成耋舉目此牢落側身今鄙媟箴言耳空虚子美險論口㩻甈作詩吿石梁聊以慰寒骨才翁地動聮句天聖己巳十月二十二日作大荒孟冬月叔才末旬髙舂時日腹昏盲倀子美風口鳴嗚咿萬靈困陰戚叔才百植嗟陽衰濃寒有勝氣子美天凍無敗期六指忽搖拽叔才羣蹠初奔馳丸銅落蟾吻子美始異張渾儀列宿犯天紀叔才預念漢志辭民甍函鼓舞子美禁堞強崩離坐駭市聲死叔才立佈人足踦坦途重車僨子美急傳壯馬攲陵阜動撫手叔才礫塊當揚箕停汚有亂浪子美僵木無靜枝衆喙不敢息叔才沓嶂驚欲飛踊墖撼鐸碎子美安流蕩舟疲倒壺喪午漏叔才顚巢駭眠鴟居人眩眸子子美行客勞髑兒南北頓儵忽叔才西東播戎夷四鎭一毛重子美百川寸涔微斗藪不知大叔才軒幹主者誰共工豈復怒子美富嫗安得爲寧無折軸患叔才頓易崩山悲衆蟄不安土子美羣毛難麗皮驚者去靡所叔才仆或如見擠轟雷下檐瓦子美決玉傾倉粢雙顚太室吻叔才四躍宸庭螭萬宇變旋室子美百城如轉機念此大菑患叔才必由政瑕疵勝社勇厥氣子美孤陽病其威傳是下乗上叔才亦曰尊屈卑夫惟至靜者子美猶不可􅍖之況乃易動物叔才何以能自持髙者恐顚墜子美下者賞鎭綏天戒豈得慢叔才肉食宜自思變省孽可息子美損降禍可違願進小臣語叔才兼爲丹扆規偉哉聦眀主子美勿遺地動詩叔才瓦亭聮句陰霜策策風呼虓羌賊膽開凶燄豪子美赤膠脆折乳馬健漢野秋穟黃雲髙才翁驅先老羌伏壯黠裹以山壑􅀑莫招子美烽臺屹屹百丈起但報平安搖桔槹才翁喜聞羸師入吾地主將踊躍士隨驕子美神鋒前揮擁勝勢橫陣立敵俱奔逃才翁不知餌牽落檻穽一揮發復如驚飇子美重圍八面鳥難度相顧無路帷青霄才翁地形窄束甲刺骨眥裂不復能相鏖子美棄兵衮衮今不殺部曲易主無纖嚻才翁慟哭皇天未厭禍空同無色勁氣消子美狂童得志賤物命隴上盤馬爲嬉遨才翁蒼皇林間健兒婦翦紙瀝酒呼嗸嗸子美將軍疾趨占葬地年年載柩爭咸崤才翁朝廷不惜好官爵絳密刻印埋蓬蒿子美三公悲吟困數敗車上輕重如鴻毛才翁白衣壯士氣塞腹憤勇不忍羞本朝子美重瞳三顧可易得亮輩本亦生吾曹才翁窮居哀勞厭咄咄嵗月奔激朱顏凋子美當年請行大眀下今日頽墮思南巢才翁陽羨溪光逗蒼玉尺半健鯽煙中跳便欲買田學秧稻不復與世爭錙毫奈何三世奉恩澤肯以軀命辭枯焦才翁以知出處繫大義一飯四顧清如燒賀蘭磨劒河飲馬頸繫此賊期崇朝歸來天下解倒挂玉色藹藹宸歡饒才翁筆傾江河紙雲霧歎頌天業包陶姚子美淮上喜雨聮句江淮經嵗旱春暮忽然雨子美亂􅀧踰廣津散灑入原土才翁萬物氣稍蘇厲妖莫能聚子美羣山洗故塵􅂵翠坐可數才翁昏如籠纖紗􅆺若隱紺縷子美碧瓦南崦中重疊出迥覩才翁扁舟凌空飛白鳥入煙舞子美遙林動新滋顏色若可取才翁碧草弄微芳低昂欲來語子美緐聲過沙頭上下謳啞櫓才翁濃澹新畫成快愜久病愈子美念此時多虞豈得嵗少阻才翁焦心閒疲農虚口待香稌子美縣吏事凶貪氣若解縛虎才翁惟於縱誅斂乃能奮怒武子美青天雖云眀疑不照艱苦才翁此時忽霶霈知有神物主子美不然諸蒼生性命委草莽才翁本蹷邦豈寧皮去毛安附子美歌此吿巨公行當視前古才翁蘇學士文集卷第五
