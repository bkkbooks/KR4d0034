  text: 蘇學士文集卷第十二
  hash: sha256:606e6611c0bc1666e454f8ee96a7a96b7dde327b70cecc8c2385b5e2a4d018b4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_012-1a}
body:
  text: 啓事上奉寧軍陳侍郎某啓伏自台馭東上頗失依庇傾想恩德一食三起竊念古之烈士身積道義而往往伏窮閻之下棲巖穴之中雖裘葛不完糲糠幾廢亦未嘗造謁有位祈望恩獎顧血氣心膂豈異於人哉且非樂枯槁餓賤而惡榮利也蓋以𬒳一顧之厚一言之飾雖沒齒不可忘苟不懷報則夷狄之民也是則知之淺益自負而道勝待之厚必自傾而心勞非局於險隘禍難薄身不可轉脫又安肻俯容撙意求出入門下邪舜欽性不及中庸之道居常慕烈士之行幼趨先訓苦心為文十年餘矣髙位齒牙之論故不及然未始趨蹌其門闌以翹知己顧材質雖無似竊以是自貴重焉不幸皇天降凶罹此大酷血屬百口嗸然無歸瀕於溝壑者數矣始荷髙平侍郎定其僑居之計未幾而有河陽之行暨閣下開府首傳誨言嗣頒餼醴俄驅旌斾致奠几筵慰諭丁寧存暖孤苦力敦久要坐變偷風自爾家事細微必為賙給使舉族免於流轉得專孝思其為惠淺深以此可見每撫臆論報然後知身命之輕於鴻毛也比者閣下入鎮近輔曽未踰旬而輒辱書教辭旨稠重迥出常節益見大君子始終經緯之至也感中腷塞動成長嗥瀝血布言疏略不則秋夏之㑹氣候未調伏兾精􅍖寢興輔以藥物哀情不任傾祝之極上杜侍郎啓某啓兩獲侍坐輒沐垂譽鄙言承言愧羞默不敢謝前又數有人言閣下稱道所聮含元賦竊惟大君子獎擢後進故不惜溢言以譽之然閣下為世標矩人所仰屬坐鎮藩屏列邑承風舉動言論播為儀法若舜欽輩才術甚疏無足稱道或當前時宜訓戒開扶使就成人之業至於諧言短韻無補於世不當置於齒牙間使人傳信蓋俗浮易扇染而難回非惟損眀府之雅鑒實亦隳風化之一節也況提封之下千里而逺其間抱才行包道業者甚衆日希眀府一言一顧以為光價有未獲者蓋翹翹焉幸兾移意於彼以重所褒則蚩陋者甘心自屏安有所覬望哉所索崔處士墓銘承命不敢隱謹繕寫通上惶恐惶恐上執政啓近者被中宸之書叨上佐之命起於放廢仍獲便安是為異恩曷勝感惕伏念某幼而向學長則多憂場屋十年間關四舉才叨科級連被凶艱血屬淪亡生理凋盡僅存殘息勉就小官還臺之初辱上公之薦給筆以試預道山之游素為憂患之所叢遂以畏愼而成性言皆三復動必再思且留邸之祀神緣常歲而為㑹餕餘共享京局皆然竊謂前規有所未便起無名之率㑹不肖之徒且醵飲吏人豈如斥賣棄物嘯聚非類豈如宴集同僚更出私錢以助公費餘循舊貫先即上聞豈意謗喧臺中章徹宸極因猜嫌而生隙謂猥䙝以當懲造諼以動上聰持必以變朝論捽首就吏雖具獄而無他刺骨定刑終削籍而見棄素承清白之訓枉被盜賊之名近戚當塗陳冤無路徊徨去國舉動畏人僒爾羇旅之囚漂然江海之上出則鬼神覦而見笑居則鵩閒暇以相窺不及蟲鼠之生僅與草木為伍三逢恩霑四換歲紀弗敢自述已分陸沈不圖特降命書復登仕版此蓋相公運斡元化翕張洪爐贊天地生育之私布朝廷寬大之恩慮一物之失適萬物之宜顧惟擯斥之微亦預甄陶之末謂誅意無害且論法太輕取宣尼觀過之言酌春秋原情之義度此釁纍漸而收效古人覩道上之遺簪為之泣涕匠者得溝中之斷木飾以青黃是為不忍遐遺有所倡勸誓固困窮之節上酬提品之私薦王景仁啓某啓某資雖顓庸心輒喜善豈緣世契上布公言某昨任長垣縣有尉王景仁者性質惇淳所向通徹徇公之外好學不倦才行卓越可以制事厲俗其文詞有梁唐蕭統孤及之風雅尚退默不髙人以聲故沈頓賤仕未為位上者所引拔閣下服天子之命專按舉之職寰內之吏賢不肖得以進退之敢以斯人置於門下幸賜薦籍以為光寵足使列邑聞之竦然知勸亦閣下之所樂行也風威所臨洞鑒不隔安敢自任愚瞽上欺髙眀真慤之誠幸兾采察不任激切之至京兆求罷表臣某言臣聞佐機命者以訏謨為先制兵鈐者以多算為勝蓋安危之所係當議論之必精苟異於斯故難全度中謝昨者醜虜不庭齊壇命帥不能專閫外之事而乃求幄中之謨遣吏入朝列章來上臣本以孤直誤叨獎知久留滯於外藩忽引拔於近列凡有所見未嘗不言雖數被於沮傷且敢思於欺默報陛下非常之遇罄下臣無隱之懷比者將以重兵深入賊境衆謂當爾臣為不然既練閲未精又餉饋不足士不習山川之險阻將不知巢穴之深淺臣兩在關中僃見形勢既虞調發先搖民心復慮覆軍愈增敵氣向去邊鄙卒難支持是以悉心為圖瀝􅝴上白雖淵衷廣納未欲加罪於瞽言而卑論弗臧安可尚居於厚位伏望皇帝陛下察其朴拙曲為哀矜俾出守於小邦或投置於散地進退有禮在國體以誠宜言行無欺於臣心而自足叫閽斯切得請是期臣無任祈天待命激切震懼之至杜公讓官表伏奉制書特授臣依前尚書吏部侍郎同中書門下平章事兼樞密使集賢殿大學士承命震懼精魄播越俯伏廷陛進退靡遑中謝臣聞朝廷之尊本乎擇吏使才者進拜拙者伏藏至於小官必當其任況乎丞相之位上鄰於國君命出納之所先生民休戚之所繫一夫厥授衆罹其殃比於他官尤當精擇若臣者天資淺拙學無根柢叨竊廩食已將三紀心素知分得皆踰涯夙夜憂勞心膂耗竭早居侍從之列繼承屏翰之任尋被峻命入冠中臺出擁西雍之麾旋更大鹵之節雖極勤瘁無補涓毫暨乎誤進樞庭久尸重柄故嘗屢拜􅝴牘乞收殘骸敢煩淵衷恐失國體日企神聖之度下垂開可之恩豈意便升鼎司復領舊職內慙枯朽之質重增貪冒之名伏望皇帝陛下念授受之至艱奮剛眀之獨斷收此成命別付偉人用適股肱之宜以增名器之重古者搜於林藪下及屠釣不間微陋務求賢能要乎成功不必次補況今近列不至乏才移於他人乃合公議刳心瀝􅝴退俟俞旨杜公謝官表兩貢露奏乞回命書沓降玉音不諒血􅝴勉爾璽紱安敢為榮切以宰相之任臣實知之蓋以師表外廷丹青萬務天下之所想望王者之所仰成上則調陰陽之慘舒外則鎮蠻夷之桀猾置大器於顚危之外納生民於仁夀之中必惟其人乃可致此是故峻其名數寵之等威黃閣黑幡葱珩赤紱或延登受策或御坐為起是國之所委者大則禮之所屬也隆遇任既殊責望宜厚臣立性褊直有不可移之資臨事迂疏必無能成之策塵汚近輔貽誚多方績效不揚譏議上徹居常悚栗日俟竄投而陛下收臣於賤朽之中拔臣於毁謗之內以謂石慶老而彌謹趙禹孤而能立掩闕失而不問惟忠鯁之是稱屢於中闈親被盛指退自省閲但增震驚日月之光下燭於蔀室雲雷之澤遽發於枯荄雖至糜軀何報厚渥敢不盡疲駑之力宣寬大之恩絶纖介之私回講長久之利疚不敢惜死唯知自公苟晚節之或渝必神眀之所殛上陳天覽安敢空言杜公求退第一表昨於上春屢貢丹􅝴乞解重柄以收殘骸霈澤過優俞旨不下臨遣中侍甫降德音聞命震驚不敢煩瀆伏念臣才雖至下性本不欺交遊朋友之間必以誠信自守況於事主安敢妄言實以年近從心體素多病自忝魁任於今纍年當萬務之煩為天下之管雖健才利刃猶或不支而皓髮羸軀安能集事當一人側席於上多士建議於下臣若肆然自處默無所為清議不容素履將喪故嘗上犯天聽僃寫血誠願踰誕聖之期以得退休之請金口曲加於獎慰玉色已形於開從伏望皇帝陛下霈成湯之至仁廓漢髙之大度或假以近郡或留之本班庶使自安以全殘息第二表近以露奏仰於上聰眀旨下頒過推勿二之任丹衷內切敢避再三之瀆徊徨失措啓處不寧臣本以孤生濫塵上第踐履藩屏叨竊事權循分已逾被遇太厚不意便升近職復進樞司使預幄中之謨得聞天下之事憂太劇而疾作福既過而災生氣衰而步趨已艱齒􅑁而語言不正陟降左右則常虞蹶踣議論政事則莫能開陳貽笑外夷靦顏多士而陛下容此衰廢掩其過失豈不念國之大計何必私臣之一身況今西有貪毒之羌北有桀傲之虜包藏凶計窺伺中朝當得厭難折衝之才制勝非常之士置之近列可消姦謀臣也少不如人老豈足任故非見險而止安敢容身而去但恐力不足而敗事死有責而堪羞伏望皇帝陛下垂閔螻蟻之誠下霈雲霓之澤免此劇任賜之殘骸以兹祿廩之優可待英豪之器休息老物是惟天地之常登拔俊賢實曰邦家之盛第三表近者沓貢囊奏願解劇權伏奉某日批答未蒙俞旨者葵藿之心希照於白日螻蟻之意未動於上天惴然危悰若集喬木臣粗知進退槩見古今巵及滿而乃傾月既盈而當缺事有必至理無足疑故前志垂文以為懿戒後人仰止期無敗身臣久汚樞司絶無逺略萬鍾之祿私情之所愛三旌之位物理以難當必量力以自思敢妨賢而取禍下喧物議上纍主知既交謫之四來雖全度而安可恭惟皇帝陛下以至仁覆物以普愛牧民豈今左右之臣不令終始之分敢緣大義不避螻陳據蒺弗遑裂肝以上俯回天照俯悉愚衷第四表伏蒙宸慈以臣纍表乞罷重任復降批答不允者慤忠莫奪量分甚眀顧當行命之由再露由衷之請臣聞罔上者臣之大咎飾詐者士之醜議吏議為深舊章所禁臣器能甚薄名爵則崇既陳必退之言義無復寢之理十目可畏羣聽至眀無疾而抗言是名罔上懷祿而僞讓則為飾詐不惟受譏於世貽誚多方故當誅夷以戒姦慝臣實以量狹而位已過器重而力不任謨猷若斯陛下所盡悉形骸如此衆人所共觀既非僥幸於此身切恐隳弛於衆務況陛下富有四海樂育羣才豈無他人可當此任伏望照臣至􅝴容臣必去則纖毫之恩不敢授內外之任無所擇仰干宸聽俯俟俞旨第五表四拜封章乞罷密職薦頒眀詔未賜俞旨誠切意專不避浼瀆臣聞天生庶民愛惜至甚必立君長使之教育故土地之所産雨露之所生君得用之亦不可濫則必分列名位以求賢能君出爵祿以養其臣臣竭才智以牧其衆故庶務交舉羣生安業天則報之以氣應錫之以瑞物苟異於此災害乃生故前志曰王者代天爵人不敢虛授雖是小官尚思精擇至於重任豈宜非才蓋天下治亂之所因國家安危之所係古今眀效衆所共知早任外官粗免曠敗不思揆度實思進用以謂前世之陳迹可監本朝之故事可尋陛下以仁聖之資任遇兼至顧太平易致風俗必移暨臣召入樞司復遷上列數年之內百事無能關西之將帥覆亡京右之盜賊猖熾陷沒士卒殺傷平民經歲之間不可勝計而又地屢震於定襄之野星相凌於天垣之內螟蝗交作水旱不調故北虜移割地之書西羌遣求幣之使朝廷卑屈辭意厚納金繒幣藏空虛誅斂煩費延寇讐於帷幄之內陷民吏於湯火之中尚如餧飼飢鷹豢養乳虎更開後患未可偷安皆由臣謀議弗臧職業不舉惕然內訟深愧初心若撻市朝如坐塗炭手足顚倒而罔知所措心膂枯竭而莫能為謨敢玩歲時日俟譴謫雖陛下容之如地愛之欲生上天之鑒皎爾不可欺三聖之靈赫然在其上豈使臣虛食生民之肝腦竊弄公朝之威柄必有大禍將及私門設令臣族委溝磎命掛鋒鍔有利於國敢愛此身但恐因循益成頽弊伏望皇帝陛下察此迫切俯賜開可以兹重柄別授奇才必有魁卓之賢可贊隆平之化恢復藝祖神宗之業追還咸平景德之風君尊於朝民樂於下若未容臣去終無比功徒爾素餐但塞賢路陛下若責臣無效堅以疾辭願正刑書放還田里實為優幸敢覬覦天髙聽卑兾委成命臣不勝激切屏營之至蘇學士文集卷第十二
