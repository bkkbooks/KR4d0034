  text: 蘇學士文集卷第九
  hash: sha256:3a43d58fe06ef1ee4e24492788ccb70a28a08b656ecf2859621c312c7bc55e64
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_009-1a}
body:
  text: 上三司副使段公書某謂士之潔矩厲行施才業以拯世務者非秪蹈道以為樂上者覬聲名次者幸祿賞至於餓寒其體膚枯槀巖穴之內犯刃兵塗裂肝腦彊於行陳者亦皆然惟知道所為不妄矣其有挺然立事謝絶世嬰逺舉而不顧者幾希其人哉有誠髙矣亦烏足著為風教哉故朝廷張爵位君子以名稱重輕而沮勸之道行無狀行無狀一旦射合時利而位可得也名則遁矣蓋名之發惟精識者尸之不私不隱不以榮辱遷為得符天下之正義雖小人好惡淆其閒不能奪也某何為者輒有此論竊自念幼喜讀書弄筆研稍長則以無聞為恥嘗謂人之所以為人者言也言也者必歸於道義道與義澤於物而後已至是則斯為不朽矣故每屬文不敢雕琢以害正然而法章民事一未知其牙蘖偶奏賦上前得及第命宰以蒙才兩月以家難離官下邑民遮道助嗥泣又歎息有若惜其去者念政無所及心頗愧之及幽居長安百口飢餓遂假貸苑東之田數頃躬耕其間故播斂之早晚塍畔之出入質契之昏眀豪弱之交侵訟訴之搆官司之辨皆親嘗之而又律令詔敕奇請重復傅比之文無不偏見雖條目繁滋皆可類舉靜念忘之政必有悖於法不安於民者居常惻然及終喪還都下伯父至自東管首言道遇閣下盛談蒙邑之治某荒忽自失伏念閣下正峭眀察重其許可一言之賞不可妄得是必有所過聽也嘗能竄一巨豪杖殺一黠吏此外特庸庸所為耳閣下不以善小棄之特為置齒牙閒時尚或以謂操使權者故當察其屬之否臧而進退之私心未甚德也去年夏初又得京兆司録孫甫所言如伯父時始至此邑鄙懷聳然自謂今職在甸內去京師不數舍朝有施為而夕聞焉上府多士如段公之樂道人善者故有焉况法章民政稍貫於昔益勵精力以事事迄今踰年吏民雖信而當塗之稱道蔑聞焉而又符檄督責終日憔悴而救過不暇惘然自疑何智於前而愚於此㑹太公弟至云閣下前過邑所論如甫書始聞之如瞶者之決得聽鐘鼓之奏喜過感極輒欲泣涕以知大君子勤勤獎借終始之不懈也李習之云知而不能譽則如勿知譽而不能久則如勿譽閣下既知而又譽之譽而又久之夫何幸哉且世有獲薦寵推延之賜者必皆順顔承辭親被指役隆寒苦暑趨走左右未有上下相絶未嘗一拜稜威乃肯垂慈詢察因片善而稱道久而不渝者此為難也使某之名一落人耳不至沈滅於時者閣下之賜也爾後知舉世見毁不足動懷也嘗欲特詣前以寫此􅝴為邑事所繫不得勇往故憑文字以謝檗積之抱萬不一宣傾望恩德顚沛于是氣律兼潤炎暑差早伏望上為社廟善􅍖興居上范希文書某觀古之烈士受人一言一顧之重不計己之能否事之重輕捐命無向而不入或促其禍敗纍於所知者多矣然史氏稗說皆輟之以稱述其事而警厲偷淺某竊謂其勇敢敦氣節則有餘至於成就大計趣道與權則不足矣故某自少小逮於作官所為不敢妄必審處己之才能而傅㑹於道人雖不知自信甚篤且久矣昨者朝廷以閣下才謀絶世負天下之重望倚之以究西事故閣下開置幕府收策志慮英犖之士以自廣益以兵者重器資羣材以共舉一失其任則折衄報之而閣下誤有聽采將引猥瑣置于左右委言垂意彂於顔色某非不知依閣下之重可以取光價而自振起設臨幾事不能有所建弼恥也有所建弼而不合於義不行焉亦恥也况於輕撓哉反是則不惟虧損閣下之望某終身可廢無所容焉是以上犯盛意􅝴激避辭者蓋在此也然某雖至冥愚內荷閣下之顧夙夕感慨思有所報昨聞閣下以張存不才自求守延州物論喧然以閣下領經略之權自可往來陜右進退在已延州逼近賊鋒而能舍安逸以就危隘雖古人不逮也又或云閣下居長安統二於人不能眀白立功名將髙舉逺去以自異此二塗未必中閣下之度以某觀之既白張存則不得不自請但裁授之制有所未安何者以閣下為經略則自陜西以至於邊徼斥候皆可處置在延則局子于一州於他郡不接矣他郡不接或可不能仰置關中事蓋關中之俗大抵彊悍豪忍又形勢險固出於天下今方盡取鄉民籍之為兵得操弓兵以自肄習往來道路與寇賊不辨小人少思慮加之氣俗又得此利器幸而歲常豐父兄家老聚居可約束不幸少歉父兄不能􅍖有其子弟必將人人依險以自快則其將奈何邪况朝廷前有意令其自衛不率以戰今條約煩細迫又驅之以向敵人頗失望有天下而失人以信後將何所恃焉昨者延安鎮戎殺害民畜不可勝紀死氣結戾不判必能變亂陰陽之和今雖少稔恐來年宿麥不登民必狼顧矣弱者流轉彊者化而為貪賊則心腹自有疾矣閣下居延州雖能制昊賊之命係虜其種族逐之絶漠而遁亦何救關中之事邪故某謂西羌不足憂於關中也近日竊聞鄰郡數勝頗得馬畜屠其柵壘火其聚積朝廷即時越次以賞其勞使人得自有其所得軍聲稍振士百其勇以某觀之古之善禦戎者豈特是哉蓋務訓撫吾民使安其業不以非義動扼其衝塞絶其牙市閉之沙漠之外使其隙且困則破散之晨鈔夕盜與競寸尺之地非大國之體也某反慮將佐不知此事鋭而少思狃毫髮之勝中其詭譎而所喪必大蓋兵家之法必以餌驕人而後取之况羌常以伏奇包衆勝中國當此之際閣下能部勒諸將分乘險阻不使習小利以為功持重其體而死其姦謀不憚曠日而使之內潰此孫武所謂善之善者也况夫體幽靜則謀精而威氣張鋭則令煩而􅑁閣下立謀而首令者也以身繫安危可不愼哉若能去延州之狹以自任撫關中之人以示信而又沈逺變動則何敵之敢先哉縣料古人所難况某淺識而欲上贊逺略然區區之誠腷臆於內萬覬一得以補髙眀撫斷之餘特賜省閲幸甚窮邊寒苦乞加護練不任􅝴激之至應制科上省使葉道卿書三月日某謹齊祓百拜獻書于省使龍圗閣下某觀前古之士歘然奮起於賤庸之地建名樹勳風采表於當世者未始不由上官巨公推引而能至也故儒其名者必奔走貴勢之門以希光寵而取重焉然有位之德望重輕亦因收士多少而後定設國有緩急則審處變故推擇門下士以屬任焉或資其策慮以自廣小則補吏大則同升于朝以故士皆雕琢節行緣以文采藹藹而進至使敵國異方聞風畏之厭殺未形之患此其所以為得也然奔騖誇鬻扇動流俗苟竊虗名以自耀髙位者或私其所與朋比自植肆然攬爵賞之柄此又所以為失也本朝監其失進退天下士一決於上考文藝則騰書糊名衡文之學靡以行實相雄長公卿亦闔無所顧接蓋蔽賢之罰不及焉上下隔塞不交忘經逺之業此又今之所以為失也故近年賊羌暴逆節廟堂圗帥西攻思所以折衝制勝者惘然乏其人以至詔書數下猝猝求索而才者未甚出凡近之器往往入充其選蓋朝廷取士之路本狹在上者不以汲善為意下士又以造謁為之恥故驟閲而無得焉是古今得失相糾惟賢者為能折其衷某為性本迃拙不喜事人事名雖在仕版而未嘗數當塗之門竊服於道二十年矣前世之務當今之宜粗志其一二然雖與周旋者亦弗敢吐以自表見閣下以髙文閎才都盛位而某以吏屬時得趨蹌左右未始敢開詞動氣及於局事之外非唯輕肆是懼亦且束於世教也今幸天子下一尺書羣延四方特起之士某輒欲以空乏鄙陋之資冒然自進竊念科試甚重朝廷虗竚以須異人無似妄作虞為識者所不與今幸人未暴聞故敢以私習論五十篇上凂聽覽非敢希企獎引之賜但覬一言以斷進退之惑精識所嚮洞照不隔干瀆威重俯伏待教不任惶恐激切之至上京兆公書某才到闕下數日聞河東地震壞廬舍殺人馬畜不可勝計始聞驚駭不自定徐念臺諫官必有極言時病以救天變者既而踰旬無聞焉又以謂河東守土臣必有上陳消殺之策使朝廷省悟而有所廢置者及是經月又無聞焉某雖迷暗於事不通古今竊謂天地災異莫大於此災異之作未嘗妄也今中外循默不以為怪使陛下忽天戒而不答民畜橫罹其凶食肉者豈不畏懼而能忍也時雖欺之天孰得而欺之哉嗚呼其奈何邪又人以才業為上所知自員外郎不六七年擢任至此天下所共聞雖所歷必盡精力夙夜孜孜不懈然未有赫赫報國之迹為天下所共聞而稱道者今所屬有此災異故當憂思本朝建言時病以針之不可懷忠不彂默默緘口如常常者所為蓋今為上所知天下所想望號端直者惟丈人與孔諫議范吏部耳孔范皆以言得罪惟丈人昔在廷中議論必行擢拜又過二公度此不言則他事無足言者竊恐負陛下任擢之意而隳天下之望也君子之為不畏時王之罰而畏衆人之議或衆議喧譁不可蓋塞則雖終日九遷亦足羞也苟有獻納愼無後於他人實區區之望也至於鈐束小吏期㑹簿書非大賢事業幸委之幕府進讜言以求殺災異宜在今日也况忠雖在畎畞不忘其君無以疏外為詞謹馳此附聞幸留意某再拜上孫沖諫議書某嘗謂世之急者教也教之久則困弊而不流柄天下者必相宜以救之救失其宜則衰削潰敗而莫得收昔者道之消德生焉德之薄文生焉文之弊詞生焉詞之削詭辨生焉辨之生也害詞詞之生也害文文之生也害道德夫道也者性也三皇之治也德也者復性者也二帝之迹也文者表而巳矣三代之采物也辭者所以熏役秦漢之訓詔也辨者華言麗口賊蠹正真而眩人視聽若衛之音魯之縞所謂晉唐俗儒之賦頌也噫三代之際救得其宜故治多焉三代之後不知所以救故亂生焉然上世非無文詞道德勝而後振故也後代非無道德詭辨放淫而覆塞之也故使厖雜不純而流風易遁誠可歎息夫文與詞失之久矣烏可議於近世邪况敢言道德者乎然而典策之奧治詞之法不越此有言而又筆之者斯亦可尚某志此有素未嘗暴彂於流俗前以召笑侮苟非遇大賢君子智識度越則縮跡避訕碌碌走趨之不暇也竊惟閣下宇量拂世業問追古放言遣懷剖昏出眀鋭然欲掌引大物以曉聾衆而起前弊某故敢繕寫雜文共八十有五篇求為佐佑又用此本原原論以先之蓋叢殘屑淺之說不足詭聽覽也自公餘閒乞賜一閲實區區之願某再拜上孔待制書某月日某謹再拜獻書知府待制閣下某竊以自夫子沒迄今數千百年其教混淪閎誕充格上下斯須不可亡天地得之日星光眀不鬭食山澤棣達而不童涸幽則治鬼神顯則嚴君親使萬物各安其分而無窘暴之心者誠至矣哉造物者宜世生哲人以熾厥後長國者宜不絶侯封以尊其本昔漢世韋賢家傳一經猶繼為公相定國斷獄平允猶髙大其門况聖人之後者邪故閣下幼而淑質長而令聞其學奧大而不雜其言謹峻而切事是天以眀粹精剛之氣鍾於閣下將令紹述正教而衍大之天下士人實有望也觀乎自結人主冠映當世闊步臺閣端持紀綱弗顯諫以僥譽弗枉節以求黨姦凶之朋脰縮面汗鰓鰓然不敢抗法度閣下有力焉其典吏部也盡刮宿弊專以白黑善惡為己任坐束吏手日隳濫階伸賢而屈不肖雖三公為之不出於是奈何醜正多徒害能以謗既而去職識者韙之其使胸也專對以禮嚴乎若神不妄言而諂笑不槃辟而雅拜尊本朝而抑外夷得古良使之風焉噫閣下之事業既已顯白而朝廷之用未充天下之譽未洽留滯方屏浸移歲律某竊惑焉得非納士未廣介潔無助者乎夫有助者庸人可以獲聲稱無助者君子必也受訾辱古人詡詡而汲善渠渠而下士是致德義日益引望實日益隆憂患無自入焉如支體之護首目枝葉之蔽本根而籓垣之嚴室廬也晏子春秋曰夫子居處惰倦廉隅不正季路原憲侍血氣為疚志意未達仲弓卜商侍德未盛行未厚顔回騫雍侍又孔叢子引夫子之言曰吾有四友焉得回也門人加親得賜也逺方之士日至得師也前光後輝得由也惡言不及門嗚呼是人之助也誠益哉聖人且如是况不逮者乎閣下方以盛年壯猷將康濟天下而良助猶鮮誠可憮然設或纖人搆讒天子投杼及是也能為閣下奮不顧身眀目張膽論列湔洗破羣毁而眀忠節者果何人哉閣下其念之苟能上循先聖之法下恤愚夫之言清而容物介不拒善則士不逺千里而求為助焉助且至登大躋巖廊可拱而俟也某無似者想望風采為日久矣敢輒獻言以為謁見之具雖欲自述節行以干聽覽竊聞古諺有之虜自鬻雖哀不售士自眩雖辨不納顧惟大君子察其材之淑慝而進退之可也鄙心無所私幸焉某再拜上集賢文相書昨因宴㑹遂被廢逐即日㮄舟東走潛伏於江湖之上困置羈索日與魚鳥同羣躬耕著書不接世故當日之事絶不歷於齒牙之間或親舊見過往往閔惻而言以謂某以非辜遭廢天下之所共知何窮居默處無一言以自辨浩然若無意於世者豈鈍怯不曉者乎某絶不酬應且止其說然內實有所待耳夫為吏坐賄國典之所永棄人情之所不堪某心膂血氣人也家世受朝廷重恩廬墓在京師平生厲名節勤文墨未嘗一施胸中之才豈云銜冤恨困處無人之墟以終此身乎蓋被罪一二年間謗議洶洶尚未寧息相中傷者皆當路得志某雖欲力自辨雪徒重取困辱耳故若死灰槀木昏昏自放而內實有所待也去歲聞天子驛召閣下入政事府某久熟閣下之德望中懷油然始有蘖萌之望俄又聞甘陵卒叛結塢自守環師十萬踰月未誅議者謂暴兵日久紀律弗嚴必有他變相因而起閣下慷慨請行馳至城下威令一彂士樂奮命即時破壁擒其凶魁使天下懦將驕卒聞之皆震栗竦動以自警飭聲壓夷消殺異志嗚呼非偉烈眀果烏能及此哉天子即時臨軒彂策以大丞相印綬付使而往拜焉閣下抗章避讓言論堅正憤疾近世務相奔爭無廉讓之節因事見意以教有位風采凜凜震動萬方是閣下武足戡難文足表世雖處將相之地乃天子用之之眀閣下當之為宜也况讓特一節未若因朝廷之寄舒事業以濟生民之艱也此古人之大君子之所留意也既而果然某雖在巖藪之間聞之不覺廢書而起彈冠攝衣西向引領思一侍几闥傾寫冤憤跡賤道逺未可得也敢輒以尺紙少布下􅈤蓋有所待積年纍月得遭其時不忍自棄又幸當日搆陷者或死或出故敢縷縷而言以通左右某下吏之初喧傳四出好事多口者增飾其語聞者不得不惑時閣下在逺鎮必不甚悉也始者御史府與杜少師范南陽有語言之隙其勢相軋內不自平遂煽造詭說上惑天聽全臺牆進取必於君逆施罔羅預立機械既起大獄不關執政使狡吏鞫窮搒掠以求濫事亦既無狀遂用深文此㑹以常年醵率吏人燕集非類某思之以為非便遂與同監院劉㢲出俸錢十緡又於尋常公用賣故紙錢四五十索相兼使用此錢本由斥賣棄物兩曽奏聞本院自來支使不係諸處帳籍如外郡貨賣雜物以充公用之類也既以與祀神之餘與館閣同舍本局群吏飲食共費之推按甚眀具獄備在無一物入己而以監主自盜減死一等定刑法司前後斷獄體例及自有正條並不引用閣下察之蓋有由也某之偏言似不足信幸詢於衆論及曉法而公者噫國家制馭姦欺示信天下者今惟法律而已蓋法律著之於篇衆所共曉苟一傾撓人皆具知故大上欽愼不敢自專豈容有司自為輕重苟快己志以隳舊典汚辱善士戕害不辜况本朝自祥符以來一用寬典吏有姦贓狼籍未嘗致於深刑今上仁眀愛物度越前古官吏一入人罪者往往十餘年未嘗升擢或沈於銓調不與改官此見聖心愼刑惡殺之至而某被此冤濫又有端由但未為巨公開陳而建白之天聰一聞玉色必恱閣下以英偉之量押領魁柄必以康濟民物湔滌冤滯為己任故某不避冒瀆以鋪此言況某者潛心策書積有歲月前古治亂之根本當今文武之方略粗通一二亦能施設廢棄踈賤不信於時眀公召而與言資相其質衡鑑之下安可妄欺斂之棄之俯伏俟命謹具手啓云云蘇學士文集卷第九
