front:
  text: 蘇學士文集卷第四
  hash: sha256:bc6e489ab3b666f768e00f4413af1c56914d523031d25cdfc79d612167f3317d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0034_SBCK_004-1a}
body:
  text: 若神棲心堂予心充塞天壤間豈以一物相拘關放然一物無不有遂得此身相與閒上人搆堂號棲心不欲塵累相追攀冷灰槀木極潰敗雖有善迹輒自刪予嘗浩然無所撓與子異指亦徃還卷舒動靜固有道期於達者誠非艱郡侯訪予於滄浪亭因而髙會翌日以一章謝之荒亭俗少遊遷客心自愛繞亭植梧竹私心亦有待昨朝十騎來䟃𧽼擁林外水禽駭笳鼓野老瞻車蓋公餘喜靜境賔至因髙會跋石已行廚臨流聊褫帶優游鄙情通放曠末禮殺酒醇引易釂肉美舉必嘬千蹠恣食雞二螯時把蟹開顏閒善謔傾耳得嘉話暮夜歡未厭裵囘意將再跋已見懵騰跨鞍極倒載眀日尚狂酲嘉貺不遑拜送閔永言赴彭門鄙性背時向處世介且迂自固以爲節人皆指爲愚少年宦京邑與衆頗異涂一朝被放棄漂然落江湖江湖信美矣心迹抑更孤永言金閨彥器識當世無機發弦上矢辯走盤中珠髙風樂溪山恥與勢利趨殊科二十年不肯仕京都顧我窮悴者一笑情相與日日奉杯宴但覺懷抱抒瓊裾照坐席内顧瓦礫粗未飮心自醉相對氣已舒得忘羇旅憂蓋以道義俱雲間㝛古寺花下招歌姝勝境尋已徧賞心未嘗孤璽書趣赴治候吏擁舳艫秋風卷大斾喧喧指東徐郊亭對別酒我獨増悲吁人生大塊間氣類有萬殊賢愚各有合惟予邈無徒君子誤見知交契若勘符一旦又睽索千里成闊疎期君早自奮佐時發雄圖功成速收身單舸還東吳白頭青林下尊酒相從娛寄題豐樂亭神物藏勝地深林隱蒼峰威夷渡淺嶺愛此泉一鍾古今未見賞荒然草苔封公來闢一徑疏鑿隨指縱揮洗落塵慮甘涼灑煩胷搆亭於其間四面開軒墉名之豐樂者此意實在農使君何所樂所樂惟年豐年豐訟訴息可使風化醲遊此乃可樂豈徒恱賓從野老共歌呼山禽相迎逢把酒謝白雲授琴對孤松境清豈俗到世路徒衝衝夏熱晝寢感詠盛夏日苦永解帶坐小軒對案不能食揮汗白雨翻軋軋過午景宛轉無由昏偃臥一榻上旣覺復夢魂恬然世慮寂時被蒼蠅喧睡味勝仙去忽貺難俱論晨事如隔日半雜夢寐言人生貴壯健及時取榮尊夏禹惜寸陰窮治萬水源櫛沐風雨中子哭不入門況復庸下者不出強趨奔奈何耽晝寢嬾惰守壞垣念昔年少時奮迅期孤騫筆下驅古風直趣聖所存山子逐雷電安肯服短轅便將決渤澥出手洗乾坤文章竟誤身大議誰周爰捽首下牢獄殗殗如孤豚法吏使除籍其過祗一飱賓朋四散逐投竄向僻藩九虎口牙惡便欲膏其蹯上賴天子眀不使鉗且髠此身自流浪豈能濟元元天下無所歸泛舟旅江邨春雨看秧稻落日自灌園殊郷寡朋友孰辨石與琨卷藏經濟術強談奉狙猿閒困尚有待不忍沈湘沅大暑晝閉户一徑惡草緐出嫌烏啅噪行見蛇蜿蜒蠹書徒盈篋濁醪徒盈樽談笑誰可共道義孰與敦終日對稚立千里逺弟昆此心旣無用不寢徒自煩況兹晝景長但厭枕簟温北窗無纖風返見赤日痕流光何輝赫獨不照覆盆會當破氛祲血吻叫帝閽爛爾正國典曠然滌羣冤姦讒囚大幽上壓九崐崘賢路自肅爽朝政不復渾萬物宇宙間共被陽和恩哭師魯前年子漸死予哭大江頭今年師魯死予方旅長洲初聞尚疑惑涕淚已不收舉杯欲向口荆棘生咽喉憶初定交時後前穆與歐君顏白如霜君語清如流予年又甚少學古衆所羞君欲舉㧞萃聲耦日抉搜不鄙吾學異推尊謂前修今踰二十年迹遠心甚稠後㑹國南門夜談雪滿樓青燈照素髮酒䦨氣益遒昨君握兵柄節制關外侯予才入冊府俄作中都囚飛章立辨雪危言動前旒時雖不見省凜凜壓衆媮旋聞君下獄六月送渭州渭州舊治所昔擁萬貔貅堂中坐玉帳堂下生蛇矛令嚴山石裂恩煦春色浮釁生無根芽衆言起愆尤返來入狴犴吏對安可酬法官巧追拍刺骨不肯抽削秩貶漢東驅迫日置郵窮途無一簪百口誰相賙諸子繼死亾清血漬兩眸貿然幾喪眀憤苦結不瘳君性本剛峭安可小屈柔暴罹此冤辱茍活何所求人間不見容不若地下遊又疑天憎善專與惡報仇二豎潛膏肓衆鬼來邪􅟧棄局奔南陽後事得所投心膽尚卓犖精眀己彌畱生平經緯才蕭瑟掩一丘青天自茫茫長夜何悠悠萬物孰不死死常在嚴秋君齒方盛壯衆期樹風猷二邊方橫猾四海皆瘡疣斯時忽云亾孰爲朝廷憂予方編吳氓日自親鉏耰無縁匍匐救兀兀空悲愁時思莊生言所樂唯髑髏物理不可詰此說誠最優和永叔琅邪山庶子泉陽冰石篆詩一氣破散萬事起獨有篆籀舍其眞周鼓秦山壞已久下至唐室始有人宗臣轉注得天法質雖渾厚氣乃振人間所存十數處豐疎異體世共珍其中琅邪石泉記比之他法殊不倫鐵鎖關連玉鉤壯曲處力可挂萬鈞復疑蛟虯植爪角隱入翠壁蟠未伸近來俗眼苦不賞惟有風月時相親𬗋微仙人謫此守此地勝絶舊喜聞公餘徃觀領賓從獵獵晝隼搖青春遠休車騎步泉側酌泉愛篆移朝昏揮弄潺湲玩點畫情通恍惚疑前身作詩緘本遠相寄邀我共賦意甚勤昨承見敎久閣筆壓以大句尤難文永叔近以書戒予作詩髙風勝事日傾倒安得身寄西飛雲答章傅廢官旅吳門迹與世俗埽構亭滄浪間築室喬樹杪窮徑交聖賢放意狎魚鳥志氣内自充藜藿日亦飽不圖名利場有士同所好南閩章其氏傅名字傳道清晨闖予門疎爽見姿表大篇隨自出爛熳風力老安敢當所褒讀之欲驚倒開軒延與語指亦有深到半生蹋京塵識予恨不早扶疎珊瑚枝本不自雕巧當珍玉府中何故委衰草秋風還故郷無或難枯槁貴富烏足論令名當自保遊山上春遊南峰出自閶扉西崎嶇縁田塍時又涉狄磎午初至峰下先讀爛古碑僧廬頗新鮮丹青見朝曦云昔支公居石迹有馬蹄踰嶺到天平上觀石屋危蒼壁瀉白泉對之已忘疲西巖列窗户玲瓏漏斜暉嵌然似餖飣人力安可施朝餐下木瀆市物俗所宜琴臺昔嘗遊囘首憶舊題南向又渡嶺盤屈麋鹿蹊摺身趨寶華又到文法鼙松間見廣路平如隱金鎚寺壓兩山脚三面張屏幃夜䦨㝛虚堂清甚無夢思西向登堯峰俗云堯所基洪川不能沒上有萬衆棲中道舎藍輿從者亦汗衣關陸巧步趨健馬莫可追自傷幹軀大兩股酸不隨巖雨灑磴滑帷賴枯筇支四顧物象殊雖困強自持竹木互支撐小閣架險梯凌晨過橫山蹴蹋雲霞低身如插翅翼下見鴻鵠卑却視衆壑林密若薺麥齊是皆樗櫟材春登緑翠姿一方紺碧瓦樓殿貼地飛右顧萬頃湖東與天相迷日炙白煙開風驅銀山移旁過折腰塔鐵輪盡顚墮近爲震霆拔火烈瓦甓糜未知天之意摧此將何爲迤邐看薦福愛此路側池清無一點塵鰕魚潛琉璃寶積仰修竹整如翠羽旗稜伽屋老朽是亦傳者非北渡千丈橋柱裊闌傾攲攬衣俯而趨愁爲溪風吹遇勝輒自畱仰嘯巾屢遺永言喜謔浪把酒先嘻嘻杖屨閱奇怪瞪睨惟嗟咨及還城中居城人殊未知自疑身被畱蹔此夢寐歸紛然著鄙事奔走爭自私向者却是夢反復又自疑神眀日夜徃内顧行者尸何由擺塵氛榮辱兩莫期清泉與白雲終老得自怡寒夜九河巨流凍長山山髙微黯石色頑沙籠如煙吐朱灣中天撾鼓雲垂關壺炙不温乳烏死城上琴聲愁九子羅幕翻風花滿波玉塵灑窗濕眀綺獸角消紅犀鳳乾縷生篆字香盤盤坐聆翰音拂南極馳念疆埸中已酸欲決沈雲叫陰帝虜滅不使天下寒送施秀才賤生罹凶喪日與死亾逼羇孤困猜嫌動步畏蛇蜮之子脫俗情平生未相識足繭千里來顧我喜顏色衣裘風霜凋顏髮塵土蝕開席揖之坐意勤語腷塞徐徐動辭氣突兀露胷臆紺囊出文章發覆見寶璧自羞無所有曷以報相德吿行東風前花草正狼籍又無一尊酒澆沃慰遠客扁舟下長淮企立空歎息送韓三子華還家人在天壤間共爲氣驅逐嵗月自崩奔冉冉若轉轂榮樂隨雲煙凋零共草木亨屯固常物達者安可速柰何此軀骸未免混世俗前年奔大凶況復􅑁手足零丁旅山陽逐熟聚衰族相逢眼盡白閉戸甘退縮左丞鎭景亳相去路重複數遣令子來十里弔荼毒子華勇此行東下甚匍匐入門未及言相向且慟哭嗟我顏色枯鬚蒼鬢雙秃相別始踰年世事何反覆晤言出古表但覺白日速勘書春雨靜煑藥夜火續襟懷兩澄澹炯炯抱眀玉時苦外物喧又嗟別期促和風送歸帆盎動淮氣緑早寄別後篇微吟慰孤獨觀放牐沈沈滄淮口植木限衆流啓閉固有時出納千萬舟卷子懷抱昏羇別相牽鉤觀此巨派注頗覺滯悶瘳喧豗怒霆起始駭久不收旣前目眩轉足縮不敢畱朔雪下噴薄散爲白霧浮上懸赤油幕旁斷縹玉旒恐激地軸轉人有魚鼈憂驚嗟勢力壯孰謂此物柔吾思作至監實以處上游又欲接之口沃蕩胷中愁俄然漸枯涸哮爾空泥溝渟滀旣因人開洩豈自由立間見底裏咄哉爲爾羞金山寺孤峰湧滄江突兀臺􅢜積驚波四面起日夜走霹靂陰壑滀風雲陽厓產金碧離披萬年樹根抱太古石修廊轉峻閣窈窕壓山脊寶像浮海來珠瓔冷光滴叩䦨見黿鼉揚首意自得偃蹇互出沒日此飽餘食又有翠羽禽羣飛喜賓客口銜紺蔕花近我若相識開軒心曠絶上下無異色氣象特清壯所覽輒快適予心本髙灑誤爲塵土隔不知人間世有此物外迹落日將登舟低囘空自惜九月五日夜出盤門泊於湖間偶成密㑹坐上書呈黃尉紺油幙見黃金鉤貝璣磊落不流流澄澄媚影動波上的的逺勢橫沙頭前山漸昏漁唱息唯有疎葦吟窮秋予方弭檝對此景時欲乗興長城遊青蛾蕩槳忽遠至雖有雅約猶嚬羞綵舟鮮眀四窗闢蘭酎辛滑嘉賓畱歌餘清冽貫衆耳笑動姿采生香㡚玉盤膾鱸光一色飣簇殽核隨所搜河斜參倒氣逾洽我起飲子子必酬共知此㑹不易得邂逅得此難再求區區才知自勞役擾擾塵俗多悲憂已醉更歌更起舞眀日分散空離愁送張統尉嘉禾濯濯桂枝郎尉邑上攜李青衫未足榮蘭衣應自喜萊子衣荆蘭之衣威聲入萑蒲吟思發山水美才仕云初令聞當日起秋夜新秋積雨後夜聞蚯蚓聲似爭絡緯緐不讓蟋蟀情嗟爾微陋物身與土壤并藐然本無心天時使之鳴空庭雜槀木亦能感人情老蛟蟄汚泥寂默不自驚一旦走霹靂飛雨洗八紘幽蟠孰可聞自有濟物誠嵗若弗大旱此志豈妄行寄題周源家亭君家有虚亭跨澗復面山泉聲碎環玦清繞窗户閒潛鱗俯自釣佳樹坐可攀我思醉其上與子開塵顏微吟對一枰放此白日間蘇學士文集卷第四
