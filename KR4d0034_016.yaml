body:
  text: 朝奉大夫尚書度支郎中允天章閣待制知陜州軍府事平晉縣開國男食邑三百户上護軍賜𬗋金魚袋王公行狀曽祖某左拾遺纍贈太師尚書令魯國公祖某兵部侍郎纍贈太師尚書令晉國公父某兵部郎中贈户部尚書公諱質字子野其先占籍大名由晉公貴始居京師自幼好學不羣兒嬉太尉文正公即公之伯父祥符中為大丞相蔭公為太常寺奉禮郎稍長向學益篤一日以所著獻于文正文正覽之驚嗟親為作詩以美之改大理丞尚未冠又以文聞奏御召試學士院考入進士第劉尚書筠在翰林與諸公交薦遂充館閣校勘轉中丞太常博士遷集賢校理改祠部員外郎時年始二十五風韻髙灑喜辨論所交皆當世豪英未始敢以貴勢少年遇之俄丁尚書憂旅于南都與諸弟飯脫粟茹蔬至性孝睦族無間言服除同判蘇州郡守黃公宗且前輩有才望任氣自雄長以公齒未壯初未甚禮公事之至恪雖被譏嘲絶不讎應官事有未便者必乘間以白之不聽則力為辨其枉直必于行而後已黃公初忿恨終感悟而加禮焉還朝賜緋魚改度支同判尚書刑部又判吏部南曹改司封知蔡州蔡之圭田頗瘠民歲輸租甚苦之公至郡悉蠲除不取俗舊祠吳元濟公曰安有逆醜而廟食者乎長吏不能革舊俗之濫民何觀焉於是毁元濟之像以狄梁公李太尉有功于唐而德及蔡人遂建二公之祠號雙廟率羣吏往拜祀之而轉祠部郎中召為開封府推官公兄雍時亦為三司判官公曰是皆劇職吾兄弟並命妨寒士之進遂懇辭之出知夀州郡素號多訟而邑所部送囚雖重辟往往僞竄其名以上公摘其濫姦擒邑吏坐鞭而黥之自是肅然又多豪姓五等之籍久廢每斂率無科吏以賂為輕重公將定其籍不問吏手吏竊相笑語曰是烏能周知吾民之産乎公一日㑹官吏坐府中自為檄召隱豪而諭之皆稽首歎服餘之登耗纖悉無差一府震駭號為神眀又移廬州巨盜張雄殺其黨并所資而遁邏者獲之公以法誅之牘下大理法官引近詔盜殺其徒者原之雄不當死吏當坐罪公曰法所以戢姦而斷實原情今雄本罪當死而又殺人以取資既非自首而捕得之盜無悛惡之狀法無破姦之術疏三上不省公曰吾不勝法吏矣又上疏自劾願不坐羣吏又不聽碩自為首乃聽遂左降監舒州靈仙觀他吏得減一等公襟上髙爽有仙風道格日與二三逸人放意於江山之間笑歌盤嬉灑然得方外之趣夙有羸病藥劑未嘗去手既至舒數月而舊疾頗愈因採古今練形攝生之術著寶元總録一百卷逾年今資政殿學士給事中韓公琦知審刑院上言前法頗濫因申眀舊制請盜殺其徒者不首不原朝廷從之如公往者之議又今資政殿大學士鄭公戩翰林侍讀學士葉公清臣皆薦公才可大用而以非辜久黜遂起知泰州歲中改度支郎中入朝授荆湖北路轉運使賜三品服自西方用武領是職者務先掊下以為事事爭以羡餘為名貢豫朝以助軍需其實誅于民也朝廷往往擢之好官號為稱職公深嫉之常賦之外無一毫橫斂逺民賴焉冨公弼為資政殿學士常帶史館修撰平生未嘗識公面而素慕之薦公有賢業而恬不喜進願召還代修撰從之又命同判吏部流內銓俄拜天章閣待制是時上方登用俊良剗革夙弊公雍容侍從之列以清風峻節為一時所畏或以公少所獻納為議者君子謂使子野于朝雖恬然不言士大夫仰其風采亦當競廉讓而忘鄙俗之心焉為吏部未一歲號為稱職嘗謂同列曰官局之設若權衡然險者妄自髙下非器之弊也苟遇物持平䡖重判然于中矣故貴豪者毋偉請孤逺者毋廢勞老吏手束脅息不敢搖動其法州縣巧黠吏有以賄得舉者於格當遷公廉知之遂為密啓使使從中罷者甚衆俄出知陜州才一年寢疾慶曆五年終于官舍享年四十有五纍階為朝奉大夫勳為上護軍爵平晉縣開國男公少以師禮事楊文公億文公深器之嘗以書譽于劉翰林曰子野英妙不衒文干進當世佳士也又以公詩句手寫扇上衆爭玩之由是名稱益大公剛峭介潔而性仁厚果于義斷論者謂之烈祖之風操靜退不喜進趨或與公同在館閣者皆去為達官當塗教誘公終不為屈以是益不見用公亦自適無所憾朝議嗟之公有女當嫁遂求廬州例得裝錢二十萬將以為資送執政者諭意欲公往謁之公終不往遂不得公謫官靈仙至窘匱乃舉族蔬食數年未嘗食肉每得俸入輒厚享賔客數日而竭公年三十八為尚書郎每授命則惕然驚悸曰吾先君夀六十有八終于省郎吾今亦已老矣性純孝每道先君事則雱然泣下公弟素自淮南按察使被召帥涇原命下之日公通夕不寐召諸子謂曰吾弟母老且病子至幼詎可以禦戎窮邊乎吾無親憂而汝輩長矣眀日遂上言乞留素而自代願死節以報國弗從又命其子規曰朝廷不免吾弟之行吾所憂也汝其往侍無怠焉公特愛於規其以多病未嘗使離䣛下又幼弟端力學勤官十餘年未出州縣公當遷官拜章乞端召試遂賜進士出身公智識閎逺善談名理雖庸人之善終身不忘為郡先化導不尚威罰主漕荆南也嘗榷府事有媪訴其婦之見逐無所歸公召而詰之婦曰舅始亡姑即嫁去既窮而歸奉養甚謹後取之金又嫁今復窮而歸故不敢舍公曰姑雖不良獨不念若夫邪又謂其婦之子曰爾毋薄于姑爾獨不念父邪遂切責媪諭以改行又取家人之衣以衣之與婦孫廩粟使以歸養於是皆感泣而去孝愛如初大凡民有犯法詆欺者雖末事必竟過誤雖大必貸之或良頑共罪頑雖辭勝若真可信者公必直指其隱善惡立決衆伏其眀所至橫猾屏迹畏公之眀不敢犯外臺非其人多暴斂于民者公悉不承命與之講辨或不決聞之于朝每多見從故數為惡吏撫事以中公亦浩然不校然不能害公治家嚴眀有法度以道義訓子弟初文正為中書舍人家至窶與昆弟貸息錢約違期以所乘之馬償之公閲書得劵召子弟而示之曰此吾家清風爾曹當毋忘此事又得顔魯公為尚書時乞米于李大夫墨帖親摹于石遍遺親友公喜士好施凡遇人危急平生仇惡皆一視若已未嘗問家有無唯聚書數千卷古琴數張出處未嘗舍去公既卒陜人哀哭塞道朝野無賢愚皆相弔出涕家貧柩不能還先塋朋舊在要官者皆力之遂得還京師嘗語人曰吾思世故無所為忽忽欲熟醉以死幸矣屢以後事屬家人且笑曰人世一吷耳安可久期哉公之生也以七月二十六日亦以是日而亡娶周氏封褒信縣君故禮部侍郎起之女男三人曰毖將作監主簿曰規前眀州奉化縣主簿曰復將作監主簿女二人長適太常寺太祝范
