front:
  text: 銓補令久不治始廷擇京師官宰之公既至刮剗宿滯去人所不便安者又為興起其利未數月一邑歡然從之郡將皇甫選為世吏師聞公治狀歎伏不能已又貽之書而稱美之自是他邑訴訟之不決者必屬公平處胸奴南牧章聖皇帝狩於澶淵太尉文正王公奏管機事牘章繁委一出公手景德二年外臺表公永城之勞改大理寺丞通判陳州尋移通判鄆州未幾信國棄養護喪歸上都服除通判許州再移於陳時郡界河決害民計其補塞費巨萬公馳至其地集瀕河丁壯就伐薪藁親為裁畫一物不取於民而堤復完堅又去郡數十里有羣寇大浮艦而下將劫㫄邑公廉知之自部十餘卒夜掩至命匽河絶上流舉火伐鼓以疑之賊棄舟送走盡束以付吏談者伏其謀勇轉運使鄭文寶聞之走檄㑹公于許既至歎曰急欲識公之面顔耳秩滿上祀汾陰恩遷殿中丞因進文十卷上覽之加賞欲召試文正公避嫌例除逺郡守特召見改太常博士知洋州郡有公校李甲者豪於里中誣其兄之子為他姓賂里嫗之貌類者使奪以為己子又醉其嫂以嫁之盡取其資嫂流離􅍓訴於州及提刑轉運使每置對甲輒賂吏常掠使自誣服杖而去者前後十餘年公至復出訴察嫗色冤甚遂索舊牘視之皆未嘗引乳醫為證一日盡召其黨出乳醫示之甲遂伏辜母子復故八年遷屯田員外郎知相州時河北蝗旱轉運使固歲計覆不以實聞諸郡畏莫敢言公力抗章請蠲賦役州民賴以全活詔嘉獎焉郡伍伯誘民詐許以事禱主子舍者而陰受其賕公察知之盡捕繫獄表請御史推鞫獄成杖伍伯及同姦竄海島事雖驗白宰相與文正公有隙者言於上猶下遷公通判大眀府時文節張公鎮魏薦公才中御史遂召為殿中侍御史尋擢侍御史時淮浙蝗旱民飢殍流散命公為安撫所至賑廩囷蓄家罷諸役作舉良吏以牧養之合肥有陂可溉田久為右姓專其利公決導以濟下户得以衣食者不可勝數未還上嘉其稱職除開封判官一日奏事畢趨出至屏外復召賜緋衣銀魚歲餘除河北轉運使詔留監定故丞相向公諸子分財丁崖州當國勢懾天下私所親諭公欲市向公長安華嚴別墅又諷其子從之公至其家面戒曰土田衣食之源不可棄故餘財盡均而華嚴獨存不以分由是忤崖州意及赴河朔舊二使並移他道公先獨領其任㑹章聖御樓宴駕今上踐祚賞賫重沓常計不能支朝廷深以為慮督責甚急又定州帥曹煒威名素著得士卒心為崖州所惡以大將軍貶萊州朝議憂其拒命逗撓為變詔公馳驛收其兵柄崖州又欲緣此伺公隙以危法中之公從容優𥙿處之甚閒無不得其宜者覃恩改司封員外郎又加直史館天聖二年移知青州才數月召為侍御史知雜事賜金紫三年判大理寺遷工部郎中治臺雜幾二年時中丞闕久不補連鞫詔獄郡將有託所親納金于宰相文穆公又因牙吏審之公知執吏以聞詔付臺鞫焉郡將遂誣吏誤以聞所親之語達文穆欲滅其迹公平心窮治果郡將以疾懼廢求外徙金未達而言漏文穆大怨之時都下有告急變者中貴人夜開禁門捕卒百餘人付臺公一訊情得悉釋其縛中貴人即付詔督促自以捕反者有功及文致獨坐告者誣罪誅之三司更茶法歲課比不登公承詔劾前與議者由丞相而下輕重有法用法持平不為權貴傾撓二宮稱歎時議難之俄兼知審官院四年授龍圖閣待制充北朝國信使副介匪人妄傳眀肅皇太后㫖于虜中寺人虜主問曰太后即有㫖大使宜知公應曰本朝每遣使必謂之曰繼好之事傳示後世兩朝之臣毋相阻猜此乃平時戒使者語非欲達于北朝也虜主大喜即以語附公謝上時皆美公能以副介失辭更為恩好之意還掌貢舉又編近制敕公曉析條義衆皆咨而後定仍乞以新書頒天下許所在條陳其不安者更之既而出知亳州未幾上以審刑案牘之繁召公領之公建言乞促日限以降斷敕及刑名當奏稟者亦乞裁定中典頒下自是無滯獄七年改兵部郎中同判吏部流內銓八年授樞密直學士知益州留侍郊祀乃行眀道改元拜諫議大夫居益部二年值大旱薦飢力為拯濟他郡流冗者歸焉故事每歲官糶粟六萬石與貧民公為先常期增數以出之以故民不太乏久旱水涸苗枯且死公詢舊老得九升江口決以溉田訖今利之又移上供物於他州不飢處將代郡人遮轉運使言願上白留公三年手詔敦獎既而有㫖召公參知政事宰相以益部逺方不可亟還須代歸以拜事緩遂力援他人補之故公命中格及召還止授御史中丞充理檢使入對建言維幾二州地接羌􅊂秦隴商賈交易蕃部驅馬至永康軍場以賣盡熟山川􅊂險道路所出宜徙場境上以絶其覘覦兩川之意又奏疏言時務者五事上深加納之景祐中楊尚二人以罪斥出掖庭公上章引古事為戒杜其復入及依唐故事奏置御史裏行四員以廣言職馬季良在貶賂執政者求致仕遂遣家人撾登聞鼓命始下言事者以謂致政所以優賢季良既以罪廢安可得詔公劾登聞吏不當通其奏公以謂事行不行在丞相府登聞吏無罪何所劾納敕不奉行上韙之議者以為有體不踰年授工部侍郎同知樞密院事公以天下久承平武備不戒願與二府各列武臣才任將率者試用之又乞纂兵法以授邊將上遂自集神武祕略頒焉嶺南蠻寇邊先時必自中發兵多不及事至是公奏置廣南東西路鈐轄司委以便宜專用土兵鎮守北兵不徙瘴癘之地而有以應猝夏賊稱籓日久歲遣人至京師貨易出入民間如家公深以為不便請下詔推恩置館舍遣使接引官為監其貨易若優待逺人者實羈防之也事既下㑹公參知政事不久且出不果行唃􅣳囉與元昊交兵􅣳囉來獻捷朝廷議加節制公獨以謂􅣳囉之族俱籓臣縱不能諭令解仇又以獻捷加賞是激元昊之怒而為中國生患固執不可遂寢陜西轉運使奏乞遷土兵內郡以省轉餉公不可曰此兵世為邊人樂自為戰一旦從去鄉里必怨不可用亦罷其議景祐四年授參知政事占謝之日召坐嘉歎西府之效尋遷户部侍郎是歲定襄地大震星文見變公方在告力疾入對為上陳災異之端且虞夷狄內侮宜下詔求直言消復之術上欣然從之有頃罷知政事改吏部侍郎知應天府三年以西羌擾邊復授北備授公資政殿學士知成德軍入境在道中使齎手詔問攻守方略公畫備禦之策甚詳延州陷沒邊城中人誣以降敵朝廷彂兵監其家公求對力辨戰俗甚苦無降屈之狀上意釋然去守兵或謂貢定不當北衝改知澶州屬以控扼之計數以疾請便郡移亳州郡本多盜公始至諸邑日有剽劫民情騷然公為設策刺取乃府大吏為之囊槖以故益滋不敗密彂卒盡捕得百餘人尸于市郡中震肅訖公去不復有盜轉運使歲斂民力不堪遣牙校齎䡖貨即地所有市之民不知有賦而軍須以給慶曆元年遷尚書左丞拜章固讓有詔褒答眀年請老授太子少傅致仕四年八月十五日薨于京師之里第享年七十三以某年某月葬于許州長杜縣嘉禾鄉之先塋公纍階自將仕郎至正奉大夫勳自騎都尉至上柱國爵自伯至公疏封之寵三加焉公性方嚴質重雖笑言不妄每朝廷有大議論所持堅正形於顔色惟義所在不恤權忌一發于言衆莫敢奪雖燕居未嘗見其惰容治家處身一以素約起微中至貴始終無少異者訓厲諸子蓁然皆成立遇物以誠不為外飾視人困厄必欲力之葬外親貧無竁者二家蔭孤藐不自振者四人使以祿奉其先祀公先夫人蒲氏追封安定郡太君也再娶王氏進封太原郡太君相國文正公之女男八人長曰綱前水部員外郎次綜太常博士集賢校理次絳太子中允次繹次維次績太常寺太祝次緯大理評事次緬太常寺太祝女六人長適端眀殿學士給事中李淑次早卒次適大理評事蘇舜賔次適太常寺太祝王整二人幼未嫁孫男十三人長宗彥大理寺丞次宗道太常寺奉禮郎次宗古次宗哲宗師宗弼將作監主簿餘幼未名孫女十二人長適光祿寺丞李夀朋餘未嫁曽孫女一人舜欽于公族為仍親故稔公風烈敢録其實迹納于太常謹狀
